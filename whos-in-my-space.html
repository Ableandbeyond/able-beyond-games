<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Who's In My Space? 🏫 | Able & Beyond</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --text-dark: #0f172a;
            --here-bg: #dcfce7;
            --here-border: #16a34a;
            --here-text: #14532d;
            --away-bg: #f1f5f9;
            --away-border: #64748b;
            --away-text: #334155;
            --focus-ring: #facc15;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        input {
            user-select: text;
            -webkit-user-select: text;
        }

        body {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        button:focus-visible, input:focus-visible, .focusable:focus-visible {
            outline: 6px solid var(--focus-ring) !important;
            outline-offset: 4px !important;
            box-shadow: 0 0 0 10px rgba(250, 204, 21, 0.45) !important;
            z-index: 30;
        }

        /* ================= TOP BAR ================= */
        .top-bar {
            background: #ffffff;
            border-bottom: 4px solid #cbd5e1;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .btn-home {
            background: #0f172a;
            color: #ffffff;
            border: 3px solid #0f172a;
            border-radius: 18px;
            padding: 10px 18px;
            font-size: 1.15rem;
            font-weight: 900;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #334155;
        }
        .btn-home:active { transform: translateY(3px); box-shadow: 0 1px 0 #334155; }

        .game-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: clamp(1.35rem, 3vw, 2rem);
            font-weight: 900;
            color: #0f172a;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            background: #f1f5f9;
            color: #0f172a;
            border: 3px solid #94a3b8;
            border-radius: 16px;
            padding: 9px 14px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0 #94a3b8;
            transition: all 0.15s;
        }
        .ctrl-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #94a3b8; }
        .ctrl-btn.active {
            background: #dcfce7;
            border-color: #16a34a;
            color: #14532d;
            box-shadow: 0 4px 0 #16a34a;
        }

        .star-pill {
            background: #fef9c3;
            border: 3px solid #eab308;
            color: #854d0e;
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 1.2rem;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ================= 2 SIMPLE PICTURE TABS ================= */
        .mode-tabs {
            max-width: 1120px;
            width: 100%;
            margin: 12px auto 0;
            padding: 0 14px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .mode-tab {
            background: #ffffff;
            border: 4px solid #cbd5e1;
            border-radius: 22px;
            padding: 12px 16px;
            font-family: inherit;
            font-size: clamp(1.15rem, 2.5vw, 1.5rem);
            font-weight: 900;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 0 #cbd5e1;
            transition: all 0.15s;
        }
        .mode-tab .tab-icon {
            font-size: clamp(2rem, 4vw, 2.5rem);
            line-height: 1;
        }
        .mode-tab.active {
            background: #eff6ff;
            border-color: #2563eb;
            color: #1e3a8a;
            box-shadow: 0 5px 0 #2563eb;
            transform: translateY(-2px);
        }

        /* ================= MAIN STAGE ================= */
        .stage-wrap {
            flex: 1;
            max-width: 1120px;
            width: 100%;
            margin: 12px auto 20px;
            padding: 0 14px;
            display: flex;
            flex-direction: column;
        }

        .stage-card {
            background: #ffffff;
            border: 5px solid #cbd5e1;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 18px;
        }

        /* ================= TEACHER QUICK-TYPE BAR ================= */
        .custom-builder-bar {
            background: #eff6ff;
            border: 4px solid #93c5fd;
            border-radius: 24px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .emoji-pick-strip {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .emoji-pick-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 3px solid #cbd5e1;
            background: #ffffff;
            font-size: 1.55rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .emoji-pick-btn.selected {
            border-color: #2563eb;
            background: #dbeafe;
            transform: scale(1.1);
        }

        .custom-text-input {
            flex: 1;
            min-width: 180px;
            padding: 11px 16px;
            border-radius: 16px;
            border: 4px solid #3b82f6;
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 900;
            color: #0f172a;
            background: #ffffff;
            text-transform: uppercase;
        }

        .btn-add-custom {
            background: #2563eb;
            color: #ffffff;
            border: 3px solid #1e3a8a;
            border-radius: 16px;
            padding: 11px 18px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e3a8a;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ================= MODE 1: IN SCHOOL vs AT HOME ZONES ================= */
        .space-zones-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 18px;
            flex: 1;
        }

        .space-zone {
            border-radius: 28px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 310px;
        }

        .zone-here {
            background: var(--here-bg);
            border: 6px solid var(--here-border);
            color: var(--here-text);
            box-shadow: 0 8px 0 #15803d;
        }

        .zone-away {
            background: var(--away-bg);
            border: 6px solid var(--away-border);
            color: var(--away-text);
            box-shadow: 0 8px 0 #475569;
        }

        .zone-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: clamp(1.4rem, 2.8vw, 1.85rem);
            font-weight: 900;
            text-transform: uppercase;
        }

        .people-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 12px;
        }

        .person-card {
            background: #ffffff;
            border: 5px solid #475569;
            border-radius: 24px;
            padding: 14px 10px;
            min-height: 145px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 0 #475569;
            transition: transform 0.15s, border-color 0.15s;
            position: relative;
        }
        .zone-here .person-card {
            border-color: #16a34a;
            box-shadow: 0 6px 0 #15803d;
        }
        .person-card:hover {
            transform: translateY(-4px);
        }
        .person-card:active {
            transform: translateY(3px);
        }

        .person-emoji {
            font-size: clamp(2.8rem, 5vw, 3.6rem);
            line-height: 1;
        }
        .person-name {
            font-size: clamp(1.15rem, 2.4vw, 1.45rem);
            font-weight: 900;
            color: #0f172a;
            text-transform: uppercase;
            text-align: center;
            word-break: break-word;
        }
        .status-dot {
            font-size: 0.9rem;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 999px;
        }
        .zone-here .status-dot {
            background: #dcfce7;
            color: #14532d;
        }
        .zone-away .status-dot {
            background: #e2e8f0;
            color: #334155;
        }

        .delete-person-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
            font-size: 0.85rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* ================= MODE 2: 🙋 HELP ME (1-WORD NEEDS & HELPER MATCH) ================= */
        .needs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .need-btn {
            background: #ffffff;
            border: 5px solid #94a3b8;
            border-radius: 26px;
            padding: 18px 12px;
            min-height: 145px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 7px 0 #94a3b8;
            transition: all 0.15s;
        }
        .need-btn:hover {
            transform: translateY(-4px);
            border-color: #2563eb;
        }
        .need-btn.active-need {
            background: #fef9c3;
            border-color: #eab308;
            box-shadow: 0 0 0 8px rgba(250, 204, 21, 0.45), 0 7px 0 #ca8a04;
            transform: translateY(-4px) scale(1.03);
        }
        .need-emoji {
            font-size: clamp(2.8rem, 5vw, 3.8rem);
            line-height: 1;
        }
        .need-word {
            font-size: clamp(1.35rem, 2.8vw, 1.8rem);
            font-weight: 900;
            color: #0f172a;
            text-transform: uppercase;
        }

        .helper-match-banner {
            background: #dcfce7;
            border: 6px solid #16a34a;
            border-radius: 28px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        @media (max-width: 820px) {
            .mode-tabs { grid-template-columns: 1fr; }
            .space-zones-grid { grid-template-columns: 1fr; }
            .needs-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="top-bar">
        <a href="https://games.ableandbeyond.support/index.html" class="btn-home" aria-label="Back to Game Hub">
            ⬅️ Hub
        </a>

        <div class="game-title">
            <span>🏫</span>
            <span>Who's In My Space?</span>
        </div>

        <div class="top-controls">
            <button type="button" id="btn-builder-toggle" class="ctrl-btn active" onclick="toggleBuilderBar()" title="Show or Hide Add Person Bar">
                ✏️ Add Person
            </button>
            <button type="button" id="btn-voice" class="ctrl-btn active" onclick="toggleVoice()" title="Toggle 1-Word Voice">
                🗣️ Voice
            </button>
            <button type="button" id="btn-sound" class="ctrl-btn active" onclick="toggleSound()" title="Toggle Musical Sounds">
                🎵 Sound
            </button>
            <button type="button" class="ctrl-btn" onclick="resetAllHere()" title="Set Everyone In School">
                🔄 All Here
            </button>
            <div class="star-pill" aria-label="Stars earned">
                ⭐ <span id="star-count">0</span>
            </div>
        </div>
    </header>

    <!-- 2 SIMPLE PICTURE TABS -->
    <nav class="mode-tabs" aria-label="Space Modes">
        <button type="button" class="mode-tab active" id="tab-board" onclick="setMode('board')">
            <span class="tab-icon">🏫</span>
            <span>1. In School Today</span>
        </button>
        <button type="button" class="mode-tab" id="tab-help" onclick="setMode('help')">
            <span class="tab-icon">🙋</span>
            <span>2. Help Me!</span>
        </button>
    </nav>

    <!-- MAIN STAGE -->
    <main class="stage-wrap">
        <div id="stage-content" class="stage-card">
            <!-- Populated by JS -->
        </div>
    </main>

    <script>
        /* ================================================================
           1. PRE-LOADED GENERIC PEOPLE + 1-WORD NEEDS
           ================================================================ */
        const DEFAULT_PEOPLE = [
            { id: 'teacher', name: 'TEACHER', emoji: '🧑‍🏫', here: true,  custom: false },
            { id: 'helper',  name: 'HELPER',  emoji: '🤝',   here: true,  custom: false },
            { id: 'nurse',   name: 'NURSE',   emoji: '🧑‍⚕️', here: true,  custom: false },
            { id: 'cook',    name: 'COOK',    emoji: '🧑‍🍳', here: true,  custom: false },
            { id: 'driver',  name: 'DRIVER',  emoji: '🚌',   here: false, custom: false },
            { id: 'friend',  name: 'FRIEND',  emoji: '🧒',   here: true,  custom: false }
        ];

        const AVATAR_EMOJIS = ['🧑‍🏫', '🤝', '🧑‍⚕️', '🧑‍🍳', '🚌', '🧒', '🧑‍💼', '🎵', '⚽', '🎨', '🧹', '⭐'];

        const NEEDS = [
            { id: 'toilet', word: 'TOILET', emoji: '🚽', helperEmoji: '🤝',   helperWord: 'HELPER' },
            { id: 'hurt',   word: 'HURT',   emoji: '🩹', helperEmoji: '🧑‍⚕️', helperWord: 'NURSE' },
            { id: 'hungry', word: 'HUNGRY', emoji: '🍎', helperEmoji: '🧑‍🍳', helperWord: 'COOK' },
            { id: 'quiet',  word: 'QUIET',  emoji: '🎧', helperEmoji: '🧑‍🏫', helperWord: 'TEACHER' },
            { id: 'bus',    word: 'BUS',    emoji: '🚌', helperEmoji: '🚌',   helperWord: 'DRIVER' },
            { id: 'help',   word: 'HELP',   emoji: '🙋', helperEmoji: '🧑‍🏫', helperWord: 'TEACHER' }
        ];

        function loadRoster() {
            try {
                const saved = localStorage.getItem('ab_space_roster_v2');
                if (saved) return JSON.parse(saved);
            } catch (e) {}
            return JSON.parse(JSON.stringify(DEFAULT_PEOPLE));
        }

        function saveRoster(list) {
            try {
                localStorage.setItem('ab_space_roster_v2', JSON.stringify(list));
            } catch (e) {}
        }

        /* ================================================================
           2. STATE & WEB AUDIO + 1-WORD TTS
           ================================================================ */
        const state = {
            mode: 'board',
            showBuilder: true,
            selectedEmoji: '🧑‍🏫',
            customName: '',
            voiceOn: true,
            soundOn: true,
            stars: parseInt(localStorage.getItem('ab_space_stars') || '0', 10),
            people: loadRoster(),
            activeNeed: NEEDS[0]
        };

        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playNotes(freqs, type = 'triangle', spacing = 0.09, duration = 0.36) {
            if (!state.soundOn) return;
            const ctx = getAudioCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            freqs.forEach((f, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(f, now + idx * spacing);
                gain.gain.setValueAtTime(0.001, now + idx * spacing);
                gain.gain.exponentialRampToValueAtTime(0.24, now + idx * spacing + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * spacing + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + idx * spacing);
                osc.stop(now + idx * spacing + duration + 0.02);
            });
        }

        function playTapChime() {
            playNotes([523.25, 659.25], 'sine', 0.07, 0.28);
        }

        function playWinChime() {
            playNotes([523.25, 659.25, 783.99, 1046.50], 'triangle', 0.09, 0.45);
        }

        function speakWord(text) {
            if (!state.voiceOn || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-GB';
                u.rate = 0.92;
                u.pitch = 1.05;
                window.speechSynthesis.speak(u);
            } catch (e) {}
        }

        function addStar() {
            state.stars += 1;
            localStorage.setItem('ab_space_stars', String(state.stars));
            document.getElementById('star-count').textContent = state.stars;
            if (typeof confetti === 'function') {
                confetti({ particleCount: 45, spread: 65, origin: { y: 0.7 } });
            }
        }

        /* ================================================================
           3. HEADER CONTROLS & TABS
           ================================================================ */
        function toggleBuilderBar() {
            state.showBuilder = !state.showBuilder;
            document.getElementById('btn-builder-toggle').classList.toggle('active', state.showBuilder);
            if (state.mode === 'board') renderBoardMode();
        }

        function toggleVoice() {
            state.voiceOn = !state.voiceOn;
            document.getElementById('btn-voice').classList.toggle('active', state.voiceOn);
            if (state.voiceOn) speakWord('Voice On');
        }

        function toggleSound() {
            state.soundOn = !state.soundOn;
            document.getElementById('btn-sound').classList.toggle('active', state.soundOn);
            if (state.soundOn) playWinChime();
        }

        function resetAllHere() {
            state.people.forEach(p => { p.here = true; });
            saveRoster(state.people);
            playWinChime();
            speakWord('In School');
            if (state.mode === 'board') renderBoardMode();
        }

        function setMode(mode) {
            state.mode = mode;
            document.getElementById('tab-board').classList.toggle('active', mode === 'board');
            document.getElementById('tab-help').classList.toggle('active', mode === 'help');
            if (mode === 'board') renderBoardMode();
            else renderHelpMode();
        }

        /* ================================================================
           4. MODE 1: 🏫 IN SCHOOL TODAY vs AT HOME BOARD
           ================================================================ */
        function renderBoardMode() {
            const box = document.getElementById('stage-content');
            const hereList = state.people.filter(p => p.here);
            const awayList = state.people.filter(p => !p.here);

            box.innerHTML = `
                ${state.showBuilder ? `
                    <div class="custom-builder-bar">
                        <div class="emoji-pick-strip">
                            ${AVATAR_EMOJIS.map(em => `
                                <button type="button"
                                        class="emoji-pick-btn ${state.selectedEmoji === em ? 'selected' : ''}"
                                        onclick="pickPersonEmoji('${em}')">
                                    ${em}
                                </button>
                            `).join('')}
                        </div>
                        <input type="text"
                               id="custom-person-input"
                               class="custom-text-input"
                               placeholder="TYPE NAME (E.G. SARAH, MR TOM)..."
                               value="${state.customName}"
                               oninput="state.customName = this.value"
                               onkeydown="if(event.key === 'Enter'){ event.preventDefault(); addCustomPerson(); }" />
                        <button type="button" class="btn-add-custom" onclick="addCustomPerson()">
                            ➕ Add Person
                        </button>
                    </div>
                ` : ''}

                <div class="space-zones-grid">
                    <!-- GREEN IN SCHOOL ZONE -->
                    <div class="space-zone zone-here"
                         ondragover="event.preventDefault()"
                         ondrop="onZoneDrop(event, true)">
                        <div class="zone-header">
                            <span>🟢 IN SCHOOL</span>
                            <span>${hereList.length}</span>
                        </div>
                        <div class="people-grid">
                            ${hereList.map(p => renderPersonCardHTML(p)).join('')}
                        </div>
                    </div>

                    <!-- GREY AT HOME ZONE -->
                    <div class="space-zone zone-away"
                         ondragover="event.preventDefault()"
                         ondrop="onZoneDrop(event, false)">
                        <div class="zone-header">
                            <span>🏠 AT HOME</span>
                            <span>${awayList.length}</span>
                        </div>
                        <div class="people-grid">
                            ${awayList.map(p => renderPersonCardHTML(p)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderPersonCardHTML(p) {
            return `
                <button type="button"
                        class="person-card"
                        draggable="true"
                        ondragstart="event.dataTransfer.setData('text/plain', '${p.id}')"
                        onclick="togglePersonHere('${p.id}')">
                    ${p.custom ? `
                        <span class="delete-person-btn" onclick="deletePerson(event, '${p.id}')" title="Remove">✕</span>
                    ` : ''}
                    <span class="person-emoji">${p.emoji}</span>
                    <span class="person-name">${p.name}</span>
                    <span class="status-dot">${p.here ? '🟢 HERE' : '🏠 HOME'}</span>
                </button>
            `;
        }

        function pickPersonEmoji(em) {
            state.selectedEmoji = em;
            playTapChime();
            renderBoardMode();
            const inp = document.getElementById('custom-person-input');
            if (inp) inp.focus();
        }

        function addCustomPerson() {
            const raw = (state.customName || '').trim().toUpperCase();
            if (!raw) {
                const inp = document.getElementById('custom-person-input');
                if (inp) inp.focus();
                return;
            }
            const newPerson = {
                id: 'p_' + Date.now(),
                name: raw,
                emoji: state.selectedEmoji || '🧑‍🏫',
                here: true,
                custom: true
            };
            state.people.push(newPerson);
            saveRoster(state.people);
            state.customName = '';
            playWinChime();
            speakWord(newPerson.name);
            addStar();
            renderBoardMode();
        }

        function deletePerson(e, id) {
            e.stopPropagation();
            state.people = state.people.filter(p => p.id !== id);
            saveRoster(state.people);
            renderBoardMode();
        }

        function togglePersonHere(id) {
            const p = state.people.find(x => x.id === id);
            if (!p) return;
            p.here = !p.here;
            saveRoster(state.people);
            playTapChime();
            speakWord(p.name + (p.here ? ' In School' : ' At Home'));
            renderBoardMode();
        }

        function onZoneDrop(e, isHereZone) {
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            const p = state.people.find(x => x.id === id);
            if (!p) return;
            p.here = isHereZone;
            saveRoster(state.people);
            playTapChime();
            speakWord(p.name + (p.here ? ' In School' : ' At Home'));
            renderBoardMode();
        }

        /* ================================================================
           5. MODE 2: 🙋 HELP ME! (1-WORD NEEDS & HELPER MATCH)
           ================================================================ */
        function renderHelpMode() {
            const box = document.getElementById('stage-content');
            const n = state.activeNeed;

            box.innerHTML = `
                <div class="needs-grid">
                    ${NEEDS.map(item => `
                        <button type="button"
                                class="need-btn ${n && n.id === item.id ? 'active-need' : ''}"
                                onclick="pickNeed('${item.id}')">
                            <span class="need-emoji">${item.emoji}</span>
                            <span class="need-word">${item.word}</span>
                        </button>
                    `).join('')}
                </div>

                ${n ? `
                    <div class="helper-match-banner" onclick="speakWord('${n.word}. ${n.helperWord}')">
                        <div style="display:flex;align-items:center;gap:12px;">
                            <span style="font-size:3.8rem;">${n.emoji}</span>
                            <span style="font-size:2rem;font-weight:900;color:#14532d;">${n.word}</span>
                        </div>
                        <span style="font-size:2.8rem;font-weight:900;color:#16a34a;">➡️</span>
                        <div style="display:flex;align-items:center;gap:12px;background:#ffffff;padding:12px 24px;border-radius:24px;border:4px solid #16a34a;">
                            <span style="font-size:3.8rem;">${n.helperEmoji}</span>
                            <span style="font-size:2rem;font-weight:900;color:#14532d;">${n.helperWord}</span>
                        </div>
                    </div>
                ` : ''}
            `;
        }

        function pickNeed(id) {
            const item = NEEDS.find(x => x.id === id);
            if (!item) return;
            state.activeNeed = item;
            playWinChime();
            speakWord(item.word + '. ' + item.helperWord);
            addStar();
            renderHelpMode();
        }

        // Boot
        document.getElementById('star-count').textContent = state.stars;
        renderBoardMode();
    </script>
</body>
</html>
