<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Build a Body Studio | Able & Beyond</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Top Navigation & Customizer Bar -->
        <header class="top-bar">
            <div class="top-left">
                <a class="nav-back-btn" href="https://games.ableandbeyond.support/index.html">
                    ⬅️ Hub
                </a>
                <div class="brand-title">
                    <span class="brand-icon">🧍</span>
                    <span>Build a Body</span>
                </div>
            </div>

            <div class="level-tabs" role="tablist" aria-label="Game Modes">
                <button id="tab-lvl-1" class="lvl-tab active" onclick="startGame(1)">
                    🧩 1. Easy (6 Parts)
                </button>
                <button id="tab-lvl-2" class="lvl-tab" onclick="startGame(2)">
                    🧍 2. Full (10 Parts)
                </button>
                <button id="tab-lvl-3" class="lvl-tab quiz-tab" onclick="startGame(3)">
                    🧠 3. Body Quiz
                </button>
            </div>

            <div class="customizer-bar">
                <div class="swatch-group" aria-label="Skin Tone">
                    <span class="swatch-label">Skin:</span>
                    <button class="swatch-btn active" style="background:#FFE0BD;" onclick="setSkinTone(0)" title="Warm Light"></button>
                    <button class="swatch-btn" style="background:#F1C27D;" onclick="setSkinTone(1)" title="Golden Peach"></button>
                    <button class="swatch-btn" style="background:#C68642;" onclick="setSkinTone(2)" title="Warm Bronze"></button>
                    <button class="swatch-btn" style="background:#7B4B2A;" onclick="setSkinTone(3)" title="Deep Brown"></button>
                </div>
                <div class="swatch-group" aria-label="Outfit Colour">
                    <span class="swatch-label">Outfit:</span>
                    <button class="outfit-btn active" style="background:#10B981;" onclick="setOutfitTheme(0)" title="Emerald Green"></button>
                    <button class="outfit-btn" style="background:#3B82F6;" onclick="setOutfitTheme(1)" title="Ocean Blue"></button>
                    <button class="outfit-btn" style="background:#F43F5E;" onclick="setOutfitTheme(2)" title="Berry Red"></button>
                    <button class="outfit-btn" style="background:#8B5CF6;" onclick="setOutfitTheme(3)" title="Sunny Purple"></button>
                </div>
            </div>
        </header>

        <!-- Friendly Prompt & Progress Banner -->
        <section class="prompt-banner" onclick="repeatPrompt()">
            <button class="speak-btn" title="Read Aloud">
                🔊
            </button>
            <div class="prompt-content">
                <div id="prompt-title" class="prompt-title">Tap or drag a body part to build your friend!</div>
                <div id="prompt-sub" class="prompt-sub">👉 Tap a card once to highlight where it goes, then tap the glowing outline!</div>
            </div>
            <div class="progress-pill">
                <span>⭐</span>
                <span id="progress-text">0 / 6</span>
            </div>
        </section>

        <!-- Main Studio Layout -->
        <main class="studio-layout">
            <!-- Left/Center: Character Canvas -->
            <div class="workspace" id="workspace">
                <div class="stage-card">
                    <svg viewBox="0 0 400 500" id="body-svg" xmlns="http://www.w3.org/2000/svg">
                        <!-- Generated dynamically by app.js -->
                    </svg>
                </div>
            </div>

            <!-- Right: Zoomed & Labeled Parts Dock (or Quiz Helper) -->
            <aside class="dock-container" id="dock-container">
                <div class="dock-header">
                    <span id="dock-title">🧩 Body Parts Tray</span>
                    <span id="dock-hint" class="dock-hint">Tap or Drag</span>
                </div>
                <div class="dock" id="dock">
                    <!-- Pieces generated by app.js -->
                </div>
            </aside>
        </main>

        <!-- Celebration Modal -->
        <div id="celebration-overlay" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-emoji">🎉🌟🧍</div>
                <h2 id="win-title">Amazing Job!</h2>
                <p id="win-desc">You built the whole body and learned how every part works!</p>
                <div class="modal-actions">
                    <button class="action-btn primary" onclick="nextLevelAction()">Next Challenge ➔</button>
                    <button class="action-btn secondary" onclick="startGame(currentLevel)">Play Again 🔄</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=5"></script>
</body>
</html>
