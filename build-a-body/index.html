<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Build a Body</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
    <!-- Confetti for celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Home Screen -->
        <div id="home-screen" class="screen">
            <h1>Build a Body</h1>
            <p>Select a level to play</p>
            <div class="level-select">
                <button class="level-btn" onclick="startGame(1)">
                    <h2>Level 1</h2>
                    <p>Easy (6 Parts)</p>
                </button>
                <button class="level-btn" onclick="startGame(2)">
                    <h2>Level 2</h2>
                    <p>Hard (10 Parts)</p>
                </button>
            </div>
            <button class="back-home-btn" onclick="window.location.href='../index.html'">← Back to Main Menu</button>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <button class="back-btn" onclick="showHome()">← Back</button>
            
            <div class="game-layout">
                <!-- Workspace: Body Outline -->
                <div class="workspace" id="workspace">
                    <svg viewBox="0 0 400 600" id="body-svg" xmlns="http://www.w3.org/2000/svg">
                        <!-- Outlines and Drop Zones generated by JS -->
                    </svg>
                </div>
                
                <!-- Dock: Draggable/Selectable Parts -->
                <div class="dock-container">
                    <div class="dock-title">Body Parts</div>
                    <div class="dock" id="dock">
                        <!-- Pieces generated by JS -->
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Celebration Overlay -->
        <div id="celebration-overlay" class="hidden">
            <h2>Great Job!</h2>
            <button class="level-btn" onclick="showHome()">Play Again</button>
        </div>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
