<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Zen Zone: Calm Tidying &amp; Sensory Sanctuary | Able &amp; Beyond</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Outfit', system-ui, sans-serif;
            background: linear-gradient(135deg, #F0FDF4 0%, #E0F2FE 100%);
            color: #1E293B;
        }

        button:focus-visible,
        [tabindex="0"]:focus-visible {
            outline: 6px solid #F59E0B !important;
            outline-offset: 4px !important;
            box-shadow: 0 0 0 10px rgba(245, 158, 11, 0.35) !important;
        }

        .app {
            max-width: 1220px;
            margin: 0 auto;
            padding: 14px 18px 28px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 100vh;
        }

        /* --- Simple Top Bar --- */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .back-btn {
            min-height: 74px;
            padding: 12px 24px;
            border-radius: 22px;
            background: #FFFFFF;
            color: #0F172A;
            border: 4px solid #CBD5E1;
            font-family: inherit;
            font-size: 1.45rem;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 6px 0 #94A3B8;
        }

        .back-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #94A3B8;
        }

        .top-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .star-pill {
            min-height: 74px;
            padding: 10px 22px;
            border-radius: 22px;
            background: #FEF9C3;
            color: #854D0E;
            border: 4px solid #EAB308;
            font-size: 1.45rem;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .icon-toggle-btn {
            min-height: 74px;
            padding: 10px 20px;
            border-radius: 22px;
            background: #FFFFFF;
            color: #0F172A;
            border: 4px solid #CBD5E1;
            font-family: inherit;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 0 #94A3B8;
        }

        .icon-toggle-btn.active {
            background: #DCFCE7;
            border-color: #22C55E;
            color: #14532D;
            box-shadow: 0 6px 0 #16A34A;
        }

        /* --- 4 Giant Room Picture Tabs --- */
        .room-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .room-tab {
            min-height: 104px;
            border-radius: 24px;
            background: #FFFFFF;
            color: #1E293B;
            border: 4px solid #CBD5E1;
            font-family: inherit;
            font-size: 1.45rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 7px 0 #94A3B8;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        .room-tab:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #94A3B8;
        }

        .room-tab-emoji {
            font-size: 3.1rem;
            line-height: 1;
        }

        .room-tab.active-bedroom { background: #E0F2FE; border-color: #0284C7; color: #0C4A6E; box-shadow: 0 7px 0 #0369A1; }
        .room-tab.active-classroom { background: #FEF3C7; border-color: #D97706; color: #78350F; box-shadow: 0 7px 0 #B45309; }
        .room-tab.active-garden { background: #DCFCE7; border-color: #16A34A; color: #14532D; box-shadow: 0 7px 0 #15803D; }
        .room-tab.active-bubbles { background: #F3E8FF; border-color: #9333EA; color: #581C87; box-shadow: 0 7px 0 #7E22CE; }

        /* --- Main Zen Workspace --- */
        .zen-stage {
            flex: 1;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 32px;
            border: 5px solid #CBD5E1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 22px;
            min-height: 520px;
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.06);
        }

        /* --- 3 Giant Sorting Baskets --- */
        .baskets-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
        }

        .zen-basket {
            min-height: 175px;
            border-radius: 26px;
            background: #F8FAFC;
            border: 5px dashed #94A3B8;
            padding: 16px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .zen-basket.basket-glow {
            background: #DCFCE7;
            border-style: solid;
            border-color: #16A34A;
            box-shadow: 0 0 28px rgba(34, 197, 94, 0.45);
            transform: scale(1.03);
            animation: gentlePulse 1s infinite alternate ease-in-out;
        }

        @keyframes gentlePulse {
            0% { transform: scale(1.01); }
            100% { transform: scale(1.05); }
        }

        .basket-emoji {
            font-size: 4.2rem;
            line-height: 1;
        }

        .basket-title {
            font-size: 1.65rem;
            font-weight: 800;
            color: #0F172A;
        }

        .basket-collected {
            display: flex;
            gap: 6px;
            font-size: 2.2rem;
            min-height: 42px;
            align-items: center;
            justify-content: center;
        }

        /* --- 6 Giant Tidy Item Cards --- */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .tidy-card {
            min-height: 155px;
            border-radius: 26px;
            background: #FFFFFF;
            border: 5px solid #CBD5E1;
            padding: 16px;
            cursor: grab;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 0 #94A3B8;
            transition: all 0.2s cubic-bezier(0.18, 1.3, 0.4, 1);
            font-family: inherit;
        }

        .tidy-card:hover:not(.tidied) {
            transform: translateY(-4px);
            border-color: #38BDF8;
        }

        .tidy-card.selected-item {
            background: #FEF9C3;
            border-color: #EAB308;
            box-shadow: 0 8px 0 #CA8A04, 0 0 25px rgba(250, 204, 21, 0.55);
            transform: scale(1.05);
        }

        .tidy-card.tidied {
            opacity: 0.25;
            pointer-events: none;
            border-style: dashed;
            box-shadow: none;
            transform: scale(0.92);
        }

        .tidy-emoji {
            font-size: 4.4rem;
            line-height: 1;
        }

        .tidy-name {
            font-size: 1.45rem;
            font-weight: 800;
            color: #0F172A;
        }

        /* --- Room 4: Calm Sensory Bubble Wrap & Breathing --- */
        .bubble-wrap-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            flex: 1;
            align-items: center;
        }

        .sensory-bubble {
            min-height: 145px;
            border-radius: 50%;
            width: 145px;
            height: 145px;
            margin: 0 auto;
            background: radial-gradient(circle at 32% 32%, #FFFFFF 0%, #BAE6FD 45%, #38BDF8 100%);
            border: 5px solid #0284C7;
            box-shadow: 0 10px 22px rgba(2, 132, 199, 0.28), inset 0 0 18px rgba(255,255,255,0.8);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 3.4rem;
            transition: transform 0.2s cubic-bezier(0.18, 1.4, 0.4, 1), opacity 0.25s ease;
        }

        .sensory-bubble:hover {
            transform: scale(1.07);
        }

        .sensory-bubble.popped {
            background: #F1F5F9;
            border-color: #CBD5E1;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.06);
            transform: scale(0.84);
            opacity: 0.55;
        }

        /* Celebration Banner */
        .win-banner {
            background: #DCFCE7;
            border: 4px solid #16A34A;
            border-radius: 24px;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
        }

        .win-text {
            font-size: 1.75rem;
            font-weight: 800;
            color: #14532D;
        }

        .next-room-btn {
            min-height: 74px;
            padding: 12px 28px;
            border-radius: 20px;
            background: #16A34A;
            color: #FFFFFF;
            border: 4px solid #14532D;
            font-family: inherit;
            font-size: 1.45rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 #14532D;
        }

        @media (max-width: 820px) {
            .room-tabs { grid-template-columns: repeat(2, 1fr); }
            .baskets-grid { grid-template-columns: 1fr; }
            .items-grid { grid-template-columns: repeat(2, 1fr); }
            .bubble-wrap-grid { grid-template-columns: repeat(3, 1fr); }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Clean Top Bar -->
        <header class="top-bar">
            <a href="https://games.ableandbeyond.support/index.html" onclick="goHome(event)" class="back-btn">
                <span>⬅️</span>
                <span>Home</span>
            </a>

            <div class="top-controls">
                <div class="star-pill" title="Calm Stars Earned">
                    <span>🌿</span>
                    <span id="zen-stars">0</span>
                </div>
                <button id="voice-btn" class="icon-toggle-btn active" onclick="toggleVoice()">
                    <span id="voice-emoji">🔊</span>
                    <span id="voice-text">Words: ON</span>
                </button>
                <button class="icon-toggle-btn" onclick="resetRoom()">
                    <span>🔄</span>
                    <span>Reset</span>
                </button>
            </div>
        </header>

        <!-- 4 Giant Picture Room Tabs -->
        <nav class="room-tabs" aria-label="Zen Rooms">
            <button id="tab-bedroom" class="room-tab active-bedroom" onclick="openRoom('bedroom')">
                <span class="room-tab-emoji">🛏️</span>
                <span>Bedroom</span>
            </button>
            <button id="tab-classroom" class="room-tab" onclick="openRoom('classroom')">
                <span class="room-tab-emoji">🏫</span>
                <span>Classroom</span>
            </button>
            <button id="tab-garden" class="room-tab" onclick="openRoom('garden')">
                <span class="room-tab-emoji">🌸</span>
                <span>Zen Garden</span>
            </button>
            <button id="tab-bubbles" class="room-tab" onclick="openRoom('bubbles')">
                <span class="room-tab-emoji">🫧</span>
                <span>Calm Pop</span>
            </button>
        </nav>

        <!-- Giant Zen Stage -->
        <main id="zen-stage" class="zen-stage" role="main">
            <!-- Populated by JS -->
        </main>
    </div>

    <script>
        const ROOM_DATA = {
            bedroom: {
                baskets: [
                    { id: 'toys', emoji: '🧩', title: 'Toys' },
                    { id: 'clothes', emoji: '👕', title: 'Clothes' },
                    { id: 'books', emoji: '📚', title: 'Books' }
                ],
                items: [
                    { id: 'b1', cat: 'toys', emoji: '🧸', word: 'Teddy' },
                    { id: 'b2', cat: 'clothes', emoji: '👕', word: 'Shirt' },
                    { id: 'b3', cat: 'books', emoji: '📖', word: 'Book' },
                    { id: 'b4', cat: 'toys', emoji: '🚗', word: 'Car' },
                    { id: 'b5', cat: 'clothes', emoji: '🧦', word: 'Socks' },
                    { id: 'b6', cat: 'books', emoji: '🎨', word: 'Art Pad' }
                ]
            },
            classroom: {
                baskets: [
                    { id: 'art', emoji: '✏️', title: 'Art Tray' },
                    { id: 'play', emoji: '🧱', title: 'Play Box' },
                    { id: 'lunch', emoji: '🎒', title: 'Lunch Bag' }
                ],
                items: [
                    { id: 'c1', cat: 'art', emoji: '🖍️', word: 'Crayon' },
                    { id: 'c2', cat: 'play', emoji: '🧩', word: 'Puzzle' },
                    { id: 'c3', cat: 'lunch', emoji: '🍎', word: 'Apple' },
                    { id: 'c4', cat: 'art', emoji: '✏️', word: 'Pencil' },
                    { id: 'c5', cat: 'play', emoji: '🧱', word: 'Blocks' },
                    { id: 'c6', cat: 'lunch', emoji: '🧃', word: 'Juice' }
                ]
            },
            garden: {
                baskets: [
                    { id: 'stones', emoji: '🪨', title: 'Stones' },
                    { id: 'flowers', emoji: '🌸', title: 'Flowers' },
                    { id: 'leaves', emoji: '🍃', title: 'Leaves' }
                ],
                items: [
                    { id: 'g1', cat: 'stones', emoji: '🪨', word: 'Stone' },
                    { id: 'g2', cat: 'flowers', emoji: '🌸', word: 'Lotus' },
                    { id: 'g3', cat: 'leaves', emoji: '🍃', word: 'Leaf' },
                    { id: 'g4', cat: 'stones', emoji: '🐚', word: 'Shell' },
                    { id: 'g5', cat: 'flowers', emoji: '🌺', word: 'Flower' },
                    { id: 'g6', cat: 'leaves', emoji: '🌿', word: 'Bamboo' }
                ]
            }
        };

        const state = {
            room: 'bedroom', // 'bedroom' | 'classroom' | 'garden' | 'bubbles'
            voiceOn: true,
            stars: 0,
            selectedItemId: null,
            tidiedIds: [],
            bubblesPopped: [false, false, false, false, false, false, false, false]
        };

        function loadSavedStars() {
            try {
                const s = localStorage.getItem('ab_zen_stars');
                if (s !== null) state.stars = parseInt(s, 10) || 0;
            } catch (e) {}
            document.getElementById('zen-stars').textContent = state.stars;
        }

        function addZenStar() {
            state.stars++;
            document.getElementById('zen-stars').textContent = state.stars;
            try { localStorage.setItem('ab_zen_stars', String(state.stars)); } catch (e) {}
        }

        function goHome(e) {
            if (window.location.hostname === 'games.ableandbeyond.support' || window.location.protocol === 'file:') {
                e.preventDefault();
                if (window.location.pathname.includes('/zen-zone/')) {
                    window.location.href = '../index.html';
                } else {
                    window.location.href = 'index.html';
                }
            }
        }

        // --- Soothing Pentatonic Harp & Water Droplet Audio Synthesizer ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioCtx ? new AudioCtx() : null;
        const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

        function playZenSound(type, noteIdx = 0) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'select') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const freq = PENTATONIC[noteIdx % PENTATONIC.length];
                osc.frequency.setValueAtTime(freq, now);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.36);
            } else if (type === 'place') {
                // Warm 2-note harp chime
                [392.00, 523.25].forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + i * 0.08);
                    gain.gain.setValueAtTime(0.22, now + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.55);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.08);
                    osc.stop(now + i * 0.08 + 0.58);
                });
            } else if (type === 'bubble') {
                // Soft water droplet pop + singing bowl shimmer
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                const base = PENTATONIC[noteIdx % PENTATONIC.length];
                osc.frequency.setValueAtTime(base * 0.8, now);
                osc.frequency.exponentialRampToValueAtTime(base * 1.6, now + 0.14);
                gain.gain.setValueAtTime(0.24, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.42);
            } else if (type === 'complete') {
                [261.63, 329.63, 392.00, 523.25, 659.25].forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + i * 0.09);
                    gain.gain.setValueAtTime(0.22, now + i * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.65);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.09);
                    osc.stop(now + i * 0.09 + 0.68);
                });
            }
        }

        function sayWord(word) {
            if (!state.voiceOn) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(word);
                u.rate = 0.88;
                u.pitch = 1.02;
                window.speechSynthesis.speak(u);
            }
        }

        function toggleVoice() {
            state.voiceOn = !state.voiceOn;
            const btn = document.getElementById('voice-btn');
            btn.classList.toggle('active', state.voiceOn);
            document.getElementById('voice-emoji').textContent = state.voiceOn ? '🔊' : '🔇';
            document.getElementById('voice-text').textContent = state.voiceOn ? 'Words: ON' : 'Words: OFF';
            if (!state.voiceOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function openRoom(roomKey) {
            state.room = roomKey;
            state.selectedItemId = null;
            state.tidiedIds = [];
            state.bubblesPopped = [false, false, false, false, false, false, false, false];
            playZenSound('select', 2);

            ['bedroom', 'classroom', 'garden', 'bubbles'].forEach(r => {
                const tab = document.getElementById(`tab-${r}`);
                if (tab) tab.className = 'room-tab' + (r === roomKey ? ` active-${r}` : '');
            });

            renderStage();
        }

        function resetRoom() {
            openRoom(state.room);
        }

        function nextRoom() {
            const order = ['bedroom', 'classroom', 'garden', 'bubbles'];
            const next = order[(order.indexOf(state.room) + 1) % order.length];
            openRoom(next);
        }

        function renderStage() {
            const stage = document.getElementById('zen-stage');
            if (state.room === 'bubbles') {
                renderBubbleSanctuary(stage);
                return;
            }

            const data = ROOM_DATA[state.room];
            const selectedItem = data.items.find(i => i.id === state.selectedItemId);
            const allDone = state.tidiedIds.length === data.items.length;

            // Render 3 Giant Baskets
            const basketsHtml = data.baskets.map(b => {
                const isTarget = selectedItem && selectedItem.cat === b.id;
                const collectedEmojis = data.items
                    .filter(i => i.cat === b.id && state.tidiedIds.includes(i.id))
                    .map(i => `<span>${i.emoji}</span>`)
                    .join('');

                return `
                    <button class="zen-basket ${isTarget ? 'basket-glow' : ''}"
                            ondragover="event.preventDefault()"
                            ondrop="handleBasketDrop(event, '${b.id}')"
                            onclick="handleBasketTap('${b.id}')">
                        <span class="basket-emoji">${b.emoji}</span>
                        <span class="basket-title">${b.title}</span>
                        <div class="basket-collected">${collectedEmojis || '<span style="font-size:1rem; color:#94A3B8; font-weight:700;">Tap or Drop Here</span>'}</div>
                    </button>
                `;
            }).join('');

            // Render 6 Giant Item Cards
            const itemsHtml = data.items.map((item, idx) => {
                const isTidied = state.tidiedIds.includes(item.id);
                const isSelected = state.selectedItemId === item.id;
                return `
                    <button class="tidy-card ${isTidied ? 'tidied' : ''} ${isSelected ? 'selected-item' : ''}"
                            draggable="${!isTidied}"
                            ondragstart="handleItemDragStart(event, '${item.id}')"
                            onclick="handleItemTap('${item.id}', ${idx})">
                        <span class="tidy-emoji">${item.emoji}</span>
                        <span class="tidy-name">${item.word}</span>
                    </button>
                `;
            }).join('');

            const winBannerHtml = allDone ? `
                <div class="win-banner">
                    <div class="win-text">✨ Peaceful &amp; Tidy! Great Job!</div>
                    <button class="next-room-btn" onclick="nextRoom()">Next Room ➔</button>
                </div>
            ` : '';

            stage.innerHTML = `
                ${winBannerHtml}
                <div class="baskets-grid">${basketsHtml}</div>
                <div class="items-grid">${itemsHtml}</div>
            `;
        }

        function handleItemDragStart(e, itemId) {
            state.selectedItemId = itemId;
            e.dataTransfer.setData('text/plain', itemId);
        }

        function handleBasketDrop(e, basketId) {
            e.preventDefault();
            const itemId = e.dataTransfer.getData('text/plain') || state.selectedItemId;
            if (!itemId) return;
            state.selectedItemId = itemId;
            handleBasketTap(basketId);
        }

        function handleItemTap(itemId, idx) {
            if (state.tidiedIds.includes(itemId)) return;
            const data = ROOM_DATA[state.room];
            const item = data.items.find(i => i.id === itemId);
            if (!item) return;

            // Tapping an already-selected card a second time auto-places it into its matching basket!
            if (state.selectedItemId === itemId) {
                tidyItemSuccess(item);
                return;
            }

            state.selectedItemId = itemId;
            playZenSound('select', idx);
            sayWord(item.word);
            renderStage();
        }

        function handleBasketTap(basketId) {
            const data = ROOM_DATA[state.room];
            const basket = data.baskets.find(b => b.id === basketId);

            if (!state.selectedItemId) {
                // If no item is selected yet, automatically pick the first untidied item for that basket!
                const matchingUntidied = data.items.find(i => i.cat === basketId && !state.tidiedIds.includes(i.id));
                if (matchingUntidied) {
                    tidyItemSuccess(matchingUntidied);
                } else if (basket) {
                    sayWord(basket.title);
                }
                return;
            }

            const selectedItem = data.items.find(i => i.id === state.selectedItemId);
            if (selectedItem && selectedItem.cat === basketId) {
                tidyItemSuccess(selectedItem);
            } else if (selectedItem) {
                // Gentle errorless guidance: keep the green target basket glowing
                playZenSound('select', 0);
                const correctBasket = data.baskets.find(b => b.id === selectedItem.cat);
                if (correctBasket) sayWord(correctBasket.title);
            }
        }

        function tidyItemSuccess(item) {
            if (!state.tidiedIds.includes(item.id)) {
                state.tidiedIds.push(item.id);
            }
            state.selectedItemId = null;
            playZenSound('place');
            sayWord(item.word);

            const data = ROOM_DATA[state.room];
            if (state.tidiedIds.length === data.items.length) {
                addZenStar();
                playZenSound('complete');
                sayWord('All tidy!');
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 110, spread: 80, origin: { y: 0.6 } });
                }
            }
            renderStage();
        }

        // ============================================================================
        // ROOM 4: CALM SENSORY BUBBLE WRAP & DE-ESCALATION
        // ============================================================================
        const BUBBLE_ICONS = ['🫧', '🌸', '⭐️', '🐚', '🍃', '🦋', '💧', '🌙'];

        function renderBubbleSanctuary(stage) {
            const bubblesHtml = state.bubblesPopped.map((popped, idx) => `
                <button class="sensory-bubble ${popped ? 'popped' : ''}" onclick="popSensoryBubble(${idx})" aria-label="Calm Bubble ${idx + 1}">
                    <span>${popped ? '✨' : BUBBLE_ICONS[idx]}</span>
                </button>
            `).join('');

            stage.innerHTML = `
                <div class="bubble-wrap-grid">
                    ${bubblesHtml}
                </div>
            `;
        }

        function popSensoryBubble(idx) {
            state.bubblesPopped[idx] = !state.bubblesPopped[idx];
            playZenSound('bubble', idx);
            sayWord('Pop!');

            if (state.bubblesPopped.every(Boolean)) {
                addZenStar();
                playZenSound('complete');
                setTimeout(() => {
                    state.bubblesPopped = [false, false, false, false, false, false, false, false];
                    if (state.room === 'bubbles') renderStage();
                }, 900);
            }
            renderStage();
        }

        // --- Single-Switch / Spacebar Instant Action Support ---
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                if (state.room === 'bubbles') {
                    const nextIdx = state.bubblesPopped.indexOf(false);
                    popSensoryBubble(nextIdx !== -1 ? nextIdx : 0);
                } else {
                    const data = ROOM_DATA[state.room];
                    const nextUntidied = data.items.find(i => !state.tidiedIds.includes(i.id));
                    if (nextUntidied) {
                        tidyItemSuccess(nextUntidied);
                    } else {
                        nextRoom();
                    }
                }
            }
        });

        // Boot Game
        loadSavedStars();
        renderStage();
    </script>
</body>
</html>
