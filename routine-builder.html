<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Now & Next Routine 📋 | Able & Beyond</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --text-dark: #0f172a;
            --now-bg: #dcfce7;
            --now-border: #16a34a;
            --now-text: #14532d;
            --next-bg: #fef9c3;
            --next-border: #eab308;
            --next-text: #713f12;
            --then-bg: #f3e8ff;
            --then-border: #9333ea;
            --then-text: #581c87;
            --focus-ring: #facc15;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        input {
            user-select: text;
            -webkit-user-select: text;
        }

        body {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        button:focus-visible, input:focus-visible, .focusable:focus-visible {
            outline: 6px solid var(--focus-ring) !important;
            outline-offset: 4px !important;
            box-shadow: 0 0 0 10px rgba(250, 204, 21, 0.45) !important;
            z-index: 30;
        }

        /* ================= TOP BAR ================= */
        .top-bar {
            background: #ffffff;
            border-bottom: 4px solid #cbd5e1;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .btn-home {
            background: #0f172a;
            color: #ffffff;
            border: 3px solid #0f172a;
            border-radius: 18px;
            padding: 10px 18px;
            font-size: 1.15rem;
            font-weight: 900;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #334155;
        }
        .btn-home:active { transform: translateY(3px); box-shadow: 0 1px 0 #334155; }

        .game-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: clamp(1.35rem, 3vw, 2rem);
            font-weight: 900;
            color: #0f172a;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            background: #f1f5f9;
            color: #0f172a;
            border: 3px solid #94a3b8;
            border-radius: 16px;
            padding: 9px 14px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0 #94a3b8;
            transition: all 0.15s;
        }
        .ctrl-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #94a3b8; }
        .ctrl-btn.active {
            background: #dcfce7;
            border-color: #16a34a;
            color: #14532d;
            box-shadow: 0 4px 0 #16a34a;
        }

        .star-pill {
            background: #fef9c3;
            border: 3px solid #eab308;
            color: #854d0e;
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 1.2rem;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ================= 3 SIMPLE PICTURE TABS ================= */
        .mode-tabs {
            max-width: 1160px;
            width: 100%;
            margin: 12px auto 0;
            padding: 0 14px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .mode-tab {
            background: #ffffff;
            border: 4px solid #cbd5e1;
            border-radius: 22px;
            padding: 12px 12px;
            font-family: inherit;
            font-size: clamp(1.1rem, 2.3vw, 1.4rem);
            font-weight: 900;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 0 #cbd5e1;
            transition: all 0.15s;
        }
        .mode-tab .tab-icon {
            font-size: clamp(1.9rem, 4vw, 2.5rem);
            line-height: 1;
        }
        .mode-tab.active {
            background: #eff6ff;
            border-color: #2563eb;
            color: #1e3a8a;
            box-shadow: 0 5px 0 #2563eb;
            transform: translateY(-2px);
        }

        /* ================= MAIN STAGE ================= */
        .stage-wrap {
            flex: 1;
            max-width: 1160px;
            width: 100%;
            margin: 12px auto 20px;
            padding: 0 14px;
            display: flex;
            flex-direction: column;
        }

        .stage-card {
            background: #ffffff;
            border: 5px solid #cbd5e1;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
        }

        /* ================= TEACHER LAYOUT & TIMER BAR ================= */
        .session-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            background: #f8fafc;
            border: 3px solid #e2e8f0;
            border-radius: 22px;
            padding: 10px 14px;
        }

        .layout-pills, .timer-pills {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mini-pill {
            background: #ffffff;
            border: 3px solid #94a3b8;
            border-radius: 14px;
            padding: 7px 13px;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 900;
            color: #1e293b;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 3px 0 #94a3b8;
        }
        .mini-pill.active {
            background: #dbeafe;
            border-color: #2563eb;
            color: #1e3a8a;
            box-shadow: 0 3px 0 #2563eb;
        }

        /* ================= GIANT NOW / NEXT / THEN / SESSION BOARD ================= */
        .board-slots-grid {
            display: grid;
            gap: 14px;
            align-items: stretch;
        }
        .board-slots-grid.slots-2 {
            grid-template-columns: repeat(2, 1fr);
        }
        .board-slots-grid.slots-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        .board-slots-grid.slots-4 {
            grid-template-columns: repeat(4, 1fr);
        }

        .board-slot {
            border-radius: 28px;
            padding: 16px;
            min-height: 225px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            cursor: pointer;
            position: relative;
            transition: transform 0.16s, box-shadow 0.16s;
        }

        .slot-now {
            background: var(--now-bg);
            border: 6px solid var(--now-border);
            color: var(--now-text);
            box-shadow: 0 8px 0 #15803d;
        }

        .slot-next {
            background: var(--next-bg);
            border: 6px solid var(--next-border);
            color: var(--next-text);
            box-shadow: 0 8px 0 #ca8a04;
        }

        .slot-then {
            background: var(--then-bg);
            border: 6px solid var(--then-border);
            color: var(--then-text);
            box-shadow: 0 8px 0 #7e22ce;
        }

        .slot-step {
            background: #eff6ff;
            border: 6px solid #3b82f6;
            color: #1e3a8a;
            box-shadow: 0 8px 0 #2563eb;
        }

        .board-slot.active-target {
            outline: 6px dashed #2563eb;
            outline-offset: 4px;
            transform: translateY(-3px);
        }

        .slot-badge {
            font-size: 1.35rem;
            font-weight: 900;
            padding: 5px 20px;
            border-radius: 999px;
            letter-spacing: 0.04em;
            color: #ffffff;
            text-transform: uppercase;
        }
        .slot-now .slot-badge { background: #16a34a; }
        .slot-next .slot-badge { background: #ca8a04; }
        .slot-then .slot-badge { background: #9333ea; }
        .slot-step .slot-badge { background: #2563eb; }

        .slot-card-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            margin: auto 0;
            text-align: center;
        }
        .slot-emoji {
            font-size: clamp(3.3rem, 6vw, 4.4rem);
            line-height: 1;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
        }
        .slot-word {
            font-size: clamp(1.5rem, 3vw, 2.1rem);
            font-weight: 900;
            text-transform: uppercase;
            word-break: break-word;
        }

        .slot-empty-hint {
            font-size: 1.3rem;
            font-weight: 900;
            opacity: 0.65;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .btn-done-now {
            background: #16a34a;
            color: #ffffff;
            border: 4px solid #14532d;
            border-radius: 18px;
            padding: 8px 20px;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #14532d;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-done-now:active { transform: translateY(3px); box-shadow: 0 1px 0 #14532d; }

        /* Visual Countdown Timer Bar inside NOW */
        .timer-bar-wrap {
            width: 100%;
            background: rgba(255,255,255,0.85);
            border: 3px solid #15803d;
            border-radius: 999px;
            height: 28px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .timer-bar-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: #4ade80;
            transition: width 1s linear;
        }
        .timer-bar-text {
            position: relative;
            z-index: 2;
            font-size: 0.95rem;
            font-weight: 900;
            color: #064e3b;
        }

        /* ================= TEACHER TYPE & BUILD CUSTOM BAR ================= */
        .custom-builder-bar {
            background: #eff6ff;
            border: 4px solid #93c5fd;
            border-radius: 24px;
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .builder-top-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .emoji-pick-strip {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .emoji-pick-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 3px solid #cbd5e1;
            background: #ffffff;
            font-size: 1.5rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, border-color 0.1s;
        }
        .emoji-pick-btn.selected {
            border-color: #2563eb;
            background: #dbeafe;
            transform: scale(1.1);
        }

        .custom-text-input {
            flex: 1;
            min-width: 180px;
            padding: 11px 16px;
            border-radius: 16px;
            border: 4px solid #3b82f6;
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 900;
            color: #0f172a;
            background: #ffffff;
            text-transform: uppercase;
        }

        .btn-add-custom {
            background: #2563eb;
            color: #ffffff;
            border: 3px solid #1e3a8a;
            border-radius: 16px;
            padding: 11px 18px;
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #1e3a8a;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-add-custom:active { transform: translateY(3px); box-shadow: 0 1px 0 #1e3a8a; }

        /* ================= PICTURE CARDS TRAY ================= */
        .cards-tray {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
            gap: 12px;
        }

        .pic-card {
            background: #ffffff;
            border: 5px solid #94a3b8;
            border-radius: 24px;
            padding: 14px 8px;
            min-height: 132px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 6px 0 #94a3b8;
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
            position: relative;
        }
        .pic-card:hover {
            transform: translateY(-4px);
            border-color: #2563eb;
            box-shadow: 0 6px 0 #2563eb;
        }
        .pic-card:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #94a3b8;
        }
        .pic-emoji {
            font-size: clamp(2.5rem, 4.5vw, 3.3rem);
            line-height: 1;
        }
        .pic-word {
            font-size: clamp(1.1rem, 2.2vw, 1.35rem);
            font-weight: 900;
            color: #0f172a;
            text-transform: uppercase;
            text-align: center;
            word-break: break-word;
        }

        .delete-card-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
            font-size: 0.85rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* ================= MODE 2: MY CHOICE BOARD ================= */
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin: auto 0;
        }

        .choice-card {
            background: #ffffff;
            border: 6px solid #7c3aed;
            border-radius: 28px;
            padding: 22px 14px;
            min-height: 185px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 0 #5b21b6;
            transition: transform 0.15s, background-color 0.15s;
        }
        .choice-card:hover {
            transform: translateY(-4px);
            background: #f5f3ff;
        }
        .choice-card.picked {
            background: #dcfce7;
            border-color: #16a34a;
            box-shadow: 0 8px 0 #15803d;
        }
        .choice-emoji {
            font-size: clamp(3.4rem, 6vw, 4.4rem);
            line-height: 1;
        }
        .choice-word {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 900;
            color: #0f172a;
            text-transform: uppercase;
        }

        /* ================= MODE 3: 1-2-3 STEPS ================= */
        .routine-pills {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .routine-pill {
            background: #f1f5f9;
            border: 4px solid #94a3b8;
            border-radius: 20px;
            padding: 10px 18px;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: 900;
            color: #0f172a;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 0 #94a3b8;
        }
        .routine-pill.active {
            background: #eff6ff;
            border-color: #2563eb;
            color: #1e3a8a;
            box-shadow: 0 4px 0 #2563eb;
        }

        .steps-3-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: auto 0;
        }

        .step-card {
            background: #ffffff;
            border: 6px solid #cbd5e1;
            border-radius: 30px;
            padding: 24px 16px;
            min-height: 250px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 8px 0 #cbd5e1;
            transition: all 0.16s;
            position: relative;
        }
        .step-card.next-up {
            background: #fef9c3;
            border-color: #eab308;
            box-shadow: 0 0 0 10px rgba(250, 204, 21, 0.45), 0 8px 0 #ca8a04;
            transform: translateY(-5px) scale(1.03);
        }
        .step-card.done {
            background: #dcfce7;
            border-color: #16a34a;
            box-shadow: 0 8px 0 #15803d;
        }

        .step-num-badge {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #0f172a;
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .step-card.done .step-num-badge {
            background: #16a34a;
        }

        .step-emoji {
            font-size: clamp(3.6rem, 7vw, 4.8rem);
            line-height: 1;
        }
        .step-word {
            font-size: clamp(1.6rem, 3.5vw, 2.2rem);
            font-weight: 900;
            color: #0f172a;
            text-transform: uppercase;
        }

        /* Win Banner */
        .win-overlay {
            background: #dcfce7;
            border: 5px solid #16a34a;
            border-radius: 26px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .win-text {
            font-size: clamp(1.5rem, 3.5vw, 2.2rem);
            font-weight: 900;
            color: #14532d;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-next-giant {
            background: #16a34a;
            color: #ffffff;
            border: 4px solid #14532d;
            border-radius: 20px;
            padding: 12px 28px;
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 0 #14532d;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 860px) {
            .mode-tabs { grid-template-columns: 1fr; }
            .board-slots-grid.slots-2,
            .board-slots-grid.slots-3,
            .board-slots-grid.slots-4 { grid-template-columns: 1fr; }
            .choice-grid { grid-template-columns: repeat(2, 1fr); }
            .steps-3-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <header class="top-bar">
        <a href="https://games.ableandbeyond.support/index.html" class="btn-home" aria-label="Back to Game Hub">
            ⬅️ Hub
        </a>

        <div class="game-title">
            <span>📋</span>
            <span>Now &amp; Next</span>
        </div>

        <div class="top-controls">
            <button type="button" id="btn-builder-toggle" class="ctrl-btn active" onclick="toggleBuilderBar()" title="Show or Hide Type & Add Card Bar">
                ✏️ Type Card
            </button>
            <button type="button" id="btn-voice" class="ctrl-btn active" onclick="toggleVoice()" title="Toggle 1-Word Voice">
                🗣️ Voice
            </button>
            <button type="button" id="btn-sound" class="ctrl-btn active" onclick="toggleSound()" title="Toggle Musical Sounds">
                🎵 Sound
            </button>
            <button type="button" class="ctrl-btn" onclick="clearBoard()" title="Clear Board">
                🔄 Clear
            </button>
            <div class="star-pill" aria-label="Stars earned">
                ⭐ <span id="star-count">0</span>
            </div>
        </div>
    </header>

    <!-- 3 SIMPLE PICTURE TABS -->
    <nav class="mode-tabs" aria-label="Routine Modes">
        <button type="button" class="mode-tab active" id="tab-board" onclick="setMode('board')">
            <span class="tab-icon">📋</span>
            <span>1. Now &amp; Next Board</span>
        </button>
        <button type="button" class="mode-tab" id="tab-choice" onclick="setMode('choice')">
            <span class="tab-icon">🧸</span>
            <span>2. My Choice</span>
        </button>
        <button type="button" class="mode-tab" id="tab-steps" onclick="setMode('steps')">
            <span class="tab-icon">🧼</span>
            <span>3. 1-2-3 Steps</span>
        </button>
    </nav>

    <!-- MAIN STAGE -->
    <main class="stage-wrap">
        <div id="stage-content" class="stage-card">
            <!-- Populated by JS -->
        </div>
    </main>

    <script>
        /* ================================================================
           1. DEFAULT UNIVERSAL ACTIVITIES + CUSTOM SAVED CARDS
           ================================================================ */
        const DEFAULT_ACTIVITIES = [
            { id: 'work',    word: 'WORK',    emoji: '✏️' },
            { id: 'book',    word: 'BOOK',    emoji: '📖' },
            { id: 'art',     word: 'ART',     emoji: '🎨' },
            { id: 'snack',   word: 'SNACK',   emoji: '🍎' },
            { id: 'play',    word: 'PLAY',    emoji: '🧩' },
            { id: 'outside', word: 'OUTSIDE', emoji: '🌳' },
            { id: 'music',   word: 'MUSIC',   emoji: '🎵' },
            { id: 'pe',      word: 'P.E.',    emoji: '⚽' },
            { id: 'sensory', word: 'SENSORY', emoji: '🫧' },
            { id: 'ipad',    word: 'TABLET',  emoji: '💻' },
            { id: 'toilet',  word: 'TOILET',  emoji: '🚽' },
            { id: 'home',    word: 'HOME',    emoji: '🏠' }
        ];

        const QUICK_EMOJIS = ['⭐', '🏊', '🚌', '🔤', '🔢', '🥁', '🧁', '🧘', '🛝', '🧸', '🎧', '👟'];

        const CHOICES = [
            { id: 'bubbles', word: 'BUBBLES', emoji: '🫧' },
            { id: 'toy',     word: 'TOY',     emoji: '🧸' },
            { id: 'music',   word: 'MUSIC',   emoji: '🎧' },
            { id: 'outside', word: 'OUTSIDE', emoji: '🌳' },
            { id: 'quiet',   word: 'QUIET',   emoji: '🛋️' },
            { id: 'draw',    word: 'DRAW',    emoji: '🖍️' }
        ];

        const MINI_ROUTINES = {
            wash: {
                id: 'wash',
                label: '🧼 WASH',
                steps: [
                    { word: 'WATER', emoji: '💧' },
                    { word: 'SOAP',  emoji: '🧼' },
                    { word: 'DRY',   emoji: '🧻' }
                ]
            },
            teeth: {
                id: 'teeth',
                label: '🪥 TEETH',
                steps: [
                    { word: 'PASTE', emoji: '🪥' },
                    { word: 'BRUSH', emoji: '😬' },
                    { word: 'RINSE', emoji: '💧' }
                ]
            },
            coat: {
                id: 'coat',
                label: '🧥 COAT',
                steps: [
                    { word: 'BAG',   emoji: '🎒' },
                    { word: 'COAT',  emoji: '🧥' },
                    { word: 'SHOES', emoji: '👟' }
                ]
            },
            eat: {
                id: 'eat',
                label: '🍎 LUNCH',
                steps: [
                    { word: 'WASH',  emoji: '🧼' },
                    { word: 'EAT',   emoji: '🍎' },
                    { word: 'TIDY',  emoji: '🗑️' }
                ]
            }
        };

        /* ================================================================
           2. STATE & LOCALSTORAGE
           ================================================================ */
        function loadCustomCards() {
            try {
                const raw = localStorage.getItem('ab_custom_routine_cards');
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                return [];
            }
        }

        function saveCustomCards(list) {
            try {
                localStorage.setItem('ab_custom_routine_cards', JSON.stringify(list));
            } catch (e) {}
        }

        const state = {
            mode: 'board',
            voiceOn: true,
            soundOn: true,
            showBuilder: true,
            selectedEmoji: '⭐',
            customText: '',
            stars: parseInt(localStorage.getItem('ab_routine_stars') || '0', 10),
            customCards: loadCustomCards(),
            // Board Layout: 2 = Now/Next, 3 = Now/Next/Then, 4 = 4-Step Session
            slotCount: 2,
            slots: [DEFAULT_ACTIVITIES[0], DEFAULT_ACTIVITIES[4], null, null],
            activeSlotIndex: 0,
            // Timer for NOW slot
            timerTotal: 0,
            timerLeft: 0,
            timerInterval: null,
            // Mode 2: Choice
            pickedChoice: null,
            // Mode 3: 1-2-3 Steps
            routineKey: 'wash',
            stepIndex: 0
        };

        function getAllActivities() {
            return [...state.customCards, ...DEFAULT_ACTIVITIES];
        }

        /* ================================================================
           3. WEB AUDIO & 1-WORD TTS
           ================================================================ */
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playNotes(freqs, type = 'triangle', spacing = 0.09, duration = 0.38) {
            if (!state.soundOn) return;
            const ctx = getAudioCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            freqs.forEach((f, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(f, now + idx * spacing);
                gain.gain.setValueAtTime(0.001, now + idx * spacing);
                gain.gain.exponentialRampToValueAtTime(0.24, now + idx * spacing + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * spacing + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + idx * spacing);
                osc.stop(now + idx * spacing + duration + 0.02);
            });
        }

        function playTapChime() {
            playNotes([523.25, 659.25], 'sine', 0.07, 0.28);
        }

        function playWinChime() {
            playNotes([523.25, 659.25, 783.99, 1046.50], 'triangle', 0.09, 0.45);
        }

        function speakWord(text) {
            if (!state.voiceOn || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-GB';
                u.rate = 0.92;
                u.pitch = 1.05;
                window.speechSynthesis.speak(u);
            } catch (e) {}
        }

        function addStar() {
            state.stars += 1;
            localStorage.setItem('ab_routine_stars', String(state.stars));
            document.getElementById('star-count').textContent = state.stars;
            if (typeof confetti === 'function') {
                confetti({ particleCount: 45, spread: 65, origin: { y: 0.7 } });
            }
        }

        /* ================================================================
           4. HEADER CONTROLS & TIMERS
           ================================================================ */
        function toggleBuilderBar() {
            state.showBuilder = !state.showBuilder;
            document.getElementById('btn-builder-toggle').classList.toggle('active', state.showBuilder);
            if (state.mode === 'board') renderBoardMode();
        }

        function toggleVoice() {
            state.voiceOn = !state.voiceOn;
            document.getElementById('btn-voice').classList.toggle('active', state.voiceOn);
            if (state.voiceOn) speakWord('Voice On');
        }

        function toggleSound() {
            state.soundOn = !state.soundOn;
            document.getElementById('btn-sound').classList.toggle('active', state.soundOn);
            if (state.soundOn) playWinChime();
        }

        function clearBoard() {
            stopTimer();
            if (state.mode === 'board') {
                state.slots = [null, null, null, null];
                state.activeSlotIndex = 0;
                renderBoardMode();
            } else if (state.mode === 'choice') {
                state.pickedChoice = null;
                renderChoiceMode();
            } else {
                state.stepIndex = 0;
                renderStepsMode();
            }
        }

        function setSlotCount(n) {
            state.slotCount = n;
            if (state.activeSlotIndex >= n) state.activeSlotIndex = 0;
            playTapChime();
            renderBoardMode();
        }

        function startTimer(seconds) {
            stopTimer();
            state.timerTotal = seconds;
            state.timerLeft = seconds;
            playTapChime();
            renderBoardMode();

            state.timerInterval = setInterval(() => {
                state.timerLeft -= 1;
                if (state.timerLeft <= 0) {
                    stopTimer();
                    playWinChime();
                    speakWord('Time Finished');
                }
                if (state.mode === 'board') renderBoardMode();
            }, 1000);
        }

        function stopTimer() {
            if (state.timerInterval) {
                clearInterval(state.timerInterval);
                state.timerInterval = null;
            }
            state.timerTotal = 0;
            state.timerLeft = 0;
        }

        function formatSeconds(sec) {
            const m = Math.floor(sec / 60);
            const s = sec % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function setMode(mode) {
            state.mode = mode;
            ['board', 'choice', 'steps'].forEach(m => {
                document.getElementById('tab-' + m).classList.toggle('active', m === mode);
            });
            if (mode === 'board') renderBoardMode();
            else if (mode === 'choice') renderChoiceMode();
            else renderStepsMode();
        }

        /* ================================================================
           5. MODE 1: 📋 FLEXIBLE NOW & NEXT / SESSION BUILDER
           ================================================================ */
        function getSlotMeta(idx, total) {
            if (total === 2) {
                return idx === 0
                    ? { badge: '🟢 NOW', css: 'slot-now', speakPrefix: 'Now' }
                    : { badge: '🟡 NEXT', css: 'slot-next', speakPrefix: 'Next' };
            }
            if (total === 3) {
                if (idx === 0) return { badge: '🟢 NOW', css: 'slot-now', speakPrefix: 'Now' };
                if (idx === 1) return { badge: '🟡 NEXT', css: 'slot-next', speakPrefix: 'Next' };
                return { badge: '🟣 THEN', css: 'slot-then', speakPrefix: 'Then' };
            }
            // 4-Step Session Strip
            if (idx === 0) return { badge: '1. NOW', css: 'slot-now', speakPrefix: 'Step 1' };
            if (idx === 1) return { badge: '2. NEXT', css: 'slot-next', speakPrefix: 'Step 2' };
            if (idx === 2) return { badge: '3. THEN', css: 'slot-then', speakPrefix: 'Step 3' };
            return { badge: '4. LAST', css: 'slot-step', speakPrefix: 'Step 4' };
        }

        function renderBoardMode() {
            const box = document.getElementById('stage-content');
            const N = state.slotCount;
            const activities = getAllActivities();
            const pct = state.timerTotal > 0 ? Math.round((state.timerLeft / state.timerTotal) * 100) : 0;

            let slotsHTML = '';
            for (let i = 0; i < N; i++) {
                const meta = getSlotMeta(i, N);
                const item = state.slots[i];
                const isActive = state.activeSlotIndex === i;

                slotsHTML += `
                    <div class="board-slot ${meta.css} ${isActive ? 'active-target' : ''}"
                         onclick="selectSlot(${i})"
                         ondragover="event.preventDefault()"
                         ondrop="onSlotDrop(event, ${i})"
                         tabindex="0"
                         role="button"
                         aria-label="${meta.badge}">
                        <span class="slot-badge">${meta.badge}</span>

                        ${item ? `
                            <div class="slot-card-inner">
                                <span class="slot-emoji">${item.emoji}</span>
                                <span class="slot-word">${item.word}</span>
                            </div>
                            ${i === 0 && state.timerTotal > 0 ? `
                                <div class="timer-bar-wrap">
                                    <div class="timer-bar-fill" style="width:${pct}%;"></div>
                                    <span class="timer-bar-text">⏱️ ${formatSeconds(state.timerLeft)}</span>
                                </div>
                            ` : ''}
                            ${i === 0 ? `
                                <button type="button" class="btn-done-now" onclick="finishFirstSlot(event)">
                                    ✅ DONE!
                                </button>
                            ` : ''}
                        ` : `
                            <div class="slot-empty-hint">
                                <span style="font-size:2.4rem;">👆</span>
                                <span>TAP OR TYPE</span>
                            </div>
                        `}
                    </div>
                `;
            }

            box.innerHTML = `
                <!-- TOP SESSION & TIMER BAR FOR TEACHERS -->
                <div class="session-toolbar">
                    <div class="layout-pills">
                        <button type="button" class="mini-pill ${N === 2 ? 'active' : ''}" onclick="setSlotCount(2)">
                            2️⃣ Now &amp; Next
                        </button>
                        <button type="button" class="mini-pill ${N === 3 ? 'active' : ''}" onclick="setSlotCount(3)">
                            3️⃣ Now, Next, Then
                        </button>
                        <button type="button" class="mini-pill ${N === 4 ? 'active' : ''}" onclick="setSlotCount(4)">
                            📅 4-Step Session
                        </button>
                    </div>

                    <div class="timer-pills">
                        <button type="button" class="mini-pill ${state.timerTotal === 60 ? 'active' : ''}" onclick="startTimer(60)">
                            ⏱️ 1m
                        </button>
                        <button type="button" class="mini-pill ${state.timerTotal === 120 ? 'active' : ''}" onclick="startTimer(120)">
                            ⏱️ 2m
                        </button>
                        <button type="button" class="mini-pill ${state.timerTotal === 300 ? 'active' : ''}" onclick="startTimer(300)">
                            ⏱️ 5m
                        </button>
                        ${state.timerTotal > 0 ? `
                            <button type="button" class="mini-pill" onclick="stopTimer(); renderBoardMode();">
                                ⏹️ Stop
                            </button>
                        ` : ''}
                    </div>
                </div>

                <!-- GIANT SLOTS BOARD -->
                <div class="board-slots-grid slots-${N}">
                    ${slotsHTML}
                </div>

                <!-- TEACHER / STUDENT TYPE & ADD CUSTOM CARD BAR -->
                ${state.showBuilder ? `
                    <div class="custom-builder-bar">
                        <div class="builder-top-row">
                            <div class="emoji-pick-strip">
                                ${QUICK_EMOJIS.map(em => `
                                    <button type="button"
                                            class="emoji-pick-btn ${state.selectedEmoji === em ? 'selected' : ''}"
                                            onclick="pickBuilderEmoji('${em}')">
                                        ${em}
                                    </button>
                                `).join('')}
                            </div>
                            <input type="text"
                                   id="custom-word-input"
                                   class="custom-text-input"
                                   placeholder="TYPE ACTIVITY (E.G. SWIM, PHONICS, BUS)..."
                                   value="${state.customText}"
                                   oninput="state.customText = this.value"
                                   onkeydown="if(event.key === 'Enter'){ event.preventDefault(); addCustomActivity(true); }" />
                            <button type="button" class="btn-add-custom" onclick="addCustomActivity(true)">
                                ➕ Put on Board
                            </button>
                            <button type="button" class="btn-add-custom" style="background:#0d9488;border-color:#115e59;box-shadow:0 4px 0 #115e59;" onclick="addCustomActivity(false)">
                                💾 Save Card
                            </button>
                        </div>
                    </div>
                ` : ''}

                <!-- PICTURE CARDS TRAY -->
                <div class="cards-tray">
                    ${activities.map(act => `
                        <button type="button"
                                class="pic-card"
                                draggable="true"
                                ondragstart="onCardDrag(event, '${act.id}')"
                                onclick="placeActivityCard('${act.id}')">
                            ${act.custom ? `
                                <span class="delete-card-btn" onclick="deleteCustomCard(event, '${act.id}')" title="Delete custom card">✕</span>
                            ` : ''}
                            <span class="pic-emoji">${act.emoji}</span>
                            <span class="pic-word">${act.word}</span>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function pickBuilderEmoji(em) {
            state.selectedEmoji = em;
            playTapChime();
            renderBoardMode();
            const inp = document.getElementById('custom-word-input');
            if (inp) inp.focus();
        }

        function addCustomActivity(placeImmediately) {
            const raw = (state.customText || '').trim().toUpperCase();
            if (!raw) {
                const inp = document.getElementById('custom-word-input');
                if (inp) inp.focus();
                return;
            }
            const newCard = {
                id: 'custom_' + Date.now(),
                word: raw,
                emoji: state.selectedEmoji || '⭐',
                custom: true
            };
            state.customCards.unshift(newCard);
            saveCustomCards(state.customCards);
            state.customText = '';

            if (placeImmediately) {
                placeCardObject(newCard);
            } else {
                playWinChime();
                speakWord(newCard.word);
                renderBoardMode();
            }
        }

        function deleteCustomCard(e, id) {
            e.stopPropagation();
            state.customCards = state.customCards.filter(c => c.id !== id);
            saveCustomCards(state.customCards);
            renderBoardMode();
        }

        function selectSlot(idx) {
            state.activeSlotIndex = idx;
            const meta = getSlotMeta(idx, state.slotCount);
            const item = state.slots[idx];
            if (item) {
                speakWord(meta.speakPrefix + ' ' + item.word);
            } else {
                speakWord(meta.speakPrefix);
            }
            playTapChime();
            renderBoardMode();
        }

        function onCardDrag(e, id) {
            e.dataTransfer.setData('text/plain', id);
        }

        function onSlotDrop(e, idx) {
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            state.activeSlotIndex = idx;
            placeActivityCard(id);
        }

        function placeActivityCard(id) {
            const act = getAllActivities().find(a => a.id === id);
            if (!act) return;
            placeCardObject(act);
        }

        function placeCardObject(act) {
            const N = state.slotCount;
            const idx = state.activeSlotIndex;
            state.slots[idx] = act;
            const meta = getSlotMeta(idx, N);
            playTapChime();
            speakWord(meta.speakPrefix + ' ' + act.word);

            // Auto-advance active highlight to next empty or subsequent slot
            if (idx + 1 < N) {
                state.activeSlotIndex = idx + 1;
            }
            renderBoardMode();
        }

        function finishFirstSlot(e) {
            e.stopPropagation();
            stopTimer();
            playWinChime();
            addStar();

            // Shift all slots left (NEXT becomes NOW, THEN becomes NEXT, etc.)
            const N = state.slotCount;
            for (let i = 0; i < N - 1; i++) {
                state.slots[i] = state.slots[i + 1];
            }
            state.slots[N - 1] = null;

            if (state.slots[0]) {
                speakWord('Now ' + state.slots[0].word);
                state.activeSlotIndex = N - 1;
            } else {
                speakWord('All Done');
                state.activeSlotIndex = 0;
            }
            renderBoardMode();
        }

        /* ================================================================
           6. MODE 2: 🧸 MY CHOICE (1-WORD REWARD / BREAK BOARD)
           ================================================================ */
        function renderChoiceMode() {
            const box = document.getElementById('stage-content');

            box.innerHTML = `
                <div class="choice-grid">
                    ${CHOICES.map(ch => {
                        const isPicked = state.pickedChoice && state.pickedChoice.id === ch.id;
                        return `
                            <button type="button"
                                    class="choice-card ${isPicked ? 'picked' : ''}"
                                    onclick="pickChoice('${ch.id}')">
                                <span class="choice-emoji">${ch.emoji}</span>
                                <span class="choice-word">${ch.word}</span>
                            </button>
                        `;
                    }).join('')}
                </div>

                ${state.pickedChoice ? `
                    <div class="win-overlay">
                        <div class="win-text">
                            <span>${state.pickedChoice.emoji}</span>
                            <span>NEXT: ${state.pickedChoice.word}!</span>
                        </div>
                        <button type="button" class="btn-next-giant" onclick="setMode('board')">
                            See Board 📋
                        </button>
                    </div>
                ` : ''}
            `;
        }

        function pickChoice(id) {
            const ch = CHOICES.find(c => c.id === id);
            if (!ch) return;
            state.pickedChoice = ch;
            state.slots[1] = { id: ch.id, word: ch.word, emoji: ch.emoji };
            playWinChime();
            speakWord(ch.word);
            addStar();
            renderChoiceMode();
        }

        /* ================================================================
           7. MODE 3: 🧼 1-2-3 STEPS (3 GIANT SELF-CARE CARDS)
           ================================================================ */
        function renderStepsMode() {
            const box = document.getElementById('stage-content');
            const routine = MINI_ROUTINES[state.routineKey];
            const allDone = state.stepIndex >= routine.steps.length;

            box.innerHTML = `
                <div class="routine-pills">
                    ${Object.values(MINI_ROUTINES).map(r => `
                        <button type="button"
                                class="routine-pill ${state.routineKey === r.id ? 'active' : ''}"
                                onclick="selectRoutine('${r.id}')">
                            ${r.label}
                        </button>
                    `).join('')}
                </div>

                <div class="steps-3-grid">
                    ${routine.steps.map((st, idx) => {
                        const isDone = idx < state.stepIndex;
                        const isNext = idx === state.stepIndex;
                        return `
                            <button type="button"
                                    class="step-card ${isDone ? 'done' : ''} ${isNext ? 'next-up' : ''}"
                                    onclick="tapStepCard(${idx})">
                                <div class="step-num-badge">
                                    ${isDone ? '✓' : idx + 1}
                                </div>
                                <span class="step-emoji">${st.emoji}</span>
                                <span class="step-word">${st.word}</span>
                            </button>
                        `;
                    }).join('')}
                </div>

                ${allDone ? `
                    <div class="win-overlay">
                        <div class="win-text">
                            <span>🌟</span>
                            <span>All Done!</span>
                        </div>
                        <button type="button" class="btn-next-giant" onclick="state.stepIndex = 0; renderStepsMode();">
                            Again 🔄
                        </button>
                    </div>
                ` : ''}
            `;
        }

        function selectRoutine(key) {
            state.routineKey = key;
            state.stepIndex = 0;
            const r = MINI_ROUTINES[key];
            playTapChime();
            speakWord(r.steps[0].word);
            renderStepsMode();
        }

        function tapStepCard(idx) {
            const routine = MINI_ROUTINES[state.routineKey];
            const st = routine.steps[state.stepIndex] || routine.steps[idx];
            if (idx <= state.stepIndex || idx > state.stepIndex) {
                state.stepIndex += 1;
                if (st) speakWord(st.word);
                if (state.stepIndex >= routine.steps.length) {
                    playWinChime();
                    addStar();
                } else {
                    playTapChime();
                }
                renderStepsMode();
            }
        }

        /* ================================================================
           8. SPACEBAR / ENTER SWITCH ACCESSIBILITY
           ================================================================ */
        window.addEventListener('keydown', (e) => {
            if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'BUTTON')) return;
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                if (state.mode === 'board') {
                    if (state.slots[0]) finishFirstSlot(e);
                    else placeActivityCard('work');
                } else if (state.mode === 'choice') {
                    pickChoice('bubbles');
                } else if (state.mode === 'steps') {
                    if (state.stepIndex >= 3) {
                        state.stepIndex = 0;
                        renderStepsMode();
                    } else {
                        tapStepCard(state.stepIndex);
                    }
                }
            }
        });

        // Boot
        document.getElementById('star-count').textContent = state.stars;
        renderBoardMode();
    </script>
</body>
</html>
