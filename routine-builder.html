<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Now & Next Routine 📋 | Able & Beyond</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-main: #f8fafc;
            --text-dark: #0f172a;
            --now-bg: #dcfce7;
            --now-border: #16a34a;
            --now-text: #14532d;
            --next-bg: #fef9c3;
            --next-border: #eab308;
            --next-text: #713f12;
            --focus-ring: #facc15;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            background: var(--bg-main);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        button:focus-visible, .focusable:focus-visible {
            outline: 6px solid var(--focus-ring) !important;
            outline-offset: 4px !important;
            box-shadow: 0 0 0 10px rgba(250, 204, 21, 0.45) !important;
            z-index: 30;
        }

        /* ================= TOP BAR ================= */
        .top-bar {
            background: #ffffff;
            border-bottom: 4px solid #cbd5e1;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .btn-home {
            background: #0f172a;
            color: #ffffff;
            border: 3px solid #0f172a;
            border-radius: 18px;
            padding: 10px 18px;
            font-size: 1.15rem;
            font-weight: 900;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #334155;
        }
        .btn-home:active { transform: translateY(3px); box-shadow: 0 1px 0 #334155; }

        .game-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: clamp(1.35rem, 3vw, 2rem);
            font-weight: 900;
            color: #0f172a;
        }

        .top-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            background: #f1f5f9;
            color: #0f172a;
            border: 3px solid #94a3b8;
            border-radius: 16px;
            padding: 9px 14px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0 #94a3b8;
            transition: all 0.15s;
        }
        .ctrl-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #94a3b8; }
        .ctrl-btn.active {
            background: #dcfce7;
            border-color: #16a34a;
            color: #14532d;
            box-shadow: 0 4px 0 #16a34a;
        }

        .star-pill {
            background: #fef9c3;
            border: 3px solid #eab308;
            color: #854d0e;
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 1.2rem;
            font-weight: 900;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ================= 3 SIMPLE PICTURE TABS ================= */
        .mode-tabs {
            max-width: 1120px;
            width: 100%;
            margin: 12px auto 0;
            padding: 0 14px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .mode-tab {
            background: #ffffff;
            border: 4px solid #cbd5e1;
            border-radius: 22px;
            padding: 12px 12px;
            font-family: inherit;
            font-size: clamp(1.1rem, 2.3vw, 1.4rem);
            font-weight: 900;
            color: #334155;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 0 #cbd5e1;
            transition: all 0.15s;
        }
        .mode-tab .tab-icon {
            font-size: clamp(1.9rem, 4vw, 2.5rem);
            line-height: 1;
        }
        .mode-tab.active {
            background: #eff6ff;
            border-color: #2563eb;
            color: #1e3a8a;
            box-shadow: 0 5px 0 #2563eb;
            transform: translateY(-2px);
        }

        /* ================= MAIN STAGE ================= */
        .stage-wrap {
            flex: 1;
            max-width: 1120px;
            width: 100%;
            margin: 12px auto 20px;
            padding: 0 14px;
            display: flex;
            flex-direction: column;
        }

        .stage-card {
            background: #ffffff;
            border: 5px solid #cbd5e1;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 18px;
        }

        /* ================= GIANT NOW & NEXT BOARD ================= */
        .now-next-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 16px;
            align-items: stretch;
        }

        .board-slot {
            border-radius: 28px;
            padding: 18px;
            min-height: 225px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            cursor: pointer;
            position: relative;
            transition: transform 0.16s, box-shadow 0.16s;
        }

        .slot-now {
            background: var(--now-bg);
            border: 6px solid var(--now-border);
            color: var(--now-text);
            box-shadow: 0 8px 0 #15803d;
        }

        .slot-next {
            background: var(--next-bg);
            border: 6px solid var(--next-border);
            color: var(--next-text);
            box-shadow: 0 8px 0 #ca8a04;
        }

        .board-slot.active-target {
            outline: 6px dashed #2563eb;
            outline-offset: 4px;
            transform: scale(1.02);
        }

        .slot-badge {
            font-size: 1.5rem;
            font-weight: 900;
            padding: 6px 24px;
            border-radius: 999px;
            letter-spacing: 0.04em;
            color: #ffffff;
        }
        .slot-now .slot-badge { background: #16a34a; }
        .slot-next .slot-badge { background: #ca8a04; }

        .slot-card-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin: auto 0;
        }
        .slot-emoji {
            font-size: clamp(3.6rem, 7vw, 4.8rem);
            line-height: 1;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.12));
        }
        .slot-word {
            font-size: clamp(1.7rem, 3.5vw, 2.3rem);
            font-weight: 900;
            text-transform: uppercase;
        }

        .slot-empty-hint {
            font-size: 1.4rem;
            font-weight: 900;
            opacity: 0.65;
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .board-arrow {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 900;
            color: #64748b;
        }

        .btn-done-now {
            background: #16a34a;
            color: #ffffff;
            border: 4px solid #14532d;
            border-radius: 18px;
            padding: 10px 22px;
            font-family: inherit;
            font-size: 1.25rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 0 #14532d;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-done-now:active { transform: translateY(3px); box-shadow: 0 1px 0 #14532d; }

        /* ================= PICTURE CARDS TRAY ================= */
        .cards-tray {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
            gap: 14px;
        }

        .pic-card {
            background: #ffffff;
            border: 5px solid #94a3b8;
            border-radius: 26px;
            padding: 16px 10px;
            min-height: 145px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 0 #94a3b8;
            transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
        }
        .pic-card:hover {
            transform: translateY(-4px);
            border-color: #2563eb;
            box-shadow: 0 6px 0 #2563eb;
        }
        .pic-card:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #94a3b8;
        }
        .pic-card.used {
            opacity: 0.45;
            border-style: dashed;
        }
        .pic-emoji {
            font-size: clamp(2.8rem, 5vw, 3.6rem);
            line-height: 1;
        }
        .pic-word {
            font-size: clamp(1.2rem, 2.5vw, 1.5rem);
            font-weight: 900;
            color: #0f172a;
            text-transform: uppercase;
        }

        /* ================= MODE 2: MY CHOICE BOARD ================= */
        .choice-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin: auto 0;
        }

        .choice-card {
            background: #ffffff;
            border: 6px solid #7c3aed;
            border-radius: 28px;
            padding: 22px 14px;
            min-height: 185px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 0 #5b21b6;
            transition: transform 0.15s, background-color 0.15s;
        }
        .choice-card:hover {
            transform: translateY(-4px);
            background: #f5f3ff;
        }
        .choice-card.picked {
            background: #dcfce7;
            border-color: #16a34a;
            box-shadow: 0 8px 0 #15803d;
        }
        .choice-emoji {
            font-size: clamp(3.4rem, 6vw, 4.4rem);
            line-height: 1;
        }
        .choice-word {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 900;
            color: #0f172a;
            text-transform: uppercase;
        }

        /* ================= MODE 3: 1-2-3 STEPS ================= */
        .routine-pills {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .routine-pill {
            background: #f1f5f9;
            border: 4px solid #94a3b8;
            border-radius: 20px;
            padding: 10px 18px;
            font-family: inherit;
            font-size: 1.2rem;
            font-weight: 900;
            color: #0f172a;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 0 #94a3b8;
        }
        .routine-pill.active {
            background: #eff6ff;
            border-color: #2563eb;
            color: #1e3a8a;
            box-shadow: 0 4px 0 #2563eb;
        }

        .steps-3-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: auto 0;
        }

        .step-card {
            background: #ffffff;
            border: 6px solid #cbd5e1;
            border-radius: 30px;
            padding: 24px 16px;
            min-height: 250px;
            cursor: pointer;
            font-family: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 8px 0 #cbd5e1;
            transition: all 0.16s;
            position: relative;
        }
        .step-card.next-up {
            background: #fef9c3;
            border-color: #eab308;
            box-shadow: 0 0 0 10px rgba(250, 204, 21, 0.45), 0 8px 0 #ca8a04;
            transform: translateY(-5px) scale(1.03);
        }
        .step-card.done {
            background: #dcfce7;
            border-color: #16a34a;
            box-shadow: 0 8px 0 #15803d;
        }

        .step-num-badge {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #0f172a;
            color: #ffffff;
            font-size: 1.6rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .step-card.done .step-num-badge {
            background: #16a34a;
        }

        .step-emoji {
            font-size: clamp(3.6rem, 7vw, 4.8rem);
            line-height: 1;
        }
        .step-word {
            font-size: clamp(1.6rem, 3.5vw, 2.2rem);
            font-weight: 900;
            color: #0f172a;
            text-transform: uppercase;
        }

        /* Win Banner */
        .win-overlay {
            background: #dcfce7;
            border: 5px solid #16a34a;
            border-radius: 26px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .win-text {
            font-size: clamp(1.5rem, 3.5vw, 2.2rem);
            font-weight: 900;
            color: #14532d;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-next-giant {
            background: #16a34a;
            color: #ffffff;
            border: 4px solid #14532d;
            border-radius: 20px;
            padding: 12px 28px;
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 0 #14532d;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        @media (max-width: 780px) {
            .mode-tabs { grid-template-columns: 1fr; }
            .now-next-grid { grid-template-columns: 1fr; }
            .board-arrow { transform: rotate(90deg); }
            .choice-grid { grid-template-columns: repeat(2, 1fr); }
            .steps-3-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION BAR -->
    <header class="top-bar">
        <a href="https://games.ableandbeyond.support/index.html" class="btn-home" aria-label="Back to Game Hub">
            ⬅️ Hub
        </a>

        <div class="game-title">
            <span>📋</span>
            <span>Now &amp; Next</span>
        </div>

        <div class="top-controls">
            <button type="button" id="btn-voice" class="ctrl-btn active" onclick="toggleVoice()" title="Toggle 1-Word Voice">
                🗣️ Voice
            </button>
            <button type="button" id="btn-sound" class="ctrl-btn active" onclick="toggleSound()" title="Toggle Musical Sounds">
                🎵 Sound
            </button>
            <button type="button" class="ctrl-btn" onclick="clearBoard()" title="Clear Now & Next Board">
                🔄 Clear
            </button>
            <div class="star-pill" aria-label="Stars earned">
                ⭐ <span id="star-count">0</span>
            </div>
        </div>
    </header>

    <!-- 3 SIMPLE PICTURE TABS -->
    <nav class="mode-tabs" aria-label="Routine Modes">
        <button type="button" class="mode-tab active" id="tab-board" onclick="setMode('board')">
            <span class="tab-icon">📋</span>
            <span>1. Now &amp; Next</span>
        </button>
        <button type="button" class="mode-tab" id="tab-choice" onclick="setMode('choice')">
            <span class="tab-icon">🧸</span>
            <span>2. My Choice</span>
        </button>
        <button type="button" class="mode-tab" id="tab-steps" onclick="setMode('steps')">
            <span class="tab-icon">🧼</span>
            <span>3. 1-2-3 Steps</span>
        </button>
    </nav>

    <!-- MAIN STAGE -->
    <main class="stage-wrap">
        <div id="stage-content" class="stage-card">
            <!-- Populated by JS -->
        </div>
    </main>

    <script>
        /* ================================================================
           1. GENERIC, UNIVERSAL SEN ACTIVITIES (1-WORD LABELS)
           ================================================================ */
        const ACTIVITIES = [
            { id: 'work',    word: 'WORK',    emoji: '✏️' },
            { id: 'book',    word: 'BOOK',    emoji: '📖' },
            { id: 'art',     word: 'ART',     emoji: '🎨' },
            { id: 'snack',   word: 'SNACK',   emoji: '🍎' },
            { id: 'play',    word: 'PLAY',    emoji: '🧩' },
            { id: 'outside', word: 'OUTSIDE', emoji: '🌳' },
            { id: 'music',   word: 'MUSIC',   emoji: '🎵' },
            { id: 'toilet',  word: 'TOILET',  emoji: '🚽' },
            { id: 'home',    word: 'HOME',    emoji: '🏠' }
        ];

        const CHOICES = [
            { id: 'bubbles', word: 'BUBBLES', emoji: '🫧' },
            { id: 'toy',     word: 'TOY',     emoji: '🧸' },
            { id: 'music',   word: 'MUSIC',   emoji: '🎧' },
            { id: 'outside', word: 'OUTSIDE', emoji: '🌳' },
            { id: 'quiet',   word: 'QUIET',   emoji: '🛋️' },
            { id: 'draw',    word: 'DRAW',    emoji: '🖍️' }
        ];

        const MINI_ROUTINES = {
            wash: {
                id: 'wash',
                label: '🧼 WASH',
                steps: [
                    { word: 'WATER', emoji: '💧' },
                    { word: 'SOAP',  emoji: '🧼' },
                    { word: 'DRY',   emoji: '🧻' }
                ]
            },
            teeth: {
                id: 'teeth',
                label: '🪥 TEETH',
                steps: [
                    { word: 'PASTE', emoji: '🪥' },
                    { word: 'BRUSH', emoji: '😬' },
                    { word: 'RINSE', emoji: '💧' }
                ]
            },
            coat: {
                id: 'coat',
                label: '🧥 COAT',
                steps: [
                    { word: 'BAG',   emoji: '🎒' },
                    { word: 'COAT',  emoji: '🧥' },
                    { word: 'SHOES', emoji: '👟' }
                ]
            },
            eat: {
                id: 'eat',
                label: '🍎 LUNCH',
                steps: [
                    { word: 'WASH',  emoji: '🧼' },
                    { word: 'EAT',   emoji: '🍎' },
                    { word: 'TIDY',  emoji: '🗑️' }
                ]
            }
        };

        /* ================================================================
           2. STATE & WEB AUDIO + 1-WORD TTS
           ================================================================ */
        const state = {
            mode: 'board',
            voiceOn: true,
            soundOn: true,
            stars: parseInt(localStorage.getItem('ab_routine_stars') || '0', 10),
            // Mode 1: Now & Next Board
            nowItem: ACTIVITIES[0],   // Default: WORK
            nextItem: ACTIVITIES[4],  // Default: PLAY
            activeSlot: 'now',        // 'now' or 'next'
            // Mode 2: Choice
            pickedChoice: null,
            // Mode 3: 1-2-3 Steps
            routineKey: 'wash',
            stepIndex: 0
        };

        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playNotes(freqs, type = 'triangle', spacing = 0.09, duration = 0.38) {
            if (!state.soundOn) return;
            const ctx = getAudioCtx();
            if (!ctx) return;
            const now = ctx.currentTime;
            freqs.forEach((f, idx) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(f, now + idx * spacing);
                gain.gain.setValueAtTime(0.001, now + idx * spacing);
                gain.gain.exponentialRampToValueAtTime(0.24, now + idx * spacing + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * spacing + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(now + idx * spacing);
                osc.stop(now + idx * spacing + duration + 0.02);
            });
        }

        function playTapChime() {
            playNotes([523.25, 659.25], 'sine', 0.07, 0.28);
        }

        function playWinChime() {
            playNotes([523.25, 659.25, 783.99, 1046.50], 'triangle', 0.09, 0.45);
        }

        function speakWord(text) {
            if (!state.voiceOn || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-GB';
                u.rate = 0.92;
                u.pitch = 1.05;
                window.speechSynthesis.speak(u);
            } catch (e) {}
        }

        function addStar() {
            state.stars += 1;
            localStorage.setItem('ab_routine_stars', String(state.stars));
            document.getElementById('star-count').textContent = state.stars;
            if (typeof confetti === 'function') {
                confetti({ particleCount: 45, spread: 65, origin: { y: 0.7 } });
            }
        }

        /* ================================================================
           3. HEADER CONTROLS & TABS
           ================================================================ */
        function toggleVoice() {
            state.voiceOn = !state.voiceOn;
            document.getElementById('btn-voice').classList.toggle('active', state.voiceOn);
            if (state.voiceOn) speakWord('Voice On');
        }

        function toggleSound() {
            state.soundOn = !state.soundOn;
            document.getElementById('btn-sound').classList.toggle('active', state.soundOn);
            if (state.soundOn) playWinChime();
        }

        function clearBoard() {
            if (state.mode === 'board') {
                state.nowItem = null;
                state.nextItem = null;
                state.activeSlot = 'now';
                renderBoardMode();
            } else if (state.mode === 'choice') {
                state.pickedChoice = null;
                renderChoiceMode();
            } else {
                state.stepIndex = 0;
                renderStepsMode();
            }
        }

        function setMode(mode) {
            state.mode = mode;
            ['board', 'choice', 'steps'].forEach(m => {
                document.getElementById('tab-' + m).classList.toggle('active', m === mode);
            });
            if (mode === 'board') renderBoardMode();
            else if (mode === 'choice') renderChoiceMode();
            else renderStepsMode();
        }

        /* ================================================================
           4. MODE 1: 📋 NOW & NEXT BOARD (GENERIC & SUPER SIMPLE)
           ================================================================ */
        function renderBoardMode() {
            const box = document.getElementById('stage-content');

            box.innerHTML = `
                <!-- GIANT NOW & NEXT SLOTS -->
                <div class="now-next-grid">
                    <!-- GREEN NOW BOX -->
                    <div class="board-slot slot-now ${state.activeSlot === 'now' ? 'active-target' : ''}"
                         onclick="selectBoardSlot('now')"
                         ondragover="event.preventDefault()"
                         ondrop="onSlotDrop(event, 'now')"
                         tabindex="0"
                         role="button"
                         aria-label="Now Slot">
                        <span class="slot-badge">🟢 NOW</span>

                        ${state.nowItem ? `
                            <div class="slot-card-inner">
                                <span class="slot-emoji">${state.nowItem.emoji}</span>
                                <span class="slot-word">${state.nowItem.word}</span>
                            </div>
                            <button type="button" class="btn-done-now" onclick="finishNowActivity(event)">
                                ✅ DONE!
                            </button>
                        ` : `
                            <div class="slot-empty-hint">
                                <span style="font-size:2.6rem;">👆</span>
                                <span>TAP CARD</span>
                            </div>
                        `}
                    </div>

                    <div class="board-arrow" aria-hidden="true">➡️</div>

                    <!-- YELLOW NEXT BOX -->
                    <div class="board-slot slot-next ${state.activeSlot === 'next' ? 'active-target' : ''}"
                         onclick="selectBoardSlot('next')"
                         ondragover="event.preventDefault()"
                         ondrop="onSlotDrop(event, 'next')"
                         tabindex="0"
                         role="button"
                         aria-label="Next Slot">
                        <span class="slot-badge">🟡 NEXT</span>

                        ${state.nextItem ? `
                            <div class="slot-card-inner">
                                <span class="slot-emoji">${state.nextItem.emoji}</span>
                                <span class="slot-word">${state.nextItem.word}</span>
                            </div>
                        ` : `
                            <div class="slot-empty-hint">
                                <span style="font-size:2.6rem;">👆</span>
                                <span>TAP CARD</span>
                            </div>
                        `}
                    </div>
                </div>

                <!-- 9 GENERIC 1-WORD ACTIVITY CARDS -->
                <div class="cards-tray">
                    ${ACTIVITIES.map(act => `
                        <button type="button"
                                class="pic-card"
                                draggable="true"
                                ondragstart="onCardDrag(event, '${act.id}')"
                                onclick="placeActivityCard('${act.id}')">
                            <span class="pic-emoji">${act.emoji}</span>
                            <span class="pic-word">${act.word}</span>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function selectBoardSlot(slot) {
            state.activeSlot = slot;
            if (slot === 'now' && state.nowItem) {
                speakWord('Now ' + state.nowItem.word);
            } else if (slot === 'next' && state.nextItem) {
                speakWord('Next ' + state.nextItem.word);
            } else {
                speakWord(slot === 'now' ? 'Now' : 'Next');
            }
            playTapChime();
            renderBoardMode();
        }

        function onCardDrag(e, id) {
            e.dataTransfer.setData('text/plain', id);
        }

        function onSlotDrop(e, slot) {
            e.preventDefault();
            const id = e.dataTransfer.getData('text/plain');
            state.activeSlot = slot;
            placeActivityCard(id);
        }

        function placeActivityCard(id) {
            const act = ACTIVITIES.find(a => a.id === id);
            if (!act) return;

            if (!state.nowItem || state.activeSlot === 'now') {
                state.nowItem = act;
                state.activeSlot = 'next';
                playTapChime();
                speakWord('Now ' + act.word);
            } else {
                state.nextItem = act;
                playTapChime();
                speakWord('Next ' + act.word);
            }
            renderBoardMode();
        }

        function finishNowActivity(e) {
            e.stopPropagation();
            playWinChime();
            addStar();

            if (state.nextItem) {
                state.nowItem = state.nextItem;
                state.nextItem = null;
                state.activeSlot = 'next';
                speakWord('Now ' + state.nowItem.word);
            } else {
                state.nowItem = null;
                state.activeSlot = 'now';
                speakWord('Done');
            }
            renderBoardMode();
        }

        /* ================================================================
           5. MODE 2: 🧸 MY CHOICE (1-WORD REWARD / BREAK BOARD)
           ================================================================ */
        function renderChoiceMode() {
            const box = document.getElementById('stage-content');

            box.innerHTML = `
                <div class="choice-grid">
                    ${CHOICES.map(ch => {
                        const isPicked = state.pickedChoice && state.pickedChoice.id === ch.id;
                        return `
                            <button type="button"
                                    class="choice-card ${isPicked ? 'picked' : ''}"
                                    onclick="pickChoice('${ch.id}')">
                                <span class="choice-emoji">${ch.emoji}</span>
                                <span class="choice-word">${ch.word}</span>
                            </button>
                        `;
                    }).join('')}
                </div>

                ${state.pickedChoice ? `
                    <div class="win-overlay">
                        <div class="win-text">
                            <span>${state.pickedChoice.emoji}</span>
                            <span>NEXT: ${state.pickedChoice.word}!</span>
                        </div>
                        <button type="button" class="btn-next-giant" onclick="setMode('board')">
                            See Board 📋
                        </button>
                    </div>
                ` : ''}
            `;
        }

        function pickChoice(id) {
            const ch = CHOICES.find(c => c.id === id);
            if (!ch) return;
            state.pickedChoice = ch;
            state.nextItem = { id: ch.id, word: ch.word, emoji: ch.emoji };
            playWinChime();
            speakWord(ch.word);
            addStar();
            renderChoiceMode();
        }

        /* ================================================================
           6. MODE 3: 🧼 1-2-3 STEPS (3 GIANT SELF-CARE CARDS)
           ================================================================ */
        function renderStepsMode() {
            const box = document.getElementById('stage-content');
            const routine = MINI_ROUTINES[state.routineKey];
            const allDone = state.stepIndex >= routine.steps.length;

            box.innerHTML = `
                <!-- 4 GENERIC ROUTINE PILLS -->
                <div class="routine-pills">
                    ${Object.values(MINI_ROUTINES).map(r => `
                        <button type="button"
                                class="routine-pill ${state.routineKey === r.id ? 'active' : ''}"
                                onclick="selectRoutine('${r.id}')">
                            ${r.label}
                        </button>
                    `).join('')}
                </div>

                <!-- 3 GIANT 1-2-3 STEP CARDS -->
                <div class="steps-3-grid">
                    ${routine.steps.map((st, idx) => {
                        const isDone = idx < state.stepIndex;
                        const isNext = idx === state.stepIndex;
                        return `
                            <button type="button"
                                    class="step-card ${isDone ? 'done' : ''} ${isNext ? 'next-up' : ''}"
                                    onclick="tapStepCard(${idx})">
                                <div class="step-num-badge">
                                    ${isDone ? '✓' : idx + 1}
                                </div>
                                <span class="step-emoji">${st.emoji}</span>
                                <span class="step-word">${st.word}</span>
                            </button>
                        `;
                    }).join('')}
                </div>

                ${allDone ? `
                    <div class="win-overlay">
                        <div class="win-text">
                            <span>🌟</span>
                            <span>All Done!</span>
                        </div>
                        <button type="button" class="btn-next-giant" onclick="state.stepIndex = 0; renderStepsMode();">
                            Again 🔄
                        </button>
                    </div>
                ` : ''}
            `;
        }

        function selectRoutine(key) {
            state.routineKey = key;
            state.stepIndex = 0;
            const r = MINI_ROUTINES[key];
            playTapChime();
            speakWord(r.steps[0].word);
            renderStepsMode();
        }

        function tapStepCard(idx) {
            const routine = MINI_ROUTINES[state.routineKey];
            if (idx === state.stepIndex) {
                const st = routine.steps[idx];
                state.stepIndex += 1;
                speakWord(st.word);
                if (state.stepIndex >= routine.steps.length) {
                    playWinChime();
                    addStar();
                } else {
                    playTapChime();
                }
                renderStepsMode();
            } else if (idx < state.stepIndex) {
                speakWord(routine.steps[idx].word);
            } else {
                // If student taps ahead, still advance kindly!
                const st = routine.steps[state.stepIndex];
                state.stepIndex += 1;
                speakWord(st.word);
                if (state.stepIndex >= routine.steps.length) {
                    playWinChime();
                    addStar();
                } else {
                    playTapChime();
                }
                renderStepsMode();
            }
        }

        /* ================================================================
           7. SPACEBAR / ENTER SWITCH ACCESSIBILITY
           ================================================================ */
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
                e.preventDefault();
                if (state.mode === 'board') {
                    if (state.nowItem) finishNowActivity(e);
                    else placeActivityCard('work');
                } else if (state.mode === 'choice') {
                    pickChoice('bubbles');
                } else if (state.mode === 'steps') {
                    if (state.stepIndex >= 3) {
                        state.stepIndex = 0;
                        renderStepsMode();
                    } else {
                        tapStepCard(state.stepIndex);
                    }
                }
            }
        });

        // Boot
        document.getElementById('star-count').textContent = state.stars;
        renderBoardMode();
    </script>
</body>
</html>
