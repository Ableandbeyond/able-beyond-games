<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Lanterns Sensory | Able &amp; Beyond</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Outfit', system-ui, sans-serif;
            background: #FAF6F0;
            color: #1E293B;
            transition: background 0.4s ease;
        }

        button:focus-visible,
        [tabindex="0"]:focus-visible {
            outline: 6px solid #F59E0B !important;
            outline-offset: 4px !important;
            box-shadow: 0 0 0 10px rgba(245, 158, 11, 0.35) !important;
        }

        .app {
            max-width: 1240px;
            margin: 0 auto;
            padding: 12px 16px 26px 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 100vh;
        }

        /* --- Simple Top Bar --- */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .back-btn {
            min-height: 72px;
            padding: 10px 24px;
            border-radius: 22px;
            background: #FFFFFF;
            color: #0F172A;
            border: 4px solid #CBD5E1;
            font-family: inherit;
            font-size: 1.45rem;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            box-shadow: 0 6px 0 #94A3B8;
        }

        .back-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #94A3B8;
        }

        .top-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .icon-toggle-btn {
            min-height: 72px;
            padding: 10px 20px;
            border-radius: 22px;
            background: #FFFFFF;
            color: #0F172A;
            border: 4px solid #CBD5E1;
            font-family: inherit;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 6px 0 #94A3B8;
        }

        .icon-toggle-btn.active {
            background: #DCFCE7;
            border-color: #22C55E;
            color: #14532D;
            box-shadow: 0 6px 0 #16A34A;
        }

        /* --- 6 Giant Picture Festival Tabs --- */
        .hub-tabs {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }

        .hub-tab {
            min-height: 102px;
            border-radius: 24px;
            background: #FFFFFF;
            color: #1E293B;
            border: 4px solid #CBD5E1;
            font-family: inherit;
            font-size: 1.35rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 7px 0 #94A3B8;
            transition: transform 0.15s ease, background 0.2s ease;
            padding: 8px;
        }

        .hub-tab:active {
            transform: translateY(4px);
            box-shadow: 0 3px 0 #94A3B8;
        }

        .hub-tab-emoji {
            font-size: 2.9rem;
            line-height: 1;
        }

        .hub-tab.active-harvest { background: #FEF3C7; border-color: #D97706; color: #78350F; box-shadow: 0 7px 0 #B45309; }
        .hub-tab.active-diwali { background: #EDE9FE; border-color: #7C3AED; color: #4C1D95; box-shadow: 0 7px 0 #5B21B6; }
        .hub-tab.active-eid { background: #CCFBF1; border-color: #0D9488; color: #134E4A; box-shadow: 0 7px 0 #0F766E; }
        .hub-tab.active-lunar { background: #FEE2E2; border-color: #DC2626; color: #7F1D1D; box-shadow: 0 7px 0 #B91C1C; }
        .hub-tab.active-christmas { background: #DCFCE7; border-color: #16A34A; color: #14532D; box-shadow: 0 7px 0 #15803D; }
        .hub-tab.active-roots { background: #FFEDD5; border-color: #EA580C; color: #7C2D12; box-shadow: 0 7px 0 #C2410C; }

        /* --- Giant Sensory Stage --- */
        .stage-canvas {
            flex: 1;
            background: #FFFFFF;
            border-radius: 32px;
            border: 5px solid #CBD5E1;
            padding: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 520px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .night-sky {
            background: linear-gradient(180deg, #0F172A 0%, #1E1B4B 60%, #311042 100%) !important;
            border-color: #FACC15 !important;
            color: #FFFFFF;
        }

        .eid-sky {
            background: linear-gradient(180deg, #042F2E 0%, #0F766E 100%) !important;
            border-color: #FDE047 !important;
            color: #FFFFFF;
        }

        .lunar-sky {
            background: linear-gradient(180deg, #7F1D1D 0%, #991B1B 100%) !important;
            border-color: #FACC15 !important;
            color: #FFFFFF;
        }

        .stage-grid-2 {
            width: 100%;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1.25fr;
            gap: 22px;
            align-items: center;
        }

        /* --- Giant Interactive Picture Cards --- */
        .big-pic-card {
            background: #F8FAFC;
            border: 5px solid #CBD5E1;
            border-radius: 26px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            min-height: 175px;
            box-shadow: 0 8px 0 #94A3B8;
            transition: transform 0.15s cubic-bezier(0.18, 1.3, 0.4, 1), background 0.25s;
            font-family: inherit;
        }

        .big-pic-card:hover {
            transform: scale(1.03);
        }

        .big-pic-card:active {
            transform: scale(0.95) translateY(4px);
        }

        .big-pic-card.lit {
            background: #FEF9C3;
            border-color: #EAB308;
            box-shadow: 0 8px 0 #CA8A04, 0 0 28px rgba(250, 204, 21, 0.5);
        }

        .giant-emoji {
            font-size: 4.8rem;
            line-height: 1.05;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.12));
        }

        .card-word {
            font-size: 1.55rem;
            font-weight: 800;
            color: #0F172A;
            text-align: center;
        }

        /* Gong Button */
        .gong-button {
            width: 265px;
            height: 265px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #FEF08A 0%, #F59E0B 55%, #B45309 100%);
            border: 10px solid #78350F;
            box-shadow: 0 14px 30px rgba(120, 53, 15, 0.35), inset 0 0 30px rgba(255,255,255,0.5);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease;
        }

        @keyframes gongRipple {
            0% { transform: scale(0.94); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.8); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 60px rgba(245, 158, 11, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .gong-ringing {
            animation: gongRipple 0.75s ease-out;
        }

        /* Lamps & Lanterns Grid */
        .lamps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
            gap: 16px;
            width: 100%;
            margin: auto 0;
        }

        .lamp-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 4px solid rgba(255, 255, 255, 0.32);
            border-radius: 26px;
            padding: 16px 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 215px;
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .lamp-btn.lamp-lit {
            background: radial-gradient(circle at 50% 35%, rgba(254, 240, 138, 0.42), rgba(245, 158, 11, 0.2));
            border-color: #FACC15;
            box-shadow: 0 0 35px rgba(250, 204, 21, 0.6);
            transform: translateY(-4px);
        }

        @keyframes flameFlicker {
            0% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.12, 1.18) rotate(2deg); }
            100% { transform: scale(0.96, 1.05) rotate(-1deg); }
        }

        .flame-anim {
            transform-origin: 50% 85%;
            animation: flameFlicker 0.55s infinite alternate ease-in-out;
        }

        @keyframes bouncePop {
            0% { transform: scale(1); }
            40% { transform: scale(1.16) rotate(-3deg); }
            100% { transform: scale(1); }
        }

        .bounce-hit {
            animation: bouncePop 0.38s ease-out;
        }

        /* Bottom Sub-Activity Switcher */
        .bottom-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        .big-action-pill {
            min-height: 78px;
            padding: 12px 28px;
            border-radius: 22px;
            background: #2563EB;
            color: #FFFFFF;
            border: 4px solid #1E3A8A;
            font-family: inherit;
            font-size: 1.45rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 0 #1E3A8A;
        }

        .big-action-pill:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1E3A8A;
        }

        @media (max-width: 960px) {
            .hub-tabs {
                grid-template-columns: repeat(3, 1fr);
            }
            .stage-grid-2 {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            .hub-tabs {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Clean Top Bar -->
        <header class="top-bar">
            <a href="https://games.ableandbeyond.support/index.html" onclick="goHome(event)" class="back-btn">
                <span>⬅️</span>
                <span>Home</span>
            </a>

            <div class="top-controls">
                <button id="voice-btn" class="icon-toggle-btn active" onclick="toggleVoice()">
                    <span id="voice-emoji">🔊</span>
                    <span id="voice-text">Words: ON</span>
                </button>
                <button class="icon-toggle-btn" onclick="resetCurrentScene()">
                    <span>🔄</span>
                    <span>Reset</span>
                </button>
            </div>
        </header>

        <!-- 6 Giant Festival Picture Tabs -->
        <nav class="hub-tabs" aria-label="Festivals">
            <button id="tab-harvest" class="hub-tab active-harvest" onclick="openScene('harvest')">
                <span class="hub-tab-emoji">🌾</span>
                <span>Harvest</span>
            </button>
            <button id="tab-diwali" class="hub-tab" onclick="openScene('diwali')">
                <span class="hub-tab-emoji">🪔</span>
                <span>Diwali</span>
            </button>
            <button id="tab-eid" class="hub-tab" onclick="openScene('eid')">
                <span class="hub-tab-emoji">🌙</span>
                <span>Eid</span>
            </button>
            <button id="tab-lunar" class="hub-tab" onclick="openScene('lunar')">
                <span class="hub-tab-emoji">🐉</span>
                <span>Lunar</span>
            </button>
            <button id="tab-christmas" class="hub-tab" onclick="openScene('christmas')">
                <span class="hub-tab-emoji">🎄</span>
                <span>Christmas</span>
            </button>
            <button id="tab-roots" class="hub-tab" onclick="openScene('roots')">
                <span class="hub-tab-emoji">🥁</span>
                <span>Drums</span>
            </button>
        </nav>

        <!-- Giant Visual Stage -->
        <main id="stage" class="stage-canvas" role="main">
            <!-- Populated by JS -->
        </main>
    </div>

    <script>
        const state = {
            scene: 'harvest', // 'harvest' | 'diwali' | 'eid' | 'lunar' | 'christmas' | 'roots'
            voiceOn: true,
            // 1. Harvest (No Halloween pumpkin! Authentic UK Harvest crops + Tractor)
            harvestMode: 'basket', // 'basket' | 'tractor'
            cropsPicked: [false, false, false, false, false, false],
            tractorStep: 0,
            // 2. Diwali
            diwaliMode: 'lamps', // 'lamps' | 'flower'
            lamps: [false, false, false, false, false, false],
            flowerRings: ['#FDE68A', '#FBCFE8', '#A7F3D0', '#DDD6FE', '#FED7AA'],
            // 3. Eid
            eidMode: 'sky', // 'sky' | 'feast'
            eidLanterns: [false, false, false, false, false],
            eidTreats: [false, false, false, false],
            // 4. Lunar New Year
            lunarLanterns: [false, false, false, false],
            dragonDanceCount: 0,
            // 5. Christmas
            christmasMode: 'tree', // 'tree' | 'pie'
            treeLightColorIdx: 0,
            treeBaubles: ['🔴', '🔔', '🌟'],
            pieStep: 0,
            // 6. Roots & Drums
            rootsMode: 'drums', // 'drums' | 'banner'
            bannerStripes: ['#E11D48', '#FACC15', '#16A34A']
        };

        function goHome(e) {
            if (window.location.hostname === 'games.ableandbeyond.support' || window.location.protocol === 'file:') {
                e.preventDefault();
                if (window.location.pathname.includes('/global-lantern-pathway/')) {
                    window.location.href = '../index.html';
                } else {
                    window.location.href = 'index.html';
                }
            }
        }

        // ============================================================================
        // RICH MUSICAL WEB AUDIO SYNTHESIZER
        // ============================================================================
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioCtx ? new AudioCtx() : null;

        function playSound(type, freq = 440) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'gong') {
                // Deep singing bowl + harmonic shimmer
                [196, 293.66, 392, 587.33].forEach((f, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(f, now);
                    gain.gain.setValueAtTime(0.26 / (idx + 1), now);
                    gain.gain.exponentialRampToValueAtTime(0.0008, now + 2.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 2.25);
                });
            } else if (type === 'harp') {
                // Warm plucked harp / sitar chime
                [freq, freq * 1.25, freq * 1.5].forEach((f, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + idx * 0.055);
                    gain.gain.setValueAtTime(0.22, now + idx * 0.055);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.55);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.055);
                    osc.stop(now + idx * 0.055 + 0.58);
                });
            } else if (type === 'sleigh') {
                // Shimmering high sleigh bells / winter chime
                [1046.5, 1318.5, 1567.98, 2093].forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now + i * 0.045);
                    gain.gain.setValueAtTime(0.16, now + i * 0.045);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.045 + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.045);
                    osc.stop(now + i * 0.045 + 0.38);
                });
            } else if (type === 'pentatonic') {
                // Festive Lunar New Year pentatonic chime
                [523.25, 587.33, 659.25, 783.99, 1046.5].forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + i * 0.06);
                    gain.gain.setValueAtTime(0.22, now + i * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.38);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.06);
                    osc.stop(now + i * 0.06 + 0.4);
                });
            } else if (type === 'drum') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.38, now + 0.25);
                gain.gain.setValueAtTime(0.42, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.27);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.28);
            } else if (type === 'shaker') {
                // Crisp maraca / shaker burst + woodblock tone
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(680, now);
                osc.frequency.exponentialRampToValueAtTime(290, now + 0.09);
                gain.gain.setValueAtTime(0.28, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.11);
            } else if (type === 'reggae') {
                // Warm island steel-pan / organ chord
                [261.63, 329.63, 392.00, 523.25].forEach((f, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = idx < 2 ? 'triangle' : 'sine';
                    osc.frequency.setValueAtTime(f, now);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.36);
                });
            } else if (type === 'sparkle') {
                [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + i * 0.07);
                    gain.gain.setValueAtTime(0.24, now + i * 0.07);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.32);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.07);
                    osc.stop(now + i * 0.07 + 0.34);
                });
            }
        }

        function sayWord(word) {
            if (!state.voiceOn) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(word);
                u.rate = 0.92;
                u.pitch = 1.05;
                window.speechSynthesis.speak(u);
            }
        }

        function toggleVoice() {
            state.voiceOn = !state.voiceOn;
            const btn = document.getElementById('voice-btn');
            btn.classList.toggle('active', state.voiceOn);
            document.getElementById('voice-emoji').textContent = state.voiceOn ? '🔊' : '🔇';
            document.getElementById('voice-text').textContent = state.voiceOn ? 'Words: ON' : 'Words: OFF';
            if (!state.voiceOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function openScene(sceneName) {
            state.scene = sceneName;
            playSound('harp', 440);

            const tabs = ['harvest', 'diwali', 'eid', 'lunar', 'christmas', 'roots'];
            tabs.forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                if (el) el.className = 'hub-tab' + (t === sceneName ? ` active-${t}` : '');
            });

            renderScene();
        }

        function resetCurrentScene() {
            playSound('harp', 360);
            if (state.scene === 'harvest') { state.cropsPicked = [false, false, false, false, false, false]; state.tractorStep = 0; }
            else if (state.scene === 'diwali') state.lamps = [false, false, false, false, false, false];
            else if (state.scene === 'eid') { state.eidLanterns = [false, false, false, false, false]; state.eidTreats = [false, false, false, false]; }
            else if (state.scene === 'lunar') { state.lunarLanterns = [false, false, false, false]; state.dragonDanceCount = 0; }
            else if (state.scene === 'christmas') { state.treeBaubles = ['🔴', '🔔']; state.pieStep = 0; }
            renderScene();
        }

        function renderScene() {
            const stage = document.getElementById('stage');
            stage.className = 'stage-canvas';

            if (state.scene === 'diwali' && state.diwaliMode === 'lamps') stage.classList.add('night-sky');
            if (state.scene === 'eid' && state.eidMode === 'sky') stage.classList.add('eid-sky');
            if (state.scene === 'lunar') stage.classList.add('lunar-sky');

            if (state.scene === 'harvest') renderHarvest(stage);
            else if (state.scene === 'diwali') renderDiwali(stage);
            else if (state.scene === 'eid') renderEid(stage);
            else if (state.scene === 'lunar') renderLunar(stage);
            else if (state.scene === 'christmas') renderChristmas(stage);
            else if (state.scene === 'roots') renderRoots(stage);
        }

        // ============================================================================
        // 1. HARVEST FESTIVAL (BREAD, WHEAT, CARROT, APPLE, CORN, POTATO + TRACTOR)
        // ============================================================================
        const HARVEST_ITEMS = [
            { emoji: '🍞', word: 'Bread', pitch: 330 },
            { emoji: '🌾', word: 'Wheat', pitch: 370 },
            { emoji: '🥕', word: 'Carrot', pitch: 415 },
            { emoji: '🍎', word: 'Apple', pitch: 466 },
            { emoji: '🌽', word: 'Corn', pitch: 523 },
            { emoji: '🥔', word: 'Potato', pitch: 587 }
        ];

        function renderHarvest(stage) {
            if (state.harvestMode === 'basket') {
                const cropsHtml = HARVEST_ITEMS.map((c, idx) => {
                    const picked = state.cropsPicked[idx];
                    return `
                        <button class="big-pic-card ${picked ? 'lit' : ''}" onclick="tapHarvestCrop(${idx})">
                            <span class="giant-emoji">${picked ? '🧺' + c.emoji : c.emoji}</span>
                            <span class="card-word">${c.word}</span>
                        </button>
                    `;
                }).join('');

                stage.innerHTML = `
                    <div class="stage-grid-2">
                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;">
                            <button id="gong-btn" class="gong-button" onclick="hitGong()" aria-label="Ring Golden Gong">
                                <span style="font-size:5.2rem;">🔔</span>
                                <span style="font-size:1.9rem; font-weight:800; color:#451A03;">GONG</span>
                            </button>
                        </div>

                        <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; width:100%;">
                            ${cropsHtml}
                        </div>
                    </div>
                    <div class="bottom-bar">
                        <button class="big-action-pill" style="background:#D97706; border-color:#92400E;" onclick="state.harvestMode='tractor'; renderScene();">
                            <span>🚜 Drive Tractor</span>
                        </button>
                    </div>
                `;
            } else {
                const progressPct = (state.tractorStep % 5) * 20;
                stage.innerHTML = `
                    <div style="width:100%; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px;">
                        <div style="width:100%; background:#FEF3C7; border:5px solid #D97706; border-radius:28px; padding:32px 24px; position:relative; min-height:220px; display:flex; align-items:center;">
                            <div style="font-size:6.5rem; transition:transform 0.45s cubic-bezier(0.2, 1.2, 0.4, 1); transform:translateX(${progressPct * 3.2}px);">
                                🚜🌾
                            </div>
                        </div>
                        <button class="big-action-pill" style="background:#16A34A; border-color:#14532D; font-size:2rem; padding:22px 48px;" onclick="driveTractor()">
                            <span>🚜 Tap to Drive Tractor!</span>
                        </button>
                    </div>
                    <div class="bottom-bar">
                        <button class="big-action-pill" style="background:#D97706; border-color:#92400E;" onclick="state.harvestMode='basket'; renderScene();">
                            <span>🧺 Harvest Basket</span>
                        </button>
                    </div>
                `;
            }
        }

        function hitGong() {
            const btn = document.getElementById('gong-btn');
            if (btn) {
                btn.classList.remove('gong-ringing');
                void btn.offsetWidth;
                btn.classList.add('gong-ringing');
            }
            playSound('gong');
            sayWord('Gong!');
        }

        function tapHarvestCrop(idx) {
            state.cropsPicked[idx] = !state.cropsPicked[idx];
            const c = HARVEST_ITEMS[idx];
            playSound('harp', c.pitch);
            sayWord(c.word);

            if (state.cropsPicked.every(Boolean)) {
                playSound('sparkle');
                if (typeof confetti === 'function') confetti({ particleCount: 130, spread: 85, origin: { y: 0.6 } });
            }
            renderScene();
        }

        function driveTractor() {
            state.tractorStep++;
            playSound('drum', 140);
            sayWord('Tractor!');
            if (state.tractorStep % 5 === 4) {
                playSound('sparkle');
                if (typeof confetti === 'function') confetti({ particleCount: 110, spread: 80, origin: { y: 0.6 } });
            }
            renderScene();
        }

        // ============================================================================
        // 2. DIWALI (6 GLOWING CLAY LAMPS + SYMMETRICAL RANGOLI FLOWER)
        // ============================================================================
        function renderDiwali(stage) {
            if (state.diwaliMode === 'lamps') {
                const lampsHtml = state.lamps.map((isLit, idx) => `
                    <button class="lamp-btn ${isLit ? 'lamp-lit' : ''}" onclick="tapDiya(${idx})">
                        <svg viewBox="0 0 140 150" style="width:120px; height:130px; overflow:visible;">
                            ${isLit ? `
                                <circle cx="70" cy="42" r="36" fill="rgba(250, 204, 21, 0.34)"/>
                                <g class="flame-anim">
                                    <path d="M 70 6 Q 94 38 70 64 Q 46 38 70 6 Z" fill="#F97316"/>
                                    <path d="M 70 18 Q 84 40 70 58 Q 56 40 70 18 Z" fill="#FDE047"/>
                                </g>
                            ` : `
                                <line x1="70" y1="52" x2="70" y2="66" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
                            `}
                            <path d="M 16 66 Q 70 82 124 66 L 106 116 Q 70 132 34 116 Z" fill="#D97706" stroke="#FDE68A" stroke-width="4"/>
                            <path d="M 28 88 Q 70 100 112 88" fill="none" stroke="#FACC15" stroke-width="4"/>
                        </svg>
                        <span style="font-size:1.55rem; font-weight:800; color:#FFFFFF; margin-top:6px;">
                            ${isLit ? '✨ Lit!' : 'Lamp'}
                        </span>
                    </button>
                `).join('');

                stage.innerHTML = `
                    <div class="lamps-grid">${lampsHtml}</div>
                    <div class="bottom-bar">
                        <button class="big-action-pill" style="background:#F59E0B; border-color:#B45309; color:#0F172A;" onclick="lightAllDiwaliLamps()">
                            <span>✨ Light All</span>
                        </button>
                        <button class="big-action-pill" style="background:#EC4899; border-color:#9D174D;" onclick="state.diwaliMode='flower'; renderScene();">
                            <span>🌸 Paint Rangoli</span>
                        </button>
                    </div>
                `;
            } else {
                const r = state.flowerRings;
                stage.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; width:100%;">
                        <svg viewBox="0 0 340 340" style="width:310px; height:310px; cursor:pointer;" onclick="paintNextFlowerRing()">
                            <circle cx="170" cy="170" r="158" fill="${r[0]}" stroke="#7C3AED" stroke-width="6"/>
                            <polygon points="170,18 275,65 322,170 275,275 170,322 65,275 18,170 65,65" fill="${r[1]}" stroke="#7C3AED" stroke-width="6"/>
                            <circle cx="170" cy="170" r="110" fill="${r[2]}" stroke="#7C3AED" stroke-width="6"/>
                            <polygon points="170,65 242,98 275,170 242,242 170,275 98,242 65,170 98,98" fill="${r[3]}" stroke="#7C3AED" stroke-width="6"/>
                            <circle cx="170" cy="170" r="55" fill="${r[4]}" stroke="#7C3AED" stroke-width="6"/>
                        </svg>
                    </div>
                    <div class="bottom-bar">
                        <button class="big-action-pill" style="background:#8B5CF6; border-color:#4C1D95;" onclick="paintNextFlowerRing()">
                            <span>🎨 Tap Colour</span>
                        </button>
                        <button class="big-action-pill" style="background:#F59E0B; border-color:#B45309; color:#0F172A;" onclick="state.diwaliMode='lamps'; renderScene();">
                            <span>🪔 Lamps</span>
                        </button>
                    </div>
                `;
            }
        }

        function tapDiya(idx) {
            state.lamps[idx] = !state.lamps[idx];
            playSound('harp', 392 + idx * 55);
            sayWord('Light!');
            if (state.lamps.every(Boolean)) {
                playSound('sparkle');
                if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
            }
            renderScene();
        }

        function lightAllDiwaliLamps() {
            state.lamps = [true, true, true, true, true, true];
            playSound('sparkle');
            sayWord('Diwali Lights!');
            if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
            renderScene();
        }

        const BRIGHT_COLORS = ['#F43F5E', '#FACC15', '#10B981', '#38BDF8', '#A855F7', '#FB923C'];
        let colorCursor = 0;

        function paintNextFlowerRing() {
            colorCursor = (colorCursor + 1) % BRIGHT_COLORS.length;
            state.flowerRings.unshift(BRIGHT_COLORS[colorCursor]);
            state.flowerRings.pop();
            playSound('harp', 523.25);
            sayWord('Colours!');
            renderScene();
        }

        // ============================================================================
        // 3. EID FESTIVAL (CRESCENT MOON & FANOUS LANTERNS + SWEET EID TREATS)
        // ============================================================================
        const EID_FOODS = [
            { emoji: '🌴', word: 'Sweet Dates', pitch: 392 },
            { emoji: '🍯', word: 'Baklava', pitch: 440 },
            { emoji: '🍪', word: 'Star Cookie', pitch: 523.25 },
            { emoji: '🫖', word: 'Mint Tea', pitch: 587.33 }
        ];

        function renderEid(stage) {
            if (state.eidMode === 'sky') {
                const lanternsHtml = state.eidLanterns.map((lit, i) => `
                    <button class="lamp-btn ${lit ? 'lamp-lit' : ''}" onclick="tapEidLantern(${i})">
                        <span class="giant-emoji">${lit ? '🏮✨' : '🏮'}</span>
                        <span style="font-size:1.5rem; font-weight:800; color:#FFF; margin-top:8px;">
                            ${lit ? 'Glowing!' : 'Lantern'}
                        </span>
                    </button>
                `).join('');

                stage.innerHTML = `
                    <div style="text-align:center; margin-bottom:10px; cursor:pointer;" onclick="playSound('sparkle'); sayWord('Eid Moon!');">
                        <span style="font-size:5.8rem; filter:drop-shadow(0 0 25px #FACC15);">🌙⭐</span>
                    </div>
                    <div class="lamps-grid">${lanternsHtml}</div>
                    <div class="bottom-bar">
                        <button class="big-action-pill" style="background:#FACC15; border-color:#CA8A04; color:#0F172A;" onclick="state.eidMode='feast'; renderScene();">
                            <span>🌴 Eid Treats</span>
                        </button>
                    </div>
                `;
            } else {
                const treatsHtml = EID_FOODS.map((t, i) => {
                    const picked = state.eidTreats[i];
                    return `
                        <button class="big-pic-card ${picked ? 'lit' : ''}" onclick="tapEidTreat(${i})">
                            <span class="giant-emoji">${picked ? '🍽️' + t.emoji : t.emoji}</span>
                            <span class="card-word">${t.word}</span>
                        </button>
                    `;
                }).join('');

                stage.innerHTML = `
                    <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:18px; width:100%; flex:1; align-items:center;">
                        ${treatsHtml}
                    </div>
                    <div class="bottom-bar">
                        <button class="big-action-pill" style="background:#0D9488; border-color:#115E59;" onclick="state.eidMode='sky'; renderScene();">
                            <span>🌙 Moon &amp; Lanterns</span>
                        </button>
                    </div>
                `;
            }
        }

        function tapEidLantern(idx) {
            state.eidLanterns[idx] = !state.eidLanterns[idx];
            playSound('harp', 440 + idx * 55);
            sayWord('Lantern!');
            if (state.eidLanterns.every(Boolean)) {
                playSound('sparkle');
                if (typeof confetti === 'function') confetti({ particleCount: 140, spread: 90, origin: { y: 0.5 } });
            }
            renderScene();
        }

        function tapEidTreat(idx) {
            state.eidTreats[idx] = !state.eidTreats[idx];
            const t = EID_FOODS[idx];
            playSound('harp', t.pitch);
            sayWord(t.word);
            if (state.eidTreats.every(Boolean) && typeof confetti === 'function') {
                playSound('sparkle');
                confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            }
            renderScene();
        }

        // ============================================================================
        // 4. LUNAR NEW YEAR (DANCING DRAGON + RED LANTERNS & LUCKY ENVELOPES)
        // ============================================================================
        function renderLunar(stage) {
            const items = [
                { emoji: '🏮', word: 'Red Lantern' },
                { emoji: '🧧', word: 'Lucky Envelope' },
                { emoji: '🥟', word: 'Dumpling' },
                { emoji: '🎆', word: 'Fireworks' }
            ];

            const cardsHtml = items.map((item, i) => {
                const lit = state.lunarLanterns[i];
                return `
                    <button class="lamp-btn ${lit ? 'lamp-lit' : ''}" onclick="tapLunarItem(${i}, '${item.word}')">
                        <span class="giant-emoji">${lit ? item.emoji + '✨' : item.emoji}</span>
                        <span style="font-size:1.5rem; font-weight:800; color:#FFF; margin-top:8px;">${item.word}</span>
                    </button>
                `;
            }).join('');

            stage.innerHTML = `
                <div class="stage-grid-2">
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center;">
                        <button id="dragon-btn" class="big-pic-card lit" style="min-height:280px; width:100%; background:#FEF08A; border-color:#F59E0B;" onclick="danceDragon()">
                            <span class="giant-emoji" style="font-size:6.8rem;">🐉🥁</span>
                            <span class="card-word" style="color:#7F1D1D;">Tap Dragon!</span>
                        </button>
                    </div>
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%;">
                        ${cardsHtml}
                    </div>
                </div>
            `;
        }

        function danceDragon() {
            state.dragonDanceCount++;
            const btn = document.getElementById('dragon-btn');
            if (btn) {
                btn.classList.remove('bounce-hit');
                void btn.offsetWidth;
                btn.classList.add('bounce-hit');
            }
            playSound('pentatonic');
            sayWord('Dragon!');
            if (typeof confetti === 'function') confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
        }

        function tapLunarItem(idx, word) {
            state.lunarLanterns[idx] = !state.lunarLanterns[idx];
            playSound('pentatonic');
            sayWord(word);
            if (idx === 3 && typeof confetti === 'function') {
                confetti({ particleCount: 150, spread: 95, origin: { y: 0.5 } });
            }
            renderScene();
        }

        // ============================================================================
        // 5. CHRISTMAS (GIANT TREE WITH SLEIGH BELLS + 3-TAP PIE MAKER)
        // ============================================================================
        function renderChristmas(stage) {
            if (state.christmasMode === 'tree') {
                const lightPalettes = [
                    ['#FACC15', '#EF4444', '#38BDF8'],
                    ['#34D399', '#FDE047', '#F472B6'],
                    ['#A855F7', '#38BDF8', '#FACC15']
                ];
                const cols = lightPalettes[state.treeLightColorIdx];
                const coords = [
                    { x: 160, y: 120 }, { x: 125, y: 168 }, { x: 192, y: 165 },
                    { x: 108, y: 218 }, { x: 160, y: 212 }, { x: 210, y: 220 },
                    { x: 92, y: 268 }, { x: 148, y: 272 }, { x: 205, y: 268 }, { x: 235, y: 262 }
                ];

                const baublesSvg = state.treeBaubles.map((b, i) => {
                    const pt = coords[i % coords.length];
                    return `<text x="${pt.x}" y="${pt.y}" font-size="32" text-anchor="middle">${b}</text>`;
                }).join('');

                stage.innerHTML = `
                    <div class="stage-grid-2">
                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;" onclick="decorateTree('🌟', 'Star!')">
                            <svg viewBox="0 0 320 330" style="width:100%; max-width:330px; height:auto; filter:drop-shadow(0 10px 16px rgba(0,0,0,0.12));">
                                <rect x="138" y="280" width="44" height="44" rx="6" fill="#78350F"/>
                                <polygon points="160,22 235,125 85,125" fill="#15803D" stroke="#14532D" stroke-width="4" stroke-linejoin="round"/>
                                <polygon points="160,78 265,205 55,205" fill="#16A34A" stroke="#14532D" stroke-width="4" stroke-linejoin="round"/>
                                <polygon points="160,142 290,285 30,285" fill="#22C55E" stroke="#14532D" stroke-width="4" stroke-linejoin="round"/>
                                <polygon points="160,2 168,20 188,22 173,35 177,54 160,44 143,54 147,35 132,22 152,20" fill="#FACC15" stroke="#CA8A04" stroke-width="3"/>
                                <circle cx="145" cy="95" r="8" fill="${cols[0]}"/>
                                <circle cx="180" cy="102" r="8" fill="${cols[1]}"/>
                                <circle cx="115" cy="155" r="9" fill="${cols[2]}"/>
                                <circle cx="162" cy="150" r="9" fill="${cols[0]}"/>
                                <circle cx="205" cy="158" r="9" fill="${cols[1]}"/>
                                <circle cx="85" cy="238" r="9" fill="${cols[1]}"/>
                                <circle cx="135" cy="245" r="9" fill="${cols[2]}"/>
                                <circle cx="185" cy="240" r="9" fill="${cols[0]}"/>
                                <circle cx="235" cy="235" r="9" fill="${cols[2]}"/>
                                ${baublesSvg}
                            </svg>
                        </div>

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:14px; width:100%;">
                            <button class="big-pic-card lit" onclick="switchTreeLights()">
                                <span class="giant-emoji">💡</span>
                                <span class="card-word">Lights</span>
                            </button>
                            <button class="big-pic-card" onclick="decorateTree('🔴', 'Bauble!')">
                                <span class="giant-emoji">🔴</span>
                                <span class="card-word">Bauble</span>
                            </button>
                            <button class="big-pic-card" onclick="decorateTree('🔔', 'Sleigh Bell!')">
                                <span class="giant-emoji">🔔</span>
                                <span class="card-word">Bell</span>
                            </button>
                            <button class="big-pic-card" style="background:#FEF3C7; border-color:#F59E0B;" onclick="state.christmasMode='pie'; renderScene();">
                                <span class="giant-emoji">🥧</span>
                                <span class="card-word">Bake Pie</span>
                            </button>
                        </div>
                    </div>
                `;
            } else {
                const pieStages = [
                    { emoji: '🥣', word: '1. Mix Bowl' },
                    { emoji: '🍇', word: '2. Spiced Fruit' },
                    { emoji: '🥧✨', word: '3. Mince Pie!' }
                ];
                stage.innerHTML = `
                    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; width:100%; flex:1; align-items:center;">
                        ${pieStages.map((p, idx) => `
                            <button class="big-pic-card ${idx <= state.pieStep ? 'lit' : ''}" style="min-height:270px;" onclick="tapPieStep(${idx})">
                                <span class="giant-emoji" style="font-size:6rem;">${p.emoji}</span>
                                <span class="card-word">${p.word}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div class="bottom-bar">
                        <button class="big-action-pill" style="background:#16A34A; border-color:#14532D;" onclick="state.christmasMode='tree'; renderScene();">
                            <span>🎄 Back to Tree</span>
                        </button>
                    </div>
                `;
            }
        }

        function switchTreeLights() {
            state.treeLightColorIdx = (state.treeLightColorIdx + 1) % 3;
            playSound('sleigh');
            sayWord('Lights!');
            renderScene();
        }

        function decorateTree(ornament, spoken) {
            if (state.treeBaubles.length >= 10) state.treeBaubles = [];
            state.treeBaubles.push(ornament);
            playSound('sleigh');
            sayWord(spoken);
            if (state.treeBaubles.length % 5 === 0 && typeof confetti === 'function') {
                confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
            }
            renderScene();
        }

        function tapPieStep(idx) {
            state.pieStep = idx;
            if (idx === 2) {
                playSound('sparkle');
                sayWord('Mince Pie!');
                if (typeof confetti === 'function') confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 } });
            } else {
                playSound('harp', 420 + idx * 90);
                sayWord(idx === 0 ? 'Mix!' : 'Fruit!');
            }
            renderScene();
        }

        // ============================================================================
        // 6. ROOTS & DRUMS (4 INSTRUMENTS + RED-GOLD-GREEN BANNER)
        // ============================================================================
        function renderRoots(stage) {
            stage.innerHTML = `
                <div style="display:grid; grid-template-columns:repeat(2, 1fr); gap:18px; width:100%; flex:1; align-items:center;">
                    <button id="drum-1" class="big-pic-card" style="background:#FEE2E2; border-color:#E11D48; box-shadow:0 8px 0 #BE123C;"
                            onclick="hitDrum('drum-1', 'drum', 110, 'Big Drum!')">
                        <span class="giant-emoji">🥁</span>
                        <span class="card-word" style="color:#881337;">Big Drum</span>
                    </button>

                    <button id="drum-2" class="big-pic-card" style="background:#FEF9C3; border-color:#EAB308; box-shadow:0 8px 0 #CA8A04;"
                            onclick="hitDrum('drum-2', 'drum', 220, 'Talking Drum!')">
                        <span class="giant-emoji">🪘</span>
                        <span class="card-word" style="color:#713F12;">Talking Drum</span>
                    </button>

                    <button id="drum-3" class="big-pic-card" style="background:#FFEDD5; border-color:#EA580C; box-shadow:0 8px 0 #C2410C;"
                            onclick="hitDrum('drum-3', 'shaker', 440, 'Maracas!')">
                        <span class="giant-emoji">🪇</span>
                        <span class="card-word" style="color:#7C2D12;">Shaker</span>
                    </button>

                    <button id="drum-4" class="big-pic-card" style="background:#DCFCE7; border-color:#16A34A; box-shadow:0 8px 0 #15803D;"
                            onclick="hitDrum('drum-4', 'reggae', 330, 'Reggae Music!')">
                        <span class="giant-emoji">🎶</span>
                        <span class="card-word" style="color:#14532D;">Reggae Chord</span>
                    </button>
                </div>
            `;
        }

        function hitDrum(btnId, soundType, freq, word) {
            const el = document.getElementById(btnId);
            if (el) {
                el.classList.remove('bounce-hit');
                void el.offsetWidth;
                el.classList.add('bounce-hit');
            }
            playSound(soundType, freq);
            sayWord(word);
        }

        // --- Single-Switch / Spacebar Instant Action Support ---
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                if (state.scene === 'harvest') {
                    if (state.harvestMode === 'tractor') driveTractor();
                    else hitGong();
                } else if (state.scene === 'diwali') {
                    if (state.diwaliMode === 'lamps') {
                        const nextUnlit = state.lamps.indexOf(false);
                        if (nextUnlit !== -1) tapDiya(nextUnlit);
                        else { state.lamps = [false, false, false, false, false, false]; tapDiya(0); }
                    } else {
                        paintNextFlowerRing();
                    }
                } else if (state.scene === 'eid') {
                    const nextLantern = state.eidLanterns.indexOf(false);
                    if (nextLantern !== -1) tapEidLantern(nextLantern);
                    else { state.eidLanterns = [false, false, false, false, false]; tapEidLantern(0); }
                } else if (state.scene === 'lunar') {
                    danceDragon();
                } else if (state.scene === 'christmas') {
                    decorateTree('🌟', 'Star!');
                } else if (state.scene === 'roots') {
                    const types = [
                        ['drum-1', 'drum', 110, 'Big Drum!'],
                        ['drum-2', 'drum', 220, 'Talking Drum!'],
                        ['drum-3', 'shaker', 440, 'Maracas!'],
                        ['drum-4', 'reggae', 330, 'Reggae Music!']
                    ];
                    const pick = types[Math.floor(Math.random() * types.length)];
                    hitDrum(pick[0], pick[1], pick[2], pick[3]);
                }
            }
        });

        // Boot Game
        renderScene();
    </script>
</body>
</html>
