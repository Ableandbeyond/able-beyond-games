<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Global Lantern Pathway | Able &amp; Beyond</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FAF6F0;
            --bg-card: #FFFFFF;
            --bg-panel: #F3ECE1;
            --sage-main: #4A7C59;
            --sage-light: #E6F0E9;
            --sage-border: #8FB399;
            --gold-main: #C88A2B;
            --gold-light: #FEF6E4;
            --gold-border: #E5B869;
            --earth-main: #B85D3B;
            --earth-light: #FCEEE9;
            --text-dark: #1E2923;
            --text-muted: #4A5D52;
            --border-soft: #D5CBB8;
            --focus-scan: #F59E0B;
            --font-scale: 1;
            --font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            --letter-space: 0em;
            --word-space: 0em;
            --line-height: 1.45;
        }

        body.dyslexia-mode {
            --bg-cream: #FDFBF7;
            --bg-card: #FFFDF9;
            --bg-panel: #F4EFE6;
            --font-family: 'Comic Neue', 'Outfit', Verdana, Tahoma, sans-serif;
            --letter-space: 0.055em;
            --word-space: 0.14em;
            --line-height: 1.7;
        }

        body.xlarge-text {
            --font-scale: 1.22;
        }

        * {
            box-sizing: border-box;
            max-width: 100%;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: var(--bg-cream);
            color: var(--text-dark);
            font-family: var(--font-family);
            letter-spacing: var(--letter-space);
            word-spacing: var(--word-space);
            line-height: var(--line-height);
            font-size: calc(16px * var(--font-scale));
            transition: background-color 0.25s ease, color 0.25s ease;
        }

        /* High-Visibility Assistive & Switch Scan Highlight */
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        [tabindex="0"]:focus-visible,
        .scan-active {
            outline: 5px solid var(--focus-scan) !important;
            outline-offset: 3px !important;
            box-shadow: 0 0 0 8px rgba(245, 158, 11, 0.38) !important;
            transform: translateY(-2px);
            z-index: 20;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            padding: 14px 18px 48px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* --- Top Navigation & Low-Arousal Accessibility Bar --- */
        .top-bar {
            background: var(--bg-card);
            border: 3px solid var(--border-soft);
            border-radius: 22px;
            padding: 14px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: 0 6px 18px rgba(30, 41, 35, 0.05);
        }

        .brand-Cluster {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .hub-back-btn {
            min-height: 68px;
            padding: 12px 20px;
            border-radius: 16px;
            background: var(--bg-panel);
            color: var(--text-dark);
            border: 3px solid var(--border-soft);
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--border-soft);
        }

        .hub-back-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--border-soft);
        }

        .brand-heading h1 {
            margin: 0;
            font-size: 1.55rem;
            font-weight: 800;
            color: var(--sage-main);
            word-break: break-word;
        }

        .brand-heading p {
            margin: 2px 0 0 0;
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .a11y-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .a11y-btn {
            min-height: 68px;
            padding: 10px 14px;
            border-radius: 16px;
            background: var(--bg-panel);
            color: var(--text-dark);
            border: 3px solid var(--border-soft);
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            box-shadow: 0 4px 0 var(--border-soft);
            text-align: center;
        }

        .a11y-btn.active-toggle {
            background: var(--sage-main);
            color: #FFFFFF;
            border-color: #2E5239;
            box-shadow: 0 4px 0 #2E5239;
        }

        /* --- Mode Switcher: Festival Hubs vs 14-Stage Curriculum Pathway --- */
        .primary-nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
        }

        .nav-pill-btn {
            min-height: 76px;
            padding: 12px 16px;
            border-radius: 18px;
            background: var(--bg-card);
            color: var(--text-dark);
            border: 3px solid var(--border-soft);
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            box-shadow: 0 5px 0 var(--border-soft);
            transition: all 0.15s ease;
        }

        .nav-pill-btn.active {
            background: var(--sage-main);
            color: #FFFFFF;
            border-color: #2E5239;
            box-shadow: 0 5px 0 #2E5239;
        }

        .nav-pill-icon {
            font-size: 2rem;
            flex-shrink: 0;
        }

        /* --- Spoken Prompt & Switch Helper Bar --- */
        .prompt-banner {
            background: var(--gold-light);
            border: 3px solid var(--gold-border);
            border-radius: 20px;
            padding: 14px 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .prompt-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 240px;
        }

        .speak-icon-btn {
            min-width: 68px;
            min-height: 68px;
            border-radius: 16px;
            background: var(--gold-main);
            color: #FFFFFF;
            border: 3px solid #966316;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 4px 0 #966316;
            flex-shrink: 0;
        }

        .prompt-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-dark);
            word-break: break-word;
        }

        .prompt-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 2px;
        }

        .pathway-badge {
            background: var(--sage-light);
            color: var(--sage-main);
            border: 2px solid var(--sage-border);
            padding: 8px 16px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 0.95rem;
        }

        /* --- Main Interactive Stage Container --- */
        .workspace-card {
            background: var(--bg-card);
            border: 3px solid var(--border-soft);
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 10px 26px rgba(30, 41, 35, 0.05);
            overflow: hidden;
        }

        .sub-tabs-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--bg-panel);
        }

        .sub-tab-btn {
            min-height: 60px;
            padding: 10px 18px;
            border-radius: 14px;
            background: var(--bg-panel);
            color: var(--text-dark);
            border: 3px solid var(--border-soft);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
        }

        .sub-tab-btn.active {
            background: var(--gold-main);
            color: #FFFFFF;
            border-color: #966316;
        }

        /* --- Interactive Cards & Grids --- */
        .interactive-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-top: 14px;
        }

        .sensory-tile {
            min-height: 145px;
            background: var(--bg-cream);
            color: var(--text-dark);
            border: 4px solid var(--border-soft);
            border-radius: 22px;
            padding: 18px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 8px;
            font-family: inherit;
            box-shadow: 0 6px 0 var(--border-soft);
            transition: transform 0.15s ease, background-color 0.2s ease, border-color 0.2s ease;
            word-break: break-word;
        }

        .sensory-tile:hover {
            border-color: var(--sage-main);
        }

        .sensory-tile:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--border-soft);
        }

        .sensory-tile.activated {
            background: var(--sage-light);
            border-color: var(--sage-main);
            box-shadow: 0 6px 0 var(--sage-main);
        }

        .sensory-tile.gold-glow {
            background: var(--gold-light);
            border-color: var(--gold-main);
            box-shadow: 0 0 22px rgba(200, 138, 43, 0.45);
        }

        .tile-emoji {
            font-size: 3.3rem;
            line-height: 1.1;
        }

        .tile-title {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .tile-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* --- 14-Stage Curriculum Pathway Grid --- */
        .band-section {
            margin-bottom: 22px;
            background: var(--bg-cream);
            border: 3px solid var(--border-soft);
            border-radius: 20px;
            padding: 16px;
        }

        .band-header {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--sage-main);
            margin: 0 0 12px 0;
        }

        .levels-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
            gap: 10px;
        }

        .level-card-btn {
            min-height: 82px;
            padding: 12px 14px;
            border-radius: 16px;
            background: var(--bg-card);
            color: var(--text-dark);
            border: 3px solid var(--border-soft);
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 800;
            cursor: pointer;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 4px;
            box-shadow: 0 4px 0 var(--border-soft);
        }

        .level-card-btn.current-lvl {
            background: var(--gold-light);
            border-color: var(--gold-main);
            box-shadow: 0 4px 0 var(--gold-main);
        }

        .level-card-btn.done-lvl {
            background: var(--sage-light);
            border-color: var(--sage-main);
        }

        /* --- Christmas Tree & Rangoli SVG Canvases --- */
        .visual-stage-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-cream);
            border: 3px solid var(--border-soft);
            border-radius: 22px;
            padding: 20px;
            margin-top: 14px;
            text-align: center;
        }

        .action-pill-btn {
            min-height: 74px;
            padding: 14px 26px;
            border-radius: 18px;
            background: var(--sage-main);
            color: #FFFFFF;
            border: 3px solid #2E5239;
            font-family: inherit;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 5px 0 #2E5239;
            margin: 8px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .action-pill-btn.gold {
            background: var(--gold-main);
            border-color: #8A5A14;
            box-shadow: 0 5px 0 #8A5A14;
        }

        .custom-text-input {
            width: 100%;
            max-width: 520px;
            min-height: 68px;
            padding: 14px 18px;
            font-family: inherit;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 16px;
            border: 3px solid var(--border-soft);
            background: var(--bg-card);
            color: var(--text-dark);
            margin: 10px 0;
        }

        /* Pulse ripple animation for gongs & lights */
        @keyframes softPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .pulse-once {
            animation: softPulse 0.45s ease-out;
        }

        @media (max-width: 768px) {
            .app-wrapper {
                padding: 10px 12px 36px 12px;
            }
            .top-bar, .workspace-card {
                padding: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <!-- Accessible Low-Arousal Top Header -->
        <header class="top-bar" role="banner">
            <div class="brand-Cluster">
                <a href="https://games.ableandbeyond.support/index.html" onclick="goBackHub(event)" class="hub-back-btn" data-scan="true">
                    <span>⬅️</span>
                    <span>Back to Hub</span>
                </a>
                <div class="brand-heading">
                    <h1>🏮 The Global Lantern Pathway</h1>
                    <p>Community, Environment &amp; the Wider World • Multisensory SEN Curriculum</p>
                </div>
            </div>

            <div class="a11y-toolbar" role="toolbar" aria-label="Accessibility Controls">
                <button class="a11y-btn" id="btn-dyslexia" onclick="toggleDyslexiaMode()" data-scan="true" aria-pressed="false">
                    <span style="font-size:1.4rem;">📖</span>
                    <span>Dyslexia Font</span>
                </button>
                <button class="a11y-btn" id="btn-xlarge" onclick="toggleXLargeText()" data-scan="true" aria-pressed="false">
                    <span style="font-size:1.4rem;">🔍</span>
                    <span>Large Text</span>
                </button>
                <button class="a11y-btn" id="btn-scan" onclick="toggleSwitchScan()" data-scan="true" aria-pressed="false">
                    <span style="font-size:1.4rem;">🎯</span>
                    <span id="scan-label">Switch Scan: OFF</span>
                </button>
                <button class="a11y-btn active-toggle" id="btn-voice" onclick="toggleVoice()" data-scan="true" aria-pressed="true">
                    <span style="font-size:1.4rem;" id="voice-icon">🔊</span>
                    <span id="voice-label">Voice: ON</span>
                </button>
            </div>
        </header>

        <!-- Primary Navigation: 4 Cultural Hubs + 14-Stage Curriculum Map -->
        <nav class="primary-nav-grid" role="navigation" aria-label="Festival Hubs and Curriculum Map">
            <button class="nav-pill-btn active" id="nav-pathway" onclick="openMainView('pathway')" data-scan="true">
                <span class="nav-pill-icon">🗺️</span>
                <div>
                    <div>14-Stage Pathway</div>
                    <div style="font-size:0.82rem; opacity:0.85;">Levels 1–14 Curriculum</div>
                </div>
            </button>
            <button class="nav-pill-btn" id="nav-harvest" onclick="openMainView('harvest')" data-scan="true">
                <span class="nav-pill-icon">🌾</span>
                <div>
                    <div>Hub 1: Harvest</div>
                    <div style="font-size:0.82rem; opacity:0.85;">Grains &amp; Acoustic Gongs</div>
                </div>
            </button>
            <button class="nav-pill-btn" id="nav-diwali" onclick="openMainView('diwali')" data-scan="true">
                <span class="nav-pill-icon">🪔</span>
                <div>
                    <div>Hub 2: Diwali</div>
                    <div style="font-size:0.82rem; opacity:0.85;">Diyas &amp; Rangoli Symmetry</div>
                </div>
            </button>
            <button class="nav-pill-btn" id="nav-christmas" onclick="openMainView('christmas')" data-scan="true">
                <span class="nav-pill-icon">🎄</span>
                <div>
                    <div>Hub 3: Christmas</div>
                    <div style="font-size:0.82rem; opacity:0.85;">Baking, Tree &amp; Kindness</div>
                </div>
            </button>
            <button class="nav-pill-btn" id="nav-roots" onclick="openMainView('roots')" data-scan="true">
                <span class="nav-pill-icon">🥁</span>
                <div>
                    <div>Hub 4: Roots &amp; Rhythms</div>
                    <div style="font-size:0.82rem; opacity:0.85;">Drumming &amp; Heritage Art</div>
                </div>
            </button>
        </nav>

        <!-- Spoken Instruction & Predictive Coding Banner -->
        <section class="prompt-banner" aria-live="polite">
            <div class="prompt-left">
                <button class="speak-icon-btn" onclick="speakCurrentPrompt()" data-scan="true" aria-label="Read Prompt Aloud">🔊</button>
                <div>
                    <div class="prompt-title" id="prompt-title">Welcome to The Global Lantern Pathway!</div>
                    <div class="prompt-subtitle" id="prompt-subtitle">Touch any card, use Arrow keys, or press Spacebar in Switch Scan mode to explore.</div>
                </div>
            </div>
            <div class="pathway-badge" id="progress-badge">🌟 Stages Completed: 0 / 14</div>
        </section>

        <!-- Dynamic Interactive Workspace -->
        <main id="workspace" class="workspace-card" role="main">
            <!-- Rendered dynamically by JS -->
        </main>
    </div>

    <script>
        // ============================================================================
        // 1. STATE & LOCALSTORAGE MANAGEMENT
        // ============================================================================
        const state = {
            view: 'pathway', // 'pathway' | 'harvest' | 'diwali' | 'christmas' | 'roots'
            currentLevel: 1,
            completedLevels: [],
            dyslexiaMode: false,
            xlargeText: false,
            voiceOn: true,
            switchScanOn: false,
            scanIndex: 0,
            scanTimer: null,
            // Hub-specific sub-states
            harvestSub: 'gong', // 'gong' | 'sort'
            harvestSorted: [],
            diwaliSub: 'candles', // 'candles' | 'rangoli'
            diyasLit: [false, false, false, false, false, false],
            rangoliColors: ['#C88A2B', '#E11D48', '#0D9488', '#4A7C59', '#7C3AED', '#F59E0B'],
            rangoliSelectedColor: '#C88A2B',
            rangoliPetals: ['#F3ECE1', '#F3ECE1', '#F3ECE1', '#F3ECE1', '#F3ECE1', '#F3ECE1', '#F3ECE1', '#F3ECE1'],
            christmasSub: 'baking', // 'baking' | 'tree' | 'textures' | 'hope'
            bakingRecipe: 'mince', // 'mince' | 'fairy'
            bakingStep: 0,
            treeLightsOn: true,
            treeLightTheme: 0,
            treeOrnaments: [],
            winterSorted: [],
            hopeStars: [
                { author: 'Community Star', text: 'Sharing warm smiles and kindness with friends' }
            ],
            rootsSub: 'drums', // 'drums' | 'art'
            rootsTempoCount: 0,
            rootsCanvasStripes: ['#E11D48', '#FACC15', '#16A34A', '#FACC15']
        };

        function loadSavedState() {
            try {
                const savedLevels = localStorage.getItem('ab_lantern_completed');
                if (savedLevels) state.completedLevels = JSON.parse(savedLevels);
                if (localStorage.getItem('ab_lantern_dyslexia') === 'true') {
                    state.dyslexiaMode = true;
                    document.body.classList.add('dyslexia-mode');
                    document.getElementById('btn-dyslexia').classList.add('active-toggle');
                }
                if (localStorage.getItem('ab_lantern_xlarge') === 'true') {
                    state.xlargeText = true;
                    document.body.classList.add('xlarge-text');
                    document.getElementById('btn-xlarge').classList.add('active-toggle');
                }
            } catch (e) {}
            updateProgressBadge();
        }

        function markLevelComplete(lvl) {
            if (!state.completedLevels.includes(lvl)) {
                state.completedLevels.push(lvl);
                try {
                    localStorage.setItem('ab_lantern_completed', JSON.stringify(state.completedLevels));
                } catch (e) {}
            }
            updateProgressBadge();
        }

        function updateProgressBadge() {
            const el = document.getElementById('progress-badge');
            if (el) el.textContent = `🌟 Stages Completed: ${state.completedLevels.length} / 14`;
        }

        function goBackHub(e) {
            if (window.location.hostname === 'games.ableandbeyond.support' || window.location.protocol === 'file:') {
                e.preventDefault();
                if (window.location.pathname.includes('/global-lantern-pathway/')) {
                    window.location.href = '../index.html';
                } else {
                    window.location.href = 'index.html';
                }
            }
        }

        // ============================================================================
        // 2. WEB AUDIO SYNTHESIZER (GONGS, CHIMES, TALKING DRUMS, REGGAE PULSE)
        // ============================================================================
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioCtx ? new AudioCtx() : null;

        function playSound(type, pitch = 440) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'gong') {
                // Rich harmonic singing bowl / bronze gong
                [pitch, pitch * 1.5, pitch * 2.02].forEach((freq, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = idx === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.22 / (idx + 1), now);
                    gain.gain.exponentialRampToValueAtTime(0.0008, now + 1.8);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 1.85);
                });
            } else if (type === 'chime') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, now);
                osc.frequency.exponentialRampToValueAtTime(pitch * 1.25, now + 0.18);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.36);
            } else if (type === 'drum-bass' || type === 'drum-tone' || type === 'drum-slap') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type === 'drum-slap' ? 'triangle' : 'sine';
                const startFreq = type === 'drum-bass' ? 115 : (type === 'drum-tone' ? 220 : 340);
                const endFreq = type === 'drum-bass' ? 55 : (type === 'drum-tone' ? 140 : 180);
                osc.frequency.setValueAtTime(startFreq, now);
                osc.frequency.exponentialRampToValueAtTime(endFreq, now + 0.22);
                gain.gain.setValueAtTime(0.32, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'reggae-skank') {
                // Warm triad chord pulse
                [261.63, 329.63, 392.00].forEach((freq) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.24);
                });
            } else if (type === 'celebrate') {
                [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + i * 0.09);
                    gain.gain.setValueAtTime(0.22, now + i * 0.09);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.35);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.09);
                    osc.stop(now + i * 0.09 + 0.36);
                });
            }
        }

        function speakText(text) {
            if (!state.voiceOn) return;

                u.pitch = 1.02;
                window.speechSynthesis.speak(u);

            if (state.switchScanOn) {
                state.scanIndex = 0;

            } else {

        function getScannableElements() {
            return Array.from(document.querySelectorAll('#workspace button:not(:disabled), #workspace [data-scan="true"], .primary-nav-grid button'))
                .filter(el => el.offsetParent !== null);
        }

        function startScanLoop() {
            stopScanLoop();
            const items = getScannableElements();
            if (items.length > 0) highlightScanItem(items, 0);

            state.scanTimer = setInterval(() => {
                const currentItems = getScannableElements();
                if (!currentItems.length) return;
                state.scanIndex = (state.scanIndex + 1) % currentItems.length;
                highlightScanItem(currentItems, state.scanIndex);
            }, 2200);
        }

        function highlightScanItem(items, idx) {
            document.querySelectorAll('.scan-active').forEach(el => el.classList.remove('scan-active'));
            const target = items[idx];
            if (target) {
                target.classList.add('scan-active');
                target.focus({ preventScroll: false });
            }
        }

        function stopScanLoop() {
            if (state.scanTimer) {
                clearInterval(state.scanTimer);
                state.scanTimer = null;
            }
            document.querySelectorAll('.scan-active').forEach(el => el.classList.remove('scan-active'));
        }

        window.addEventListener('keydown', (e) => {
            if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
                return;
            }
            if (state.switchScanOn && (e.key === ' ' || e.key === 'Enter')) {
                const activeScanEl = document.querySelector('.scan-active');
                if (activeScanEl) {
                    e.preventDefault();
                    activeScanEl.click();
                    return;
                }
            }
            if (['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp'].includes(e.key)) {
                const items = getScannableElements();
                if (!items.length) return;
                e.preventDefault();
                const currentIdx = items.indexOf(document.activeElement);
                if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                    const next = currentIdx >= 0 ? (currentIdx + 1) % items.length : 0;
                    items[next].focus();
                } else {
                    const prev = currentIdx > 0 ? currentIdx - 1 : items.length - 1;
                    items[prev].focus();
                }
            }
        });

        // ============================================================================

        function openMainView(viewKey) {
            state.view = viewKey;
            playSound('chime', 480);

            ['pathway', 'harvest', 'diwali', 'christmas', 'roots'].forEach(k => {
                const btn = document.getElementById(`nav-${k}`);
                if (btn) btn.classList.toggle('active', k === viewKey);
            });

            if (viewKey === 'pathway') renderPathwayView();
            else if (viewKey === 'harvest') renderHarvestHub();
            else if (viewKey === 'diwali') renderDiwaliHub();
            else if (viewKey === 'christmas') renderChristmasHub();
            else if (viewKey === 'roots') renderRootsHub();

            if (state.switchScanOn) startScanLoop();
        }

        // ============================================================================
        // VIEW 1: THE 14-STAGE CURRICULUM PATHWAY
        // ============================================================================
        function renderPathwayView() {
            const ws = document.getElementById('workspace');
            const activeStage = CURRICULUM_STAGES.find(s => s.lvl === state.currentLevel) || CURRICULUM_STAGES[0];

            setPrompt(
                `${activeStage.stageName} — ${activeStage.title}`,
                activeStage.prompt,
                false
            );

            // Group stages by band
            const bands = [];
            CURRICULUM_STAGES.forEach(s => {
                let b = bands.find(x => x.name === s.band);
                if (!b) {
                    b = { name: s.band, stages: [] };
                    bands.push(b);
                }
                b.stages.push(s);
            });

            const activeCardsHtml = activeStage.items.map((item, idx) => `
                <button class="sensory-tile" onclick="triggerStageItem(${activeStage.lvl}, ${idx})" data-scan="true">
                    <span class="tile-emoji">${item.emoji}</span>
                    <span class="tile-title">${item.title}</span>
                    <span class="tile-desc">${item.desc}</span>
                </button>
            `).join('');

            const customInputHtml = activeStage.hasCustomInput ? `
                <div class="visual-stage-box">
                    <label for="stage-custom-input" style="font-weight:800; font-size:1.15rem;">✍️ Or type your own personal thought / tradition below:</label>
                    <input id="stage-custom-input" type="text" class="custom-text-input" placeholder="Type your message or preference here..." />
                    <button class="action-pill-btn gold" onclick="speakCustomInput(${activeStage.lvl})" data-scan="true">
                        <span>🗣️ Speak &amp; Save My Connection</span>
                    </button>

                <div class="band-section">

                    <div class="levels-row">
                        ${b.stages.map(st => {
                            const isDone = state.completedLevels.includes(st.lvl);
                            const isCurr = st.lvl === state.currentLevel;
                            return `
                                <button class="level-card-btn ${isCurr ? 'current-lvl' : ''} ${isDone ? 'done-lvl' : ''}"

                                    <div style="display:flex; justify-content:space-between; width:100%;">
                                        <span style="color:var(--sage-main);">${st.stageName}</span>
                                        <span>${isDone ? '✅' : (isCurr ? '👉' : '⚪')}</span>
                                    </div>
                                    <div style="font-size:1.02rem;">${st.title}</div>
                                </button>

                </div>

            ws.innerHTML = `

                            ${activeStage.lvl < 14 ? `<button class="sub-tab-btn active" onclick="selectCurriculumLevel(${activeStage.lvl + 1})" data-scan="true">Next Level ➔</button>` : ''}
                        </div>
                    </div>

                    <div class="interactive-grid">${activeCardsHtml}</div>

                <h3 style="font-size:1.35rem; margin:0 0 12px 0;">🗺️ Complete 14-Stage SEN Curriculum Map (Click any stage to jump):</h3>

        function selectCurriculumLevel(lvl) {
            state.currentLevel = lvl;
            const st = CURRICULUM_STAGES.find(s => s.lvl === lvl);
            playSound('chime', 440 + lvl * 20);
            renderPathwayView();
            if (st) speakText(`${st.stageName}: ${st.title}. ${st.prompt}`);
        }

        function triggerStageItem(lvl, itemIdx) {
            const st = CURRICULUM_STAGES.find(s => s.lvl === lvl);
            if (!st) return;
            const item = st.items[itemIdx];
            if (!item) return;

            markLevelComplete(lvl);

            if (item.actionHub) {
                openMainView(item.actionHub);
                return;

            playSound('gong', 392);
            markLevelComplete(8);
            setPrompt(`${item.name}: ${item.category}`, 'Seasonal sensory sorting');
            renderChristmasHub();
        }

        function addHopeStar(text) {
            state.hopeStars.unshift({ author: 'Kindness Star', text });
            playSound('celebrate');
            markLevelComplete(14);
            setPrompt(`Star of Hope launched: "${text}"`, 'Community Day of Hope celebration!');
            renderChristmasHub();
        }

        function submitCustomHopeStar() {
            const inp = document.getElementById('custom-hope-input');
            const val = inp && inp.value.trim() ? inp.value.trim() : 'Spreading peace, kindness, and friendship to everyone!';
            addHopeStar(val);
        }

        // ============================================================================
        // HUB 4: ROOTS & RHYTHMS (NIGERIAN DRUMMING, REGGAE TEMPO & HERITAGE ART)
        // ============================================================================
        function renderRootsHub() {
            const ws = document.getElementById('workspace');
            setPrompt(
                'Hub 4: Roots & Rhythms Cultural Celebration (November) 🥁',
                'Play Nigerian talking drums, tap along to a calm Reggae tempo, and create Red-Gold-Green heritage art.',
                false
            );

            let content = '';
            if (state.rootsSub === 'drums') {
                content = `
                    <p style="font-weight:600; color:var(--text-muted);">Tap the West African drum pads or Reggae tempo buttons to create rhythmic beats (Beats tapped: ${state.rootsTempoCount}):</p>
                    <div class="interactive-grid">
                        <button class="sensory-tile" style="border-color:#E11D48; background:#FFF1F2;" onclick="playRootsDrum('drum-bass', 'Nigerian Djembe Bass Beat — Deep Gun tone!')" data-scan="true">
                            <span class="tile-emoji">🥁</span>
                            <span class="tile-title">Djembe Bass ("Gun")</span>
                            <span class="tile-desc">Deep resonant center drum beat</span>
                        </button>
                        <button class="sensory-tile" style="border-color:#CA8A04; background:#FEF9C3;" onclick="playRootsDrum('drum-tone', 'Talking Drum Open Tone — Warm melodic pitch!')" data-scan="true">
                            <span class="tile-emoji">🪘</span>
                            <span class="tile-title">Talking Drum ("Go")</span>
                            <span class="tile-desc">Warm Nigerian talking drum tone</span>
                        </button>
                        <button class="sensory-tile" style="border-color:#16A34A; background:#DCFCE7;" onclick="playRootsDrum('drum-slap', 'Crisp Rim Slap — High rhythmic accent!')" data-scan="true">
                            <span class="tile-emoji">👐</span>
                            <span class="tile-title">Rhythm Slap ("Pa")</span>
                            <span class="tile-desc">Crisp rim percussion tap</span>
                        </button>
                        <button class="sensory-tile gold-glow" onclick="playRootsDrum('reggae-skank', 'Reggae One-Drop Skank Chord — One Love steady tempo!')" data-scan="true">
                            <span class="tile-emoji">🎶</span>
                            <span class="tile-title">Reggae Tempo Chord</span>
                            <span class="tile-desc">Warm island off-beat guitar &amp; organ pulse</span>
                        </button>
                    </div>
                `;
            } else {
                const heritageColors = [
                    { name: 'Heritage Red', hex: '#E11D48' },
                    { name: 'Lion Gold', hex: '#FACC15' },
                    { name: 'Earth Green', hex: '#16A34A' },
                    { name: 'Warm Ebony', hex: '#1E2923' }
                ];

                content = `
                    <div class="visual-stage-box">
                        <h3 style="margin:0 0 8px 0;">🎨 Red-Gold-Green Heritage Banner Studio</h3>
                        <p style="margin:0 0 14px 0; color:var(--text-muted); font-weight:600;">Tap any band on the Unity Banner below to cycle through Red, Gold, and Green heritage patterns!</p>

                        <svg viewBox="0 0 360 220" style="width:100%; max-width:420px; height:auto; border-radius:18px; border:4px solid #1E2923; overflow:hidden; cursor:pointer;">
                            ${state.rootsCanvasStripes.map((col, idx) => `
                                <rect x="0" y="${idx * 55}" width="360" height="55" fill="${col}" onclick="cycleHeritageStripe(${idx})"/>
                            `).join('')}
                            <!-- Center Unity Star -->
                            <polygon points="180,55 194,92 234,94 202,118 212,156 180,134 148,156 158,118 126,94 166,92" fill="#FACC15" stroke="#1E2923" stroke-width="4" onclick="playRootsDrum('reggae-skank', 'Unity Star shining brightly!')"/>
                        </svg>

                        <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:16px;">
                            ${state.rootsCanvasStripes.map((_, idx) => `
                                <button class="action-pill-btn" onclick="cycleHeritageStripe(${idx})" data-scan="true">
                                    🎨 Change Band ${idx + 1} Colour
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            ws.innerHTML = `
                <div class="sub-tabs-row">
                    <button class="sub-tab-btn ${state.rootsSub === 'drums' ? 'active' : ''}" onclick="state.rootsSub='drums'; renderRootsHub();" data-scan="true">🥁 4A. Nigerian Drumming &amp; Reggae Tempo</button>
                    <button class="sub-tab-btn ${state.rootsSub === 'art' ? 'active' : ''}" onclick="state.rootsSub='art'; renderRootsHub();" data-scan="true">🎨 4B. Red-Gold-Green Visual Art</button>
                </div>
                ${content}
            `;
        }

        function playRootsDrum(soundType, label) {
            state.rootsTempoCount++;
            playSound(soundType);
            markLevelComplete(3);
            markLevelComplete(10);
            setPrompt(label, `Rhythm pulse count: ${state.rootsTempoCount}`);
            renderRootsHub();
        }

        function cycleHeritageStripe(idx) {
            const palette = ['#E11D48', '#FACC15', '#16A34A', '#1E2923'];
            const curr = state.rootsCanvasStripes[idx];
            const next = palette[(palette.indexOf(curr) + 1) % palette.length];
            state.rootsCanvasStripes[idx] = next;
            playSound('reggae-skank');
            markLevelComplete(9);
            setPrompt(`Updated Banner Band ${idx + 1} with vibrant heritage colour!`, 'Red-Gold-Green visual art creation');
            renderRootsHub();
        }

        // Boot Module
        loadSavedState();
        renderPathwayView();
    </script>
</body>
</html>
