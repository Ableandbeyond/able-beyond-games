<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Healthy Hero | Able & Beyond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #E0F2FE;
      --bg-bottom: #DCFCE7;
      --primary: #0284C7;
      --primary-dark: #0369A1;
      --green: #16A34A;
      --green-dark: #15803D;
      --red: #EF4444;
      --text: #0F172A;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 4px solid #BAE6FD;
      z-index: 20;
      flex-shrink: 0;
      gap: 10px;
      flex-wrap: wrap;
    }

    .back-btn {
      text-decoration: none;
      background: #FFFFFF;
      color: var(--primary-dark);
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      padding: 8px 16px;
      border-radius: 50px;
      border: 3px solid #7DD3FC;
      box-shadow: 0 4px 0 #7DD3FC;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.1s;
    }
    .back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7DD3FC; }

    .game-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.3rem, 2.5vw, 1.9rem);
      color: #0369A1;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: #FFFFFF;
      border: 3px solid #CBD5E1;
      border-radius: 50px;
      padding: 7px 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 4px 0 #CBD5E1;
      transition: all 0.15s;
    }
    .ctrl-btn.active {
      background: #DCFCE7;
      border-color: #22C55E;
      color: #166534;
      box-shadow: 0 4px 0 #22C55E;
    }
    .ctrl-btn:active { transform: translateY(3px); }

    .star-box {
      background: #FEF9C3;
      border: 3px solid #FACC15;
      border-radius: 50px;
      padding: 7px 15px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      color: #854D0E;
      box-shadow: 0 4px 0 #FACC15;
    }

    /* MODE BAR */
    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 8px 14px;
      background: rgba(255,255,255,0.65);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .mode-tab {
      background: #FFFFFF;
      border: 4px solid #CBD5E1;
      border-radius: 50px;
      padding: 7px 20px;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: #475569;
      cursor: pointer;
      box-shadow: 0 5px 0 #CBD5E1;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mode-tab.active {
      background: #0284C7;
      border-color: #0369A1;
      color: #FFFFFF;
      box-shadow: 0 5px 0 #0369A1;
      transform: translateY(-2px);
    }

    /* MAIN STAGE */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px 18px;
      position: relative;
      overflow: hidden;
    }

    /* PROMPT BANNER + HELPFUL INSTRUCTION SUB-TEXT */
    .prompt-banner {
      background: #FFFFFF;
      border: 5px solid #38BDF8;
      border-radius: 28px;
      padding: 10px 26px;
      box-shadow: 0 8px 0 rgba(2, 132, 199, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      z-index: 5;
      transition: transform 0.15s;
      max-width: 820px;
      text-align: center;
    }
    .prompt-banner:active { transform: scale(0.97); }

    .prompt-top-line {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .prompt-emoji { font-size: clamp(2rem, 4vw, 3rem); line-height: 1; }
    .prompt-text {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.35rem, 2.8vw, 2rem);
      color: var(--text);
    }
    .prompt-sub {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: clamp(1rem, 1.9vw, 1.25rem);
      color: #0369A1;
      background: #E0F2FE;
      padding: 4px 16px;
      border-radius: 50px;
    }

    /* PATIENT / TARGET ZONE */
    .patient-zone {
      position: relative;
      width: clamp(220px, 34vw, 300px);
      height: clamp(195px, 32vh, 270px);
      background: rgba(255,255,255,0.92);
      border: 6px solid #7DD3FC;
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0,0,0,0.1);
      transition: transform 0.25s, border-color 0.25s, background 0.25s;
    }
    .patient-zone.healed {
      border-color: #22C55E;
      background: #F0FDF4;
      transform: scale(1.05);
    }

    .ouch-badge {
      position: absolute;
      top: -16px;
      right: -16px;
      background: #FEE2E2;
      border: 4px solid #EF4444;
      color: #B91C1C;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.2rem;
      padding: 6px 14px;
      border-radius: 50px;
      box-shadow: 0 6px 12px rgba(239, 68, 68, 0.25);
      animation: pulseOuch 1.1s infinite alternate;
    }
    .ouch-badge.healed {
      background: #DCFCE7;
      border-color: #22C55E;
      color: #15803D;
      animation: none;
    }

    @keyframes pulseOuch {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    /* HEALTHY SORT BINS (MODE 3) */
    .bins-row {
      display: none;
      gap: 28px;
      width: 100%;
      max-width: 780px;
      justify-content: center;
      align-items: center;
    }
    .sort-bin {
      flex: 1;
      max-width: 310px;
      height: clamp(165px, 26vh, 220px);
      border-radius: 32px;
      border: 6px solid;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      background: #FFFFFF;
    }
    .sort-bin:hover { transform: translateY(-4px); }
    .sort-bin.good-bin {
      border-color: #22C55E;
      background: #F0FDF4;
      box-shadow: 0 10px 0 #16A34A;
    }
    .sort-bin.treat-bin {
      border-color: #F59E0B;
      background: #FFFBEB;
      box-shadow: 0 10px 0 #D97706;
    }
    .bin-emoji { font-size: clamp(2.8rem, 5.5vw, 4.2rem); line-height: 1; }
    .bin-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.25rem, 2.3vw, 1.65rem);
      text-align: center;
    }

    /* BOTTOM CARDS TRAY */
    .tray {
      display: flex;
      justify-content: center;
      gap: clamp(14px, 2.5vw, 28px);
      width: 100%;
      max-width: 960px;
      z-index: 10;
      flex-wrap: wrap;
    }

    .choice-card {
      background: #FFFFFF;
      border: 6px solid #CBD5E1;
      border-radius: 28px;
      width: clamp(150px, 24vw, 225px);
      height: clamp(130px, 20vh, 175px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 10px 0 #CBD5E1, 0 12px 24px rgba(0,0,0,0.08);
      transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s, opacity 0.2s;
      touch-action: none;
    }
    .choice-card:hover {
      transform: translateY(-4px);
      border-color: #38BDF8;
      box-shadow: 0 12px 0 #38BDF8;
    }
    .choice-card.correct {
      background: #DCFCE7;
      border-color: #22C55E;
      box-shadow: 0 10px 0 #16A34A;
      animation: bounceWin 0.6s ease;
    }
    .choice-card.wrong {
      opacity: 0.35;
      transform: scale(0.92);
    }

    .card-emoji { font-size: clamp(2.8rem, 5.5vw, 4.2rem); line-height: 1; }
    .card-label {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.15rem, 2.1vw, 1.5rem);
      color: var(--text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    @keyframes bounceWin {
      0%, 100% { transform: scale(1); }
      40% { transform: scale(1.15) rotate(-4deg); }
      70% { transform: scale(1.1) rotate(4deg); }
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <!-- TOP BAR -->
  <header class="top-bar">
    <a href="https://games.ableandbeyond.support/index.html" class="back-btn">⬅️ Hub</a>
    <div class="game-title">🏥 Healthy Hero</div>
    <div class="controls">
      <button class="ctrl-btn" id="cards-btn" onclick="toggleCardCount()">🃏 2 Cards</button>
      <button class="ctrl-btn active" id="voice-btn" onclick="toggleVoice()">🗣️ Voice: ON</button>
      <button class="ctrl-btn active" id="sound-btn" onclick="toggleSound()">🎵 Sound: ON</button>
      <div class="star-box">⭐ <span id="star-count">0</span></div>
    </div>
  </header>

  <!-- MODE BAR -->
  <nav class="mode-bar">
    <button class="mode-tab active" id="tab-kit" onclick="setMode('kit')">🩹 1. Doctor Kit</button>
    <button class="mode-tab" id="tab-body" onclick="setMode('body')">🩺 2. What Hurts?</button>
    <button class="mode-tab" id="tab-food" onclick="setMode('food')">🍎 3. Healthy Sort</button>
  </nav>

  <!-- MAIN STAGE -->
  <main class="stage">
    <div class="prompt-banner" onclick="speakPrompt()">
      <div class="prompt-top-line">
        <span class="prompt-emoji" id="prompt-emoji">🩹</span>
        <span class="prompt-text" id="prompt-text">Teddy has a CUT on his knee!</span>
        <span style="font-size: 1.5rem;">🔊</span>
      </div>
      <div class="prompt-sub" id="prompt-sub">👉 Tap the PLASTER 🩹 below to help Teddy feel better!</div>
    </div>

    <!-- TEDDY / PATIENT ZONE (Modes 1 & 2) -->
    <div class="patient-zone" id="patient-zone">
      <div class="ouch-badge" id="ouch-badge">🩸 CUT</div>
      <div id="teddy-container"></div>
    </div>

    <!-- HEALTHY SORT BINS (Mode 3) -->
    <div class="bins-row" id="bins-row">
      <div class="sort-bin good-bin" onclick="handleBinTap('good')">
        <div class="bin-emoji">😊🥦</div>
        <div class="bin-title" style="color:#15803D;">GOOD FOR ME<br><span style="font-size:0.95rem;">(Healthy Everyday)</span></div>
      </div>
      <div class="sort-bin treat-bin" onclick="handleBinTap('treat')">
        <div class="bin-emoji">🦷🍬</div>
        <div class="bin-title" style="color:#B45309;">SOMETIME TREAT<br><span style="font-size:0.95rem;">(Sugary Snack)</span></div>
      </div>
    </div>

    <!-- BOTTOM CHOICE TRAY -->
    <div class="tray" id="tray"></div>
  </main>

  <script>
    let mode = 'kit';
    let cardCount = 2;
    let voiceOn = true;
    let soundOn = true;
    let stars = 0;
    let currentRound = null;
    let roundIndex = 0;
    let locked = false;

    // MODE 1: DOCTOR KIT DATA (With helpful short instructions!)
    const KIT_ROUNDS = [
      {
        id: 'cut',
        problemEmoji: '🩸',
        problemLabel: 'CUT',
        spot: 'knee',
        headline: 'Teddy has a CUT on his knee!',

        toolEmoji: '🩹',
        toolName: 'PLASTER',

        headline: 'Teddy feels very HOT and poorly!',

      {
        id: 'nose',
        problemEmoji: '🤧',
        problemLabel: 'SNEEZE',
        spot: 'nose',
        headline: 'Achoo! Teddy has a runny nose!',
        subline: '👉 Tap the TISSUE 🧻 below to wipe Teddy’s nose!',
        toolEmoji: '🧻',
        toolName: 'TISSUE',
        speech: 'Achoo! Teddy has a runny nose. Tap the soft tissue below to wipe his nose!',
        winSpeech: 'Thank you! All clean with the tissue!'
      },
      {
        id: 'teeth',
        problemEmoji: '🦷',
        problemLabel: 'DIRTY TEETH',
        spot: 'mouth',
        headline: 'Teddy needs to clean his teeth!',
        subline: '👉 Tap the TOOTHBRUSH 🪥 below to brush his teeth!',
        toolEmoji: '🪥',
        toolName: 'BRUSH',
        speech: 'Teddy ate breakfast and needs clean teeth! Tap the toothbrush below!',
        winSpeech: 'Brush, brush, brush! Teddy has shiny clean teeth!'
      },
      {
        id: 'hands',
        problemEmoji: '🦠',
        problemLabel: 'MESSY HANDS',
        spot: 'hand',
        headline: 'Teddy has muddy, messy paws!',
        subline: '👉 Tap the SOAP 🧼 below to wash the germs away!',
        toolEmoji: '🧼',
        toolName: 'SOAP',
        speech: 'Teddy has messy paws! Tap the soap bubbles below to wash his hands clean!',
        winSpeech: 'Wash, wash, wash! Squeaky clean paws!'
      },
      {
        id: 'thirsty',
        problemEmoji: '🥵',
        problemLabel: 'THIRSTY',
        spot: 'mouth',
        headline: 'Teddy is hot and thirsty after playing!',
        subline: '👉 Tap the WATER 💧 below to give Teddy a drink!',
        toolEmoji: '💧',
        toolName: 'WATER',
        speech: 'Teddy is thirsty after playing outside! Tap the cup of water below!',
        winSpeech: 'Gulp, gulp! Refreshing water makes Teddy feel great!'
      }
    ];

    // MODE 2: WHAT HURTS? (BODY PARTS)
    const BODY_ROUNDS = [
      {
        id: 'head',
        emoji: '🤕',
        name: 'HEAD',
        spot: 'head',
        headline: 'Where is Teddy hurting?',
        subline: '👉 Look at the glowing red circle on Teddy’s HEAD and tap HEAD below!',
        speech: 'Look at the glowing circle on Teddy. His head hurts! Tap Head below.',
        winSpeech: 'That is right! You found his head!'
      },
      {
        id: 'tummy',
        emoji: '🤢',
        name: 'TUMMY',
        spot: 'tummy',
        headline: 'Teddy has a sore tummy!',
        subline: '👉 Look at the glowing circle on Teddy’s middle and tap TUMMY below!',
        speech: 'Teddy has a sore tummy! Tap the Tummy card below.',
        winSpeech: 'Well done! That is Teddy’s tummy!'
      },
      {
        id: 'tooth',
        emoji: '🦷',
        name: 'TOOTH',
        spot: 'mouth',
        headline: 'Teddy has a sore tooth!',
        subline: '👉 Look at Teddy’s mouth and tap the TOOTH 🦷 card below!',
        speech: 'Teddy has toothache! Tap the Tooth card below.',
        winSpeech: 'Spot on! You found the tooth!'
      },
      {
        id: 'knee',
        emoji: '🦵',
        name: 'KNEE',
        spot: 'knee',
        headline: 'Teddy bumped his leg!',
        subline: '👉 Look at the glowing circle on Teddy’s leg and tap KNEE 🦵 below!',
        speech: 'Teddy bumped his knee! Tap the Knee card below.',
        winSpeech: 'Fantastic! That is his knee!'
      },
      {
        id: 'ear',
        emoji: '👂',
        name: 'EAR',
        spot: 'ear',
        headline: 'Teddy has a sore ear!',
        subline: '👉 Look at the top of Teddy’s head and tap EAR 👂 below!',
        speech: 'Teddy has a sore ear! Tap the Ear card below.',
        winSpeech: 'Great job! That is his ear!'
      }
    ];

    // MODE 3: HEALTHY SORT
    const FOOD_ROUNDS = [
      { id: 'apple', emoji: '🍎', name: 'APPLE', type: 'good', speech: 'An apple! Is an apple good for your body every day, or a sugary treat?' },
      { id: 'water', emoji: '🥛', name: 'WATER', type: 'good', speech: 'Fresh water! Is water good for your body, or a sugary treat?' },
      { id: 'broccoli', emoji: '🥦', name: 'BROCCOLI', type: 'good', speech: 'Green broccoli! Is broccoli good for you, or a sugary treat?' },
      { id: 'banana', emoji: '🍌', name: 'BANANA', type: 'good', speech: 'A yellow banana! Tap Good For Me or Sometime Treat!' },
      { id: 'lollipop', emoji: '🍭', name: 'LOLLIPOP', type: 'treat', speech: 'A sugary lollipop! Is a lollipop an everyday healthy food, or a sometime treat?' },
      { id: 'donut', emoji: '🍩', name: 'DOUGHNUT', type: 'treat', speech: 'A sweet doughnut! Tap Good For Me or Sometime Treat!' },
      { id: 'fizzy', emoji: '🥤', name: 'FIZZY DRINK', type: 'treat', speech: 'A sugary fizzy drink! Is it good for your teeth, or a sometime treat?' },
      { id: 'carrot', emoji: '🥕', name: 'CARROT', type: 'good', speech: 'A crunchy carrot! Tap Good For Me or Sometime Treat!' }
    ];

    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playWinSound() {
      if (!soundOn) return;
      try {
        const ctx = getAudio();
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.09);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.09 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + i * 0.09);
          osc.stop(ctx.currentTime + i * 0.09 + 0.26);
        });
      } catch (e) {}
    }

    function playSoftTap() {
      if (!soundOn) return;
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(320, ctx.currentTime);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.13);
      } catch (e) {}
    }

    window._activeUtterance = null;
    function speak(text, onDone = null) {
      if (!voiceOn || !('speechSynthesis' in window)) {
        if (onDone) setTimeout(onDone, 1400);
        return;
      }
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      window._activeUtterance = u;
      u.lang = 'en-GB';
      u.rate = 0.92;
      u.pitch = 1.06;

      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        if (onDone) onDone();
      };
      u.onend = () => setTimeout(done, 500);
      u.onerror = () => setTimeout(done, 500);
      setTimeout(done, Math.max(2800, text.length * 90));

      window.speechSynthesis.speak(u);
    }

    function speakPrompt() {
      if (currentRound && currentRound.speech) speak(currentRound.speech);
    }

    function toggleCardCount() {
      cardCount = cardCount === 2 ? 3 : 2;
      document.getElementById('cards-btn').textContent = `🃏 ${cardCount} Cards`;
      loadRound();
    }

    function toggleVoice() {
      voiceOn = !voiceOn;
      const btn = document.getElementById('voice-btn');
      btn.textContent = `🗣️ Voice: ${voiceOn ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', voiceOn);
    }

    function toggleSound() {
      soundOn = !soundOn;
      const btn = document.getElementById('sound-btn');
      btn.textContent = `🎵 Sound: ${soundOn ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', soundOn);
    }

    function setMode(newMode) {
      mode = newMode;
      roundIndex = 0;
      ['kit', 'body', 'food'].forEach(m => {
        document.getElementById(`tab-${m}`).classList.toggle('active', m === mode);
      });
      loadRound();
    }

    function renderTeddySVG(spot, isHappy) {
      const spotCoords = {
        head:  { cx: 100, cy: 48 },
        ear:   { cx: 52,  cy: 38 },
        nose:  { cx: 100, cy: 76 },
        mouth: { cx: 100, cy: 90 },
        tummy: { cx: 100, cy: 140 },
        hand:  { cx: 45,  cy: 128 },
        knee:  { cx: 76,  cy: 185 }
      };
      const sc = spotCoords[spot] || { cx: 100, cy: 140 };

      return `
        <svg viewBox="0 0 200 220" width="185" height="195" aria-label="Teddy Patient">
          <circle cx="52" cy="38" r="24" fill="#D97706" stroke="#92400E" stroke-width="5"/>
          <circle cx="52" cy="38" r="12" fill="#FDE68A"/>
          <circle cx="148" cy="38" r="24" fill="#D97706" stroke="#92400E" stroke-width="5"/>
          <circle cx="148" cy="38" r="12" fill="#FDE68A"/>
          <ellipse cx="46" cy="128" rx="22" ry="16" fill="#D97706" stroke="#92400E" stroke-width="5"/>
          <ellipse cx="154" cy="128" rx="22" ry="16" fill="#D97706" stroke="#92400E" stroke-width="5"/>
          <ellipse cx="100" cy="142" rx="46" ry="50" fill="#D97706" stroke="#92400E" stroke-width="5"/>
          <ellipse cx="100" cy="144" rx="28" ry="32" fill="#FDE68A"/>
          <circle cx="74" cy="188" r="20" fill="#D97706" stroke="#92400E" stroke-width="5"/>
          <circle cx="74" cy="188" r="10" fill="#FDE68A"/>
          <circle cx="126" cy="188" r="20" fill="#D97706" stroke="#92400E" stroke-width="5"/>
          <circle cx="126" cy="188" r="10" fill="#FDE68A"/>
          <circle cx="100" cy="72" r="44" fill="#D97706" stroke="#92400E" stroke-width="5"/>
          <ellipse cx="100" cy="82" rx="20" ry="15" fill="#FDE68A"/>
          <circle cx="82" cy="64" r="6" fill="#1E293B"/>
          <circle cx="118" cy="64" r="6" fill="#1E293B"/>
          <ellipse cx="100" cy="76" rx="8" ry="6" fill="#78350F"/>
          ${isHappy
            ? `<path d="M 88 86 Q 100 98 112 86" fill="none" stroke="#78350F" stroke-width="4.5" stroke-linecap="round"/>`
            : `<path d="M 88 92 Q 100 83 112 92" fill="none" stroke="#78350F" stroke-width="4.5" stroke-linecap="round"/>`
          }
          ${!isHappy ? `
            <circle cx="${sc.cx}" cy="${sc.cy}" r="18" fill="rgba(239,68,68,0.38)" stroke="#EF4444" stroke-width="4">
              <animate attributeName="r" values="14;23;14" dur="1.1s" repeatCount="indefinite"/>
            </circle>
          ` : `
            <circle cx="${sc.cx}" cy="${sc.cy}" r="16" fill="rgba(34,197,94,0.35)" stroke="#16A34A" stroke-width="4"/>
          `}
        </svg>
      `;
    }

    function loadRound() {
      locked = false;
      const pZone = document.getElementById('patient-zone');
      const binsRow = document.getElementById('bins-row');
      const tray = document.getElementById('tray');
      const ouchBadge = document.getElementById('ouch-badge');
      pZone.classList.remove('healed');
      ouchBadge.classList.remove('healed');
      tray.innerHTML = '';

      if (mode === 'kit') {
        pZone.style.display = 'flex';
        binsRow.style.display = 'none';
        currentRound = KIT_ROUNDS[roundIndex % KIT_ROUNDS.length];

        document.getElementById('prompt-emoji').textContent = currentRound.problemEmoji;
        document.getElementById('prompt-text').textContent = currentRound.headline;
        document.getElementById('prompt-sub').textContent = currentRound.subline;
        ouchBadge.textContent = `${currentRound.problemEmoji} ${currentRound.problemLabel}`;
        document.getElementById('teddy-container').innerHTML = renderTeddySVG(currentRound.spot, false);

        const distractors = KIT_ROUNDS.filter(r => r.id !== currentRound.id)
          .sort(() => Math.random() - 0.5)
          .slice(0, cardCount - 1);
        const choices = [currentRound, ...distractors].sort(() => Math.random() - 0.5);

        choices.forEach(item => {
          const card = document.createElement('button');
          card.className = 'choice-card';
          card.innerHTML = `
            <div class="card-emoji">${item.toolEmoji}</div>
            <div class="card-label">${item.toolName}</div>
          `;
          card.onclick = () => checkChoice(card, item.id === currentRound.id, item.toolName);
          tray.appendChild(card);
        });
      } else if (mode === 'body') {
        pZone.style.display = 'flex';
        binsRow.style.display = 'none';
        currentRound = BODY_ROUNDS[roundIndex % BODY_ROUNDS.length];

        document.getElementById('prompt-emoji').textContent = currentRound.emoji;
        document.getElementById('prompt-text').textContent = currentRound.headline;
        document.getElementById('prompt-sub').textContent = currentRound.subline;
        ouchBadge.textContent = `${currentRound.emoji} ${currentRound.name}`;
        document.getElementById('teddy-container').innerHTML = renderTeddySVG(currentRound.spot, false);

        const distractors = BODY_ROUNDS.filter(r => r.id !== currentRound.id)
          .sort(() => Math.random() - 0.5)
          .slice(0, cardCount - 1);
        const choices = [currentRound, ...distractors].sort(() => Math.random() - 0.5);

        choices.forEach(item => {
          const card = document.createElement('button');
          card.className = 'choice-card';
          card.innerHTML = `
            <div class="card-emoji">${item.emoji}</div>
            <div class="card-label">${item.name}</div>
          `;
          card.onclick = () => checkChoice(card, item.id === currentRound.id, item.name);
          tray.appendChild(card);
        });
      } else if (mode === 'food') {
        pZone.style.display = 'none';
        binsRow.style.display = 'flex';
        currentRound = FOOD_ROUNDS[roundIndex % FOOD_ROUNDS.length];

        document.getElementById('prompt-emoji').textContent = currentRound.emoji;
        document.getElementById('prompt-text').textContent = `Is ${currentRound.name} healthy or a sugary treat?`;
        document.getElementById('prompt-sub').textContent = `👉 Tap GOOD FOR ME 😊 for healthy food, or SOMETIME TREAT 🦷 for sugary snacks!`;

        const foodCard = document.createElement('div');
        foodCard.className = 'choice-card';
        foodCard.style.borderColor = '#38BDF8';
        foodCard.innerHTML = `
          <div class="card-emoji">${currentRound.emoji}</div>
          <div class="card-label">${currentRound.name}</div>
        `;
        foodCard.onclick = () => speak(currentRound.name);
        tray.appendChild(foodCard);
      }

      speak(currentRound.speech);
    }

    function checkChoice(cardEl, isCorrect, spokenWord) {
      if (locked) return;
      if (isCorrect) {
        locked = true;
        cardEl.classList.add('correct');
        const pZone = document.getElementById('patient-zone');
        const ouchBadge = document.getElementById('ouch-badge');
        pZone.classList.add('healed');
        ouchBadge.classList.add('healed');
        ouchBadge.textContent = '😊 ALL BETTER!';
        document.getElementById('teddy-container').innerHTML = renderTeddySVG(currentRound.spot, true);

        playWinSound();
        stars++;
        document.getElementById('star-count').textContent = stars;
        fireConfetti();
        roundIndex++;
        speak(currentRound.winSpeech || `${spokenWord}! Great job!`, () => {
          loadRound();
        });
      } else {
        playSoftTap();
        cardEl.classList.add('wrong');
        speak(`Try again! Look for ${currentRound.toolName || currentRound.name}`);
      }
    }

    function handleBinTap(binType) {
      if (locked || mode !== 'food') return;
      if (binType === currentRound.type) {
        locked = true;
        playWinSound();
        const msg = binType === 'good'
          ? `Yes! ${currentRound.name} is healthy and good for your body!`
          : `That is right! ${currentRound.name} is a sugary sometime treat!`;
        stars++;
        document.getElementById('star-count').textContent = stars;
        fireConfetti();
        roundIndex++;
        speak(msg, () => {
          loadRound();
        });
      } else {
        playSoftTap();
        speak('Try the other box!');
      }
    }

    // Confetti
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function fireConfetti() {
      const colors = ['#22C55E', '#38BDF8', '#FACC15', '#F472B6', '#A855F7'];
      for (let i = 0; i < 45; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.8) * 16,
          size: Math.random() * 10 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 65
        });
      }
      requestAnimationFrame(updateConfetti);
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      });
      if (particles.length > 0) requestAnimationFrame(updateConfetti);
    }

    window.addEventListener('DOMContentLoaded', loadRound);
  </script>
</body>
</html>
