<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maths Adventure | Able & Beyond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #E0F2FE;
      --bg-bottom: #FEF3C7;
      --primary: #0284C7;
      --primary-dark: #0369A1;
      --complex: #7C3AED;
      --complex-dark: #5B21B6;
      --green: #16A34A;
      --text: #0F172A;
    }

    body.complex-theme {
      --bg-top: #EDE9FE;
      --bg-bottom: #DBEAFE;
      --primary: #7C3AED;
      --primary-dark: #5B21B6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background 0.3s;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.95);
      border-bottom: 4px solid #BAE6FD;
      z-index: 20;
      flex-shrink: 0;
      gap: 10px;
      flex-wrap: wrap;
    }
    body.complex-theme .top-bar {
      border-bottom-color: #C4B5FD;
    }

    .back-btn {
      text-decoration: none;
      background: #FFFFFF;
      color: var(--primary-dark);
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      padding: 8px 16px;
      border-radius: 50px;
      border: 3px solid #93C5FD;
      box-shadow: 0 4px 0 #93C5FD;
      transition: transform 0.1s;
    }
    .back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #93C5FD; }

    /* PROMINENT SIMPLE vs COMPLEX SWITCHER */
    .level-switcher {
      display: flex;
      background: #F1F5F9;
      padding: 5px;
      border-radius: 50px;
      border: 3px solid #CBD5E1;
      gap: 6px;
    }

    .diff-btn {
      border: none;
      border-radius: 50px;
      padding: 8px 20px;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1rem, 2vw, 1.25rem);
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: #475569;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .diff-btn.active-simple {
      background: #16A34A;
      color: #FFFFFF;
      box-shadow: 0 4px 0 #14532D;
    }
    .diff-btn.active-complex {
      background: #7C3AED;
      color: #FFFFFF;
      box-shadow: 0 4px 0 #4C1D95;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: #FFFFFF;
      border: 3px solid #CBD5E1;
      border-radius: 50px;
      padding: 7px 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 4px 0 #CBD5E1;
      transition: all 0.15s;
    }
    .ctrl-btn.active {
      background: #DCFCE7;
      border-color: #22C55E;
      color: #166534;
      box-shadow: 0 4px 0 #22C55E;
    }

    .star-box {
      background: #FEF9C3;
      border: 3px solid #FACC15;
      border-radius: 50px;
      padding: 7px 15px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      color: #854D0E;
      box-shadow: 0 4px 0 #FACC15;
    }

    /* MODE TABS */
    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.68);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .mode-tab {
      background: #FFFFFF;
      border: 4px solid #CBD5E1;
      border-radius: 50px;
      padding: 8px 18px;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(0.95rem, 1.8vw, 1.2rem);
      color: #475569;
      cursor: pointer;
      box-shadow: 0 4px 0 #CBD5E1;
      transition: all 0.15s;
    }
    .mode-tab.active {
      background: var(--primary);
      border-color: var(--primary-dark);
      color: #FFFFFF;
      box-shadow: 0 4px 0 var(--primary-dark);
      transform: translateY(-2px);
    }

    /* MAIN STAGE */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 20px;
      overflow-y: auto;
    }

    .prompt-banner {
      background: #FFFFFF;
      border: 5px solid var(--primary);
      border-radius: 30px;
      padding: 10px 26px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.15s;
      text-align: center;
    }
    .prompt-banner:active { transform: scale(0.97); }
    .prompt-text {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      color: var(--text);
    }

    /* VISUAL WORKSPACE CARD */
    .visual-box {
      background: rgba(255, 255, 255, 0.94);
      border: 6px solid #93C5FD;
      border-radius: 36px;
      padding: 20px 28px;
      min-height: 210px;
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.08);
      margin: 8px 0;
    }
    body.complex-theme .visual-box {
      border-color: #C4B5FD;
    }

    /* TAP-TO-COUNT ITEMS */
    .count-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      max-width: 680px;
    }

    .count-item {
      width: clamp(72px, 12vw, 96px);
      height: clamp(72px, 12vw, 96px);
      background: #F8FAFC;
      border: 4px solid #CBD5E1;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.6rem, 5vw, 3.6rem);
      cursor: pointer;
      position: relative;
      box-shadow: 0 6px 0 #CBD5E1;
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .count-item.counted {
      background: #DCFCE7;
      border-color: #22C55E;
      box-shadow: 0 6px 0 #16A34A;
      transform: scale(1.08);
    }
    .count-item.crossed {
      opacity: 0.38;
      background: #FEE2E2;
      border-color: #FCA5A5;
    }
    .count-item.crossed::after {
      content: '❌';
      position: absolute;
      font-size: 2rem;
    }
    .count-badge {
      position: absolute;
      top: -10px;
      right: -10px;
      background: #16A34A;
      color: #FFFFFF;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #FFFFFF;
    }

    /* EQUATION DISPLAY */
    .equation-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2.5vw, 24px);
      flex-wrap: wrap;
    }

    .eq-group {
      background: #F8FAFC;
      border: 4px solid #E2E8F0;
      border-radius: 26px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .eq-emojis {
      font-size: clamp(2rem, 4vw, 2.9rem);
      letter-spacing: 3px;
      line-height: 1.15;
      max-width: 240px;
      text-align: center;
    }
    .eq-num {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2rem, 4vw, 2.8rem);
      color: var(--primary-dark);
    }
    .eq-symbol {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2.4rem, 4.5vw, 3.4rem);
      color: #F59E0B;
    }
    .eq-mystery {
      width: clamp(78px, 12vw, 105px);
      height: clamp(78px, 12vw, 105px);
      background: #FEF3C7;
      border: 5px dashed #F59E0B;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2.4rem, 4.5vw, 3.2rem);
      color: #B45309;
    }

    /* TEN FRAME (FOR BONDS) */
    .ten-frame {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      background: #E2E8F0;
      padding: 10px;
      border-radius: 20px;
      border: 4px solid #94A3B8;
    }
    .frame-cell {
      width: clamp(44px, 7vw, 60px);
      height: clamp(44px, 7vw, 60px);
      background: #FFFFFF;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
    }
    .frame-cell.empty-slot {
      background: #FEF9C3;
      border: 3px dashed #F59E0B;
    }

    /* UK COINS */
    .coins-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
    }
    .uk-coin {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 rgba(0,0,0,0.22);
      transition: transform 0.15s;
    }
    .uk-coin:active { transform: scale(0.92); }
    .coin-copper {
      width: 72px; height: 72px;
      background: radial-gradient(circle, #FDBA74 0%, #C2410C 85%);
      border: 5px solid #9A3412;
      color: #FFFFFF;
      font-size: 1.5rem;
    }
    .coin-silver {
      width: 76px; height: 76px;
      background: radial-gradient(circle, #F8FAFC 0%, #94A3B8 85%);
      border: 5px solid #64748B;
      color: #0F172A;
      font-size: 1.55rem;
    }
    .coin-gold {
      width: 84px; height: 84px;
      background: radial-gradient(circle, #FEF08A 0%, #EAB308 70%, #CA8A04 100%);
      border: 6px solid #A16207;
      color: #713F12;
      font-size: 1.7rem;
    }

    /* ANSWER CHOICES TRAY */
    .tray {
      display: flex;
      justify-content: center;
      gap: clamp(14px, 2.5vw, 26px);
      width: 100%;
      max-width: 960px;
      flex-wrap: wrap;
      z-index: 10;
    }

    .answer-card {
      background: #FFFFFF;
      border: 6px solid #CBD5E1;
      border-radius: 28px;
      min-width: clamp(130px, 20vw, 195px);
      height: clamp(115px, 19vh, 155px);
      padding: 10px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 10px 0 #CBD5E1, 0 12px 24px rgba(0,0,0,0.08);
      transition: all 0.15s;
    }
    .answer-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 12px 0 var(--primary);
    }
    .answer-card.correct {
      background: #DCFCE7;
      border-color: #16A34A;
      box-shadow: 0 10px 0 #15803D;
      animation: bounceWin 0.6s ease;
    }
    .answer-card.wrong {
      opacity: 0.35;
      transform: scale(0.92);
    }

    .ans-number {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2.6rem, 5vw, 3.8rem);
      color: var(--text);
      line-height: 1;
    }
    .ans-dots {
      font-size: 1.15rem;
      letter-spacing: 2px;
    }

    @keyframes bounceWin {
      0%, 100% { transform: scale(1); }
      40% { transform: scale(1.15) rotate(-4deg); }
      70% { transform: scale(1.1) rotate(4deg); }
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <!-- TOP BAR -->
  <header class="top-bar">
    <a href="https://games.ableandbeyond.support/index.html" class="back-btn">⬅️ Hub</a>

    <!-- SIMPLE vs COMPLEX BUTTON SWITCHER -->
    <div class="level-switcher" role="group" aria-label="Difficulty Mode">
      <button class="diff-btn active-simple" id="btn-simple" onclick="setComplexity('simple')">
        🌱 Simple Maths
      </button>
      <button class="diff-btn" id="btn-complex" onclick="setComplexity('complex')">
        🚀 Complex Maths
      </button>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="cards-btn" onclick="toggleCardCount()">🃏 2 Cards</button>
      <button class="ctrl-btn active" id="voice-btn" onclick="toggleVoice()">🗣️ Voice: ON</button>
      <button class="ctrl-btn active" id="sound-btn" onclick="toggleSound()">🎵 Sound: ON</button>
      <div class="star-box">⭐ <span id="star-count">0</span></div>
    </div>
  </header>

  <!-- DYNAMIC MODE TABS -->
  <nav class="mode-bar" id="mode-bar"></nav>

  <!-- MAIN STAGE -->
  <main class="stage">
    <div class="prompt-banner" onclick="speakPrompt()">
      <span class="prompt-text" id="prompt-text">Count the apples!</span>
      <span style="font-size: 1.7rem;">🔊</span>
    </div>

    <div class="visual-box" id="visual-box"></div>

    <div class="tray" id="tray"></div>
  </main>

  <script>
    // Starts in SIMPLE mode by default, with a prominent Complex Maths button!
    let complexity = 'simple'; // 'simple' | 'complex'
    let mode = 'count';
    let cardCount = 2; // 2 in Simple by default, 3 in Complex by default
    let voiceOn = true;
    let soundOn = true;
    let stars = 0;
    let locked = false;
    let currentSpeech = '';
    let tappedCount = 0;

    const SIMPLE_MODES = [
      { id: 'count',    label: '🍎 1. Count (1–5)' },
      { id: 'count10',  label: '🌟 2. Count (1–10)' },
      { id: 'add_pic',  label: '➕ 3. Picture Add' },
      { id: 'sub_pic',  label: '➖ 4. Take Away' },
      { id: 'more',     label: '⚖️ 5. More or Less' }
    ];

    const COMPLEX_MODES = [
      { id: 'bonds10',  label: '🔟 1. Make 10 & 20' },
      { id: 'big_ops',  label: '🧮 2. Add & Subtract (to 30)' },
      { id: 'multiply', label: '✖️ 3. Times Arrays (×)' },
      { id: 'divide',   label: '➗ 4. Equal Sharing (÷)' },
      { id: 'money',    label: '🪙 5. UK Money (p / £)' },
      { id: 'pattern',  label: '🧩 6. Number Patterns' }
    ];

    const COUNT_EMOJIS = [
      { emoji: '🍎', name: 'apples' },
      { emoji: '🦆', name: 'ducks' },
      { emoji: '🍓', name: 'strawberries' },
      { emoji: '🚗', name: 'cars' },
      { emoji: '🍪', name: 'cookies' },
      { emoji: '⭐', name: 'stars' },
      { emoji: '🐸', name: 'frogs' }
    ];

    // Audio
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playCountPop(n) {
      if (!soundOn) return;
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(360 + n * 45, ctx.currentTime);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.16);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.17);
      } catch (e) {}
    }

    function playWinChime() {
      if (!soundOn) return;
      try {
        const ctx = getAudio();
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.18, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.26);
        });
      } catch (e) {}
    }

    function speak(text) {
      if (!voiceOn || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-GB';
      u.rate = 0.9;
      u.pitch = 1.08;
      window.speechSynthesis.speak(u);
    }

    function speakPrompt() {
      speak(currentSpeech);
    }

    function setComplexity(level) {
      complexity = level;
      document.body.classList.toggle('complex-theme', complexity === 'complex');
      const btnSimple = document.getElementById('btn-simple');
      const btnComplex = document.getElementById('btn-complex');

      if (complexity === 'simple') {
        btnSimple.className = 'diff-btn active-simple';
        btnComplex.className = 'diff-btn';
        cardCount = 2;
        mode = SIMPLE_MODES[0].id;
      } else {
        btnSimple.className = 'diff-btn';
        btnComplex.className = 'diff-btn active-complex';
        cardCount = 3;
        mode = COMPLEX_MODES[0].id;
      }
      document.getElementById('cards-btn').textContent = `🃏 ${cardCount} Cards`;
      renderModeTabs();
      loadRound();
    }

    function renderModeTabs() {
      const bar = document.getElementById('mode-bar');
      const list = complexity === 'simple' ? SIMPLE_MODES : COMPLEX_MODES;
      bar.innerHTML = list.map(m => `
        <button class="mode-tab ${m.id === mode ? 'active' : ''}" onclick="selectMode('${m.id}')">
          ${m.label}
        </button>
      `).join('');
    }

    function selectMode(id) {
      mode = id;
      renderModeTabs();
      loadRound();
    }

    function toggleCardCount() {
      cardCount = cardCount === 2 ? 3 : (cardCount === 3 ? 4 : 2);
      document.getElementById('cards-btn').textContent = `🃏 ${cardCount} Cards`;
      loadRound();
    }

    function toggleVoice() {
      voiceOn = !voiceOn;
      const btn = document.getElementById('voice-btn');
      btn.textContent = `🗣️ Voice: ${voiceOn ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', voiceOn);
    }

    function toggleSound() {
      soundOn = !soundOn;
      const btn = document.getElementById('sound-btn');
      btn.textContent = `🎵 Sound: ${soundOn ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', soundOn);
    }

    function makeChoices(correctAnswer, minVal = 1, maxVal = 10) {
      const set = new Set([correctAnswer]);
      let guard = 0;
      while (set.size < cardCount && guard < 50) {
        guard++;
        let delta = Math.floor(Math.random() * 5) - 2;
        if (delta === 0) delta = 1;
        let cand = correctAnswer + delta;
        if (cand < minVal) cand = minVal + Math.floor(Math.random() * 3);
        if (cand > maxVal) cand = maxVal - Math.floor(Math.random() * 3);
        if (cand !== correctAnswer && cand >= 0) set.add(cand);
      }
      return Array.from(set).sort(() => Math.random() - 0.5);
    }

    function loadRound() {
      locked = false;
      tappedCount = 0;
      const vbox = document.getElementById('visual-box');
      const tray = document.getElementById('tray');
      vbox.innerHTML = '';
      tray.innerHTML = '';

      const itemObj = COUNT_EMOJIS[Math.floor(Math.random() * COUNT_EMOJIS.length)];

      // ---------------- SIMPLE MODES ----------------
      if (mode === 'count' || mode === 'count10') {
        const maxN = mode === 'count' ? 5 : 10;
        const minN = mode === 'count' ? 1 : 4;
        const target = Math.floor(Math.random() * (maxN - minN + 1)) + minN;

        document.getElementById('prompt-text').textContent = `Tap and count the ${itemObj.Emoji || itemObj.emoji} ${itemObj.name}!`;
        currentSpeech = `Count the ${itemObj.name}! You can tap each one!`;

        const grid = document.createElement('div');
        grid.className = 'count-grid';
        for (let i = 0; i < target; i++) {
          const el = document.createElement('button');
          el.className = 'count-item';
          el.innerHTML = `${itemObj.emoji}`;
          el.onclick = () => {
            if (!el.classList.contains('counted')) {
              tappedCount++;
              el.classList.add('counted');
              el.innerHTML = `${itemObj.emoji}<span class="count-badge">${tappedCount}</span>`;
              playCountPop(tappedCount);
              speak(String(tappedCount));
            } else {
              speak(el.querySelector('.count-badge').textContent);
            }
          };
          grid.appendChild(el);
        }
        vbox.appendChild(grid);

        renderNumberChoices(target, 1, maxN, itemObj.emoji);
      }
      else if (mode === 'add_pic') {
        const a = Math.floor(Math.random() * 4) + 1; // 1..4
        const b = Math.floor(Math.random() * 4) + 1; // 1..4
        const ans = a + b;

        document.getElementById('prompt-text').textContent = `${a} + ${b} = ?`;
        currentSpeech = `What is ${a} plus ${b}? Count all the ${itemObj.name}!`;

        vbox.innerHTML = `
          <div class="equation-row">
            <div class="eq-group">
              <div class="eq-emojis">${itemObj.emoji.repeat(a)}</div>
              <div class="eq-num">${a}</div>
            </div>
            <div class="eq-symbol">+</div>
            <div class="eq-group">
              <div class="eq-emojis">${itemObj.emoji.repeat(b)}</div>
              <div class="eq-num">${b}</div>
            </div>
            <div class="eq-symbol">=</div>
            <div class="eq-mystery" id="mystery-box">?</div>
          </div>
        `;
        renderNumberChoices(ans, 2, 9, itemObj.emoji);
      }
      else if (mode === 'sub_pic') {
        const a = Math.floor(Math.random() * 5) + 3; // 3..7
        const b = Math.floor(Math.random() * (a - 1)) + 1; // 1..a-1
        const ans = a - b;

        document.getElementById('prompt-text').textContent = `${a} − ${b} = ?`;
        currentSpeech = `${a} take away ${b}. Count how many ${itemObj.name} are left!`;

        const grid = document.createElement('div');
        grid.className = 'count-grid';
        for (let i = 0; i < a; i++) {
          const el = document.createElement('div');
          const isCrossed = i >= ans;
          el.className = `count-item ${isCrossed ? 'crossed' : ''}`;
          el.textContent = itemObj.emoji;
          grid.appendChild(el);
        }
        vbox.appendChild(grid);
        renderNumberChoices(ans, 1, 7, itemObj.emoji);
      }
      else if (mode === 'more') {
        const a = Math.floor(Math.random() * 5) + 1;
        let b = Math.floor(Math.random() * 5) + 1;
        if (b === a) b = a < 5 ? a + 2 : a - 2;
        const askMore = Math.random() > 0.35;
        const winner = askMore ? Math.max(a, b) : Math.min(a, b);

        document.getElementById('prompt-text').textContent = askMore ? 'Which box has MORE?' : 'Which box has LESS?';
        currentSpeech = askMore ? 'Tap the box that has MORE!' : 'Tap the box that has LESS!';

        vbox.innerHTML = `<div style="font-family:'Fredoka',sans-serif; font-size:1.5rem; color:#475569;">Look at both groups below 👇</div>`;

        [a, b].forEach(val => {
          const btn = document.createElement('button');
          btn.className = 'answer-card';
          btn.style.minWidth = '240px';
          btn.style.height = '170px';
          btn.innerHTML = `
            <div style="font-size:2.3rem; letter-spacing:3px;">${itemObj.emoji.repeat(val)}</div>
            <div class="ans-number" style="font-size:2.3rem;">${val}</div>
          `;
          btn.onclick = () => checkAnswer(btn, val === winner, `${val}! That is right!`);
          tray.appendChild(btn);
        });
        speak(currentSpeech);
        return;
      }

      // ---------------- COMPLEX MODES ----------------
      else if (mode === 'bonds10') {
        const target = Math.random() > 0.4 ? 10 : 20;
        const a = Math.floor(Math.random() * (target - 1)) + 1;
        const ans = target - a;

        document.getElementById('prompt-text').textContent = `Make ${target}:  ${a} + ? = ${target}`;
        currentSpeech = `Number bonds to ${target}. ${a} plus what makes ${target}?`;

        let cellsHTML = '';
        for (let i = 0; i < target; i++) {
          if (i < a) {
            cellsHTML += `<div class="frame-cell">🟢</div>`;
          } else {
            cellsHTML += `<div class="frame-cell empty-slot">❓</div>`;
          }
        }

        vbox.innerHTML = `
          <div class="ten-frame" style="grid-template-columns: repeat(${target === 10 ? 5 : 10}, 1fr);">
            ${cellsHTML}
          </div>
          <div style="font-family:'Fredoka',sans-serif; font-size:1.45rem; color:#4C1D95;">
            🟢 ${a} filled  +  ❓ ${ans} empty  =  ${target}
          </div>
        `;
        renderNumberChoices(ans, 1, target);
      }
      else if (mode === 'big_ops') {
        const isAdd = Math.random() > 0.4;
        let a, b, ans, opSym;
        if (isAdd) {
          a = Math.floor(Math.random() * 14) + 6; // 6..19
          b = Math.floor(Math.random() * 9) + 2;  // 2..10
          ans = a + b;
          opSym = '+';
          currentSpeech = `What is ${a} plus ${b}?`;
        } else {
          a = Math.floor(Math.random() * 15) + 10; // 10..24
          b = Math.floor(Math.random() * 8) + 2;   // 2..9
          ans = a - b;
          opSym = '−';
          currentSpeech = `What is ${a} minus ${b}?`;
        }

        document.getElementById('prompt-text').textContent = `Solve: ${a} ${opSym} ${b} = ?`;

        const tens = Math.floor(ans / 10);
        const ones = ans % 10;

        vbox.innerHTML = `
          <div class="equation-row">
            <div class="eq-group"><div class="eq-num">${a}</div></div>
            <div class="eq-symbol">${opSym}</div>
            <div class="eq-group"><div class="eq-num">${b}</div></div>
            <div class="eq-symbol">=</div>
            <div class="eq-mystery" id="mystery-box">?</div>
          </div>
          <div style="font-family:'Fredoka',sans-serif; font-size:1.2rem; color:#475569;">
            💡 Place Value Hint: Answer has <strong>${tens} Tens</strong> and <strong>${ones} Ones</strong>
          </div>
        `;
        renderNumberChoices(ans, 2, 30);
      }
      else if (mode === 'multiply') {
        const rows = Math.floor(Math.random() * 4) + 2; // 2..5
        const cols = Math.floor(Math.random() * 5) + 2; // 2..6
        const ans = rows * cols;

        document.getElementById('prompt-text').textContent = `${rows} × ${cols} = ?  (${rows} groups of ${cols})`;
        currentSpeech = `What is ${rows} times ${cols}? Count ${rows} rows of ${cols}!`;

        let arrayHTML = '<div style="display:flex; flex-direction:column; gap:6px; background:#F8FAFC; padding:14px 22px; border-radius:24px; border:4px solid #C4B5FD;">';
        for (let r = 0; r < rows; r++) {
          arrayHTML += `<div style="font-size:2rem; letter-spacing:6px;">${'⭐'.repeat(cols)}</div>`;
        }
        arrayHTML += '</div>';

        vbox.innerHTML = arrayHTML;
        renderNumberChoices(ans, 4, 30);
      }
      else if (mode === 'divide') {
        const groups = Math.floor(Math.random() * 3) + 2; // 2..4 plates
        const perGroup = Math.floor(Math.random() * 4) + 2; // 2..5 cookies each
        const total = groups * perGroup;

        document.getElementById('prompt-text').textContent = `${total} ÷ ${groups} = ?  (Share ${total} 🍪 into ${groups} plates)`;
        currentSpeech = `${total} divided by ${groups}. How many cookies on each plate?`;

        let platesHTML = '<div class="equation-row">';
        for (let g = 0; g < groups; g++) {
          platesHTML += `
            <div class="eq-group" style="border-color:#93C5FD; background:#EFF6FF;">
              <div style="font-size:2rem;">${'🍪'.repeat(perGroup)}</div>
              <div style="font-family:'Fredoka',sans-serif; color:#1E40AF;">Plate ${g + 1}</div>
            </div>
          `;
        }
        platesHTML += '</div>';
        vbox.innerHTML = platesHTML;
        renderNumberChoices(perGroup, 1, 10);
      }
      else if (mode === 'money') {
        const COIN_PUZZLES = [
          { coins: [{ val: '5p', type: 'silver' }, { val: '2p', type: 'copper' }], total: 7, unit: 'p' },
          { coins: [{ val: '10p', type: 'silver' }, { val: '5p', type: 'silver' }], total: 15, unit: 'p' },
          { coins: [{ val: '20p', type: 'silver' }, { val: '10p', type: 'silver' }], total: 30, unit: 'p' },
          { coins: [{ val: '50p', type: 'silver' }, { val: '10p', type: 'silver' }], total: 60, unit: 'p' },
          { coins: [{ val: '10p', type: 'silver' }, { val: '10p', type: 'silver' }, { val: '5p', type: 'silver' }], total: 25, unit: 'p' },
          { coins: [{ val: '£1', type: 'gold' }, { val: '£2', type: 'gold' }], total: 3, unit: '£' }
        ];
        const puz = COIN_PUZZLES[Math.floor(Math.random() * COIN_PUZZLES.length)];
        const labelAns = puz.unit === '£' ? `£${puz.total}` : `${puz.total}p`;

        document.getElementById('prompt-text').textContent = `Count the UK Coins! How much money?`;
        currentSpeech = `Add the coins together! How much money is there?`;

        vbox.innerHTML = `
          <div class="coins-row">
            ${puz.coins.map(c => `<div class="uk-coin coin-${c.type}" onclick="speak('${c.val}')">${c.val}</div>`).join('<span class="eq-symbol">+</span>')}
          </div>
        `;

        const nums = makeChoices(puz.total, 2, puz.total + 15);
        nums.forEach(n => {
          const btn = document.createElement('button');
          btn.className = 'answer-card';
          const textVal = puz.unit === '£' ? `£${n}` : `${n}p`;
          btn.innerHTML = `<div class="ans-number">${textVal}</div>`;
          btn.onclick = () => checkAnswer(btn, n === puz.total, `${labelAns}! Correct!`);
          tray.appendChild(btn);
        });
        speak(currentSpeech);
        return;
      }
      else if (mode === 'pattern') {
        const steps = [2, 5, 10];
        const step = steps[Math.floor(Math.random() * steps.length)];
        const start = step * (Math.floor(Math.random() * 3) + 1);
        const seq = [start, start + step, start + step * 2];
        const ans = start + step * 3;

        document.getElementById('prompt-text').textContent = `What number comes next? (+${step} pattern)`;
        currentSpeech = `${seq.join(', ')}... What number comes next?`;

        vbox.innerHTML = `
          <div class="equation-row">
            ${seq.map(n => `<div class="eq-group"><div class="eq-num">${n}</div></div>`).join('<div class="eq-symbol">➔</div>')}
            <div class="eq-symbol">➔</div>
            <div class="eq-mystery" id="mystery-box">?</div>
          </div>
        `;
        renderNumberChoices(ans, step, ans + step * 2);
      }

      speak(currentSpeech);
    }

    function renderNumberChoices(correctAnswer, minVal, maxVal, dotEmoji = null) {
      const tray = document.getElementById('tray');
      const choices = makeChoices(correctAnswer, minVal, maxVal);
      choices.forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'answer-card';
        const showDots = complexity === 'simple' && dotEmoji && num <= 10;
        btn.innerHTML = `
          <div class="ans-number">${num}</div>
          ${showDots ? `<div class="ans-dots">${dotEmoji.repeat(num)}</div>` : ''}
        `;
        btn.onclick = () => checkAnswer(btn, num === correctAnswer, `${correctAnswer}! Well done!`);
        tray.appendChild(btn);
      });
    }

    function checkAnswer(btn, isCorrect, winSpeech) {
      if (locked) return;
      if (isCorrect) {
        locked = true;
        btn.classList.add('correct');
        const mys = document.getElementById('mystery-box');
        if (mys) {
          mys.textContent = btn.querySelector('.ans-number')?.textContent || '✓';
          mys.style.background = '#DCFCE7';
          mys.style.borderColor = '#16A34A';
          mys.style.color = '#14532D';
        }
        playWinChime();
        speak(winSpeech);
        stars++;
        document.getElementById('star-count').textContent = stars;
        fireConfetti();
        setTimeout(loadRound, 1900);
      } else {
        btn.classList.add('wrong');
        speak('Try again!');
      }
    }

    // Confetti
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function fireConfetti() {
      const colors = ['#0284C7', '#22C55E', '#FACC15', '#EC4899', '#7C3AED'];
      for (let i = 0; i < 45; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.8) * 16,
          size: Math.random() * 10 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 65
        });
      }
      requestAnimationFrame(updateConfetti);
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      });
      if (particles.length > 0) requestAnimationFrame(updateConfetti);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderModeTabs();
      loadRound();
    });
  </script>
</body>
</html>
