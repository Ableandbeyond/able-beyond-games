<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Global Lanterns Sensory | Able &amp; Beyond</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Outfit', system-ui, sans-serif;
            background: #FAF6F0;
            color: #1E293B;
            transition: background 0.4s ease;
        }

        button:focus-visible,
        [tabindex="0"]:focus-visible {
            outline: 6px solid #F59E0B !important;
            outline-offset: 4px !important;
            box-shadow: 0 0 0 10px rgba(245, 158, 11, 0.35) !important;
        }

        .app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 14px 18px 28px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 100vh;
        }

        /* --- Simple Top Bar --- */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .back-btn {
            min-height: 76px;
            padding: 12px 26px;
            border-radius: 22px;
            background: #FFFFFF;
            color: #0F172A;
            border: 4px solid #CBD5E1;
            font-family: inherit;
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            box-shadow: 0 6px 0 #94A3B8;
        }

        .back-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #94A3B8;
        }

        .top-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .icon-toggle-btn {
            min-height: 76px;
            padding: 12px 22px;
            border-radius: 22px;
            background: #FFFFFF;
            color: #0F172A;
            border: 4px solid #CBD5E1;
            font-family: inherit;
            font-size: 1.35rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 0 #94A3B8;
        }

        .icon-toggle-btn.active {
            background: #DCFCE7;
            border-color: #22C55E;
            color: #14532D;
            box-shadow: 0 6px 0 #16A34A;
        }

        /* --- 4 Giant Picture Tabs --- */
        .hub-tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
        }

        .hub-tab {
            min-height: 110px;
            border-radius: 26px;
            background: #FFFFFF;
            color: #1E293B;
            border: 5px solid #CBD5E1;
            font-family: inherit;
            font-size: 1.65rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 8px 0 #94A3B8;
            transition: transform 0.15s ease, background 0.2s ease;
        }

        .hub-tab:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 #94A3B8;
        }

        .hub-tab-emoji {
            font-size: 3.4rem;
            line-height: 1;
        }

        .hub-tab.active-harvest {
            background: #FEF3C7;
            border-color: #D97706;
            color: #78350F;
            box-shadow: 0 8px 0 #B45309;
        }

        .hub-tab.active-diwali {
            background: #EDE9FE;
            border-color: #7C3AED;
            color: #4C1D95;
            box-shadow: 0 8px 0 #5B21B6;
        }

        .hub-tab.active-christmas {
            background: #DCFCE7;
            border-color: #16A34A;
            color: #14532D;
            box-shadow: 0 8px 0 #15803D;
        }

        .hub-tab.active-roots {
            background: #FEE2E2;
            border-color: #E11D48;
            color: #881337;
            box-shadow: 0 8px 0 #BE123C;
        }

        /* --- Giant Sensory Stage --- */
        .stage-canvas {
            flex: 1;
            background: #FFFFFF;
            border-radius: 32px;
            border: 5px solid #CBD5E1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 520px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        .stage-grid-2 {
            width: 100%;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: center;
        }

        /* --- Giant Interactive Picture Cards --- */
        .big-pic-card {
            background: #F8FAFC;
            border: 5px solid #CBD5E1;
            border-radius: 28px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            min-height: 200px;
            box-shadow: 0 8px 0 #94A3B8;
            transition: transform 0.15s cubic-bezier(0.18, 1.3, 0.4, 1), background 0.25s;
            font-family: inherit;
        }

        .big-pic-card:hover {
            transform: scale(1.03);
        }

        .big-pic-card:active {
            transform: scale(0.96) translateY(4px);
        }

        .big-pic-card.lit {
            background: #FEF9C3;
            border-color: #EAB308;
            box-shadow: 0 8px 0 #CA8A04, 0 0 30px rgba(250, 204, 21, 0.5);
        }

        .giant-emoji {
            font-size: 5.5rem;
            line-height: 1.05;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.12));
        }

        .card-word {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0F172A;
            text-align: center;
        }

        /* Gong Animation */
        .gong-button {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #FDE047 0%, #F59E0B 55%, #B45309 100%);
            border: 10px solid #78350F;
            box-shadow: 0 14px 30px rgba(120, 53, 15, 0.35), inset 0 0 30px rgba(255,255,255,0.5);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: transform 0.15s ease;
        }

        .gong-button:active {
            transform: scale(0.93);
        }

        @keyframes gongRipple {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.75); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 55px rgba(245, 158, 11, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        .gong-ringing {
            animation: gongRipple 0.75s ease-out;
        }

        /* Diwali Night Sky */
        .diwali-sky {
            background: linear-gradient(180deg, #1E1B4B 0%, #311042 100%) !important;
            border-color: #F59E0B !important;
            color: #FFFFFF;
        }

        .diya-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
            gap: 20px;
            width: 100%;
            margin: auto 0;
        }

        .diya-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 28px;
            padding: 20px 12px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 230px;
            transition: all 0.25s ease;
        }

        .diya-btn.diya-lit {
            background: radial-gradient(circle at 50% 35%, rgba(254, 240, 138, 0.38), rgba(245, 158, 11, 0.18));
            border-color: #FACC15;
            box-shadow: 0 0 35px rgba(250, 204, 21, 0.55);
            transform: translateY(-4px);
        }

        @keyframes flameFlicker {
            0% { transform: scale(1) rotate(-2deg); }
            50% { transform: scale(1.1, 1.16) rotate(2deg); }
            100% { transform: scale(0.97, 1.05) rotate(-1deg); }
        }

        .flame-anim {
            transform-origin: 50% 85%;
            animation: flameFlicker 0.6s infinite alternate ease-in-out;
        }

        /* Drum Bounce */
        @keyframes drumBounce {
            0% { transform: scale(1); }
            35% { transform: scale(1.16) rotate(-3deg); }
            100% { transform: scale(1); }
        }

        .drum-hit {
            animation: drumBounce 0.35s ease-out;
        }

        /* Bottom Action Helper */
        .bottom-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .big-action-pill {
            min-height: 82px;
            padding: 14px 32px;
            border-radius: 24px;
            background: #2563EB;
            color: #FFFFFF;
            border: 4px solid #1E3A8A;
            font-family: inherit;
            font-size: 1.55rem;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 6px 0 #1E3A8A;
        }

        .big-action-pill:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1E3A8A;
        }

        @media (max-width: 820px) {
            .hub-tabs {
                grid-template-columns: repeat(2, 1fr);
            }
            .stage-grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Simple, Clean Top Bar -->
        <header class="top-bar">
            <a href="https://games.ableandbeyond.support/index.html" onclick="goHome(event)" class="back-btn">
                <span>⬅️</span>
                <span>Home</span>
            </a>

            <div class="top-controls">
                <button id="voice-btn" class="icon-toggle-btn active" onclick="toggleVoice()">
                    <span id="voice-emoji">🔊</span>
                    <span id="voice-text">Words: ON</span>
                </button>
                <button class="icon-toggle-btn" onclick="resetCurrentScene()">
                    <span>🔄</span>
                    <span>Reset</span>
                </button>
            </div>
        </header>

        <!-- 4 Giant Picture Tabs (1 Word Each) -->
        <nav class="hub-tabs" aria-label="Festivals">
            <button id="tab-harvest" class="hub-tab active-harvest" onclick="openScene('harvest')">
                <span class="hub-tab-emoji">🌾</span>
                <span>Harvest</span>
            </button>
            <button id="tab-diwali" class="hub-tab" onclick="openScene('diwali')">
                <span class="hub-tab-emoji">🪔</span>
                <span>Diwali</span>
            </button>
            <button id="tab-christmas" class="hub-tab" onclick="openScene('christmas')">
                <span class="hub-tab-emoji">🎄</span>
                <span>Christmas</span>
            </button>
            <button id="tab-roots" class="hub-tab" onclick="openScene('roots')">
                <span class="hub-tab-emoji">🥁</span>
                <span>Drums</span>
            </button>
        </nav>

        <!-- Giant Visual Stage -->
        <main id="stage" class="stage-canvas" role="main">
            <!-- Populated by JS -->
        </main>
    </div>

    <script>
        const state = {
            scene: 'harvest', // 'harvest' | 'diwali' | 'christmas' | 'roots'
            voiceOn: true,
            // Harvest
            cropsInBasket: [false, false, false, false],
            // Diwali
            diwaliMode: 'lamps', // 'lamps' | 'flower'
            lamps: [false, false, false, false, false],
            flowerRings: ['#FDE68A', '#FBCFE8', '#A7F3D0', '#DDD6FE', '#FED7AA'],
            // Christmas
            christmasMode: 'tree', // 'tree' | 'pie'
            treeLightColorIdx: 0,
            treeBaubles: ['🔴', '🔔', '🌟'],
            pieStep: 0,
            // Roots
            drumColors: ['#FEE2E2', '#FEF9C3', '#DCFCE7']
        };

        function goHome(e) {
            if (window.location.hostname === 'games.ableandbeyond.support' || window.location.protocol === 'file:') {
                e.preventDefault();
                if (window.location.pathname.includes('/global-lantern-pathway/')) {
                    window.location.href = '../index.html';
                } else {
                    window.location.href = 'index.html';
                }
            }
        }

        // --- Web Audio API Synthesizer (Rich Musical Sounds) ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = AudioCtx ? new AudioCtx() : null;

        function playSound(type, freq = 440) {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'gong') {
                [220, 330, 443].forEach((f, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = idx === 0 ? 'sine' : 'triangle';
                    osc.frequency.setValueAtTime(f, now);
                    gain.gain.setValueAtTime(0.28 / (idx + 1), now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 1.9);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 1.95);
                });
            } else if (type === 'pop') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.45, now + 0.12);
                gain.gain.setValueAtTime(0.26, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.17);
            } else if (type === 'sparkle') {
                [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now + i * 0.06);
                    gain.gain.setValueAtTime(0.22, now + i * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.28);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + i * 0.06);
                    osc.stop(now + i * 0.06 + 0.3);
                });
            } else if (type === 'drum') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.42, now + 0.24);
                gain.gain.setValueAtTime(0.38, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.27);
            } else if (type === 'reggae') {
                [261.63, 329.63, 392.00].forEach(f => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, now);
                    gain.gain.setValueAtTime(0.16, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.26);
                });
            }
        }

        // Short 1-2 Word Speech Only!
        function sayWord(word) {
            if (!state.voiceOn) return;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(word);
                u.rate = 0.9;
                u.pitch = 1.05;
                window.speechSynthesis.speak(u);
            }
        }

        function toggleVoice() {
            state.voiceOn = !state.voiceOn;
            const btn = document.getElementById('voice-btn');
            btn.classList.toggle('active', state.voiceOn);
            document.getElementById('voice-emoji').textContent = state.voiceOn ? '🔊' : '🔇';
            document.getElementById('voice-text').textContent = state.voiceOn ? 'Words: ON' : 'Words: OFF';
            if (!state.voiceOn && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function openScene(sceneName) {
            state.scene = sceneName;
            playSound('pop', 440);

            const tabs = ['harvest', 'diwali', 'christmas', 'roots'];
            tabs.forEach(t => {
                const el = document.getElementById(`tab-${t}`);
                el.className = 'hub-tab' + (t === sceneName ? ` active-${t}` : '');
            });

            renderScene();
        }

        function resetCurrentScene() {
            playSound('pop', 380);
            if (state.scene === 'harvest') state.cropsInBasket = [false, false, false, false];
            else if (state.scene === 'diwali') state.lamps = [false, false, false, false, false];
            else if (state.scene === 'christmas') { state.treeBaubles = ['🔴', '🔔']; state.pieStep = 0; }
            renderScene();
        }

        function renderScene() {
            const stage = document.getElementById('stage');
            stage.classList.toggle('diwali-sky', state.scene === 'diwali' && state.diwaliMode === 'lamps');

            if (state.scene === 'harvest') renderHarvest(stage);
            else if (state.scene === 'diwali') renderDiwali(stage);
            else if (state.scene === 'christmas') renderChristmas(stage);
            else if (state.scene === 'roots') renderRoots(stage);
        }

        // ============================================================================
        // SCENE 1: HARVEST (GIANT GONG + 4 HUGE CROPS)
        // ============================================================================
        const CROPS = [
            { emoji: '🎃', word: 'Pumpkin', pitch: 350 },
            { emoji: '🌽', word: 'Corn', pitch: 420 },
            { emoji: '🍎', word: 'Apple', pitch: 490 },
            { emoji: '🌾', word: 'Wheat', pitch: 560 }
        ];

        function renderHarvest(stage) {
            const cropsHtml = CROPS.map((c, idx) => {
                const picked = state.cropsInBasket[idx];
                return `
                    <button class="big-pic-card ${picked ? 'lit' : ''}" onclick="tapHarvestCrop(${idx})">
                        <span class="giant-emoji">${picked ? '🧺' + c.emoji : c.emoji}</span>
                        <span class="card-word">${c.word}</span>
                    </button>
                `;
            }).join('');

            stage.innerHTML = `
                <div class="stage-grid-2">
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;">
                        <button id="gong-btn" class="gong-button" onclick="hitGong()" aria-label="Ring Golden Gong">
                            <span style="font-size:5.5rem;">🔔</span>
                            <span style="font-size:2rem; font-weight:800; color:#451A03;">GONG</span>
                        </button>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; width:100%;">
                        ${cropsHtml}
                    </div>
                </div>
            `;
        }

        function hitGong() {
            const btn = document.getElementById('gong-btn');
            if (btn) {
                btn.classList.remove('gong-ringing');
                void btn.offsetWidth;
                btn.classList.add('gong-ringing');
            }
            playSound('gong');
            sayWord('Gong!');
        }

        function tapHarvestCrop(idx) {
            state.cropsInBasket[idx] = !state.cropsInBasket[idx];
            const c = CROPS[idx];
            playSound('pop', c.pitch);
            sayWord(c.word);

            if (state.cropsInBasket.every(Boolean)) {
                playSound('sparkle');
                if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
            }
            renderScene();
        }

        // ============================================================================
        // SCENE 2: DIWALI (5 GIANT GLOWING CLAY LAMPS + GIANT RANGOLI FLOWER)
        // ============================================================================
        function renderDiwali(stage) {
            if (state.diwaliMode === 'lamps') {
                const lampsHtml = state.lamps.map((isLit, idx) => `
                    <button class="diya-btn ${isLit ? 'diya-lit' : ''}" onclick="tapDiya(${idx})" aria-label="Lamp ${idx + 1}">
                        <svg viewBox="0 0 140 150" style="width:130px; height:140px; overflow:visible;">
                            ${isLit ? `
                                <!-- Glowing Aura & Flame -->
                                <circle cx="70" cy="42" r="36" fill="rgba(250, 204, 21, 0.32)"/>
                                <g class="flame-anim">
                                    <path d="M 70 6 Q 94 38 70 64 Q 46 38 70 6 Z" fill="#F97316"/>
                                    <path d="M 70 18 Q 84 40 70 58 Q 56 40 70 18 Z" fill="#FDE047"/>
                                </g>
                            ` : `
                                <!-- Unlit Wick -->
                                <line x1="70" y1="52" x2="70" y2="66" stroke="#94A3B8" stroke-width="5" stroke-linecap="round"/>
                            `}
                            <!-- Clay Bowl -->
                            <path d="M 16 66 Q 70 82 124 66 L 106 116 Q 70 132 34 116 Z" fill="#D97706" stroke="#FDE68A" stroke-width="4"/>
                            <path d="M 28 88 Q 70 100 112 88" fill="none" stroke="#FACC15" stroke-width="4"/>
                        </svg>
                        <span style="font-size:1.7rem; font-weight:800; color:#FFFFFF; margin-top:8px;">
                            ${isLit ? '✨ Lit!' : 'Tap Lamp'}
                        </span>
                    </button>
                `).join('');

                stage.innerHTML = `
                    <div class="diya-grid">${lampsHtml}</div>
                    <div class="bottom-bar">
                        <button class="big-action-pill" style="background:#F59E0B; border-color:#B45309; color:#0F172A;" onclick="lightAllLamps()">
                            <span>✨ Light All</span>
                        </button>
                        <button class="big-action-pill" style="background:#EC4899; border-color:#9D174D;" onclick="state.diwaliMode='flower'; renderScene();">
                            <span>🌸 Paint Flower</span>
                        </button>
                    </div>
                `;
            } else {
                const r = state.flowerRings;
                stage.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; width:100%;">
                        <svg viewBox="0 0 340 340" style="width:320px; height:320px; cursor:pointer;" onclick="paintNextFlowerRing()">
                            <circle cx="170" cy="170" r="158" fill="${r[0]}" stroke="#7C3AED" stroke-width="6"/>
                            <polygon points="170,18 275,65 322,170 275,275 170,322 65,275 18,170 65,65" fill="${r[1]}" stroke="#7C3AED" stroke-width="6"/>
                            <circle cx="170" cy="170" r="110" fill="${r[2]}" stroke="#7C3AED" stroke-width="6"/>
                            <polygon points="170,65 242,98 275,170 242,242 170,275 98,242 65,170 98,98" fill="${r[3]}" stroke="#7C3AED" stroke-width="6"/>
                            <circle cx="170" cy="170" r="55" fill="${r[4]}" stroke="#7C3AED" stroke-width="6"/>
                        </svg>
                    </div>
                    <div class="bottom-bar">
                        <button class="big-action-pill" style="background:#8B5CF6; border-color:#4C1D95;" onclick="paintNextFlowerRing()">
                            <span>🎨 Tap to Colour</span>
                        </button>
                        <button class="big-action-pill" style="background:#F59E0B; border-color:#B45309; color:#0F172A;" onclick="state.diwaliMode='lamps'; renderScene();">
                            <span>🪔 Back to Lamps</span>
                        </button>
                    </div>
                `;
            }
        }

        function tapDiya(idx) {
            state.lamps[idx] = !state.lamps[idx];
            playSound('pop', 440 + idx * 65);
            sayWord('Light!');
            if (state.lamps.every(Boolean)) {
                playSound('sparkle');
                if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
            }
            renderScene();
        }

        function lightAllLamps() {
            state.lamps = [true, true, true, true, true];
            playSound('sparkle');
            sayWord('Bright lights!');
            if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } });
            renderScene();
        }

        const BRIGHT_COLORS = ['#F43F5E', '#FACC15', '#10B981', '#38BDF8', '#A855F7', '#FB923C'];
        let colorCursor = 0;

        function paintNextFlowerRing() {
            colorCursor = (colorCursor + 1) % BRIGHT_COLORS.length;
            state.flowerRings.unshift(BRIGHT_COLORS[colorCursor]);
            state.flowerRings.pop();
            playSound('sparkle');
            sayWord('Colours!');
            renderScene();
        }

        // ============================================================================
        // SCENE 3: CHRISTMAS (GIANT INTERACTIVE TREE + 3-TAP PIE MAKER)
        // ============================================================================
        function renderChristmas(stage) {
            if (state.christmasMode === 'tree') {
                const lightPalettes = [
                    ['#FACC15', '#EF4444', '#38BDF8'],
                    ['#34D399', '#FDE047', '#F472B6'],
                    ['#A855F7', '#38BDF8', '#FACC15']
                ];
                const cols = lightPalettes[state.treeLightColorIdx];
                const coords = [
                    { x: 160, y: 120 }, { x: 125, y: 168 }, { x: 192, y: 165 },
                    { x: 108, y: 218 }, { x: 160, y: 212 }, { x: 210, y: 220 },
                    { x: 92, y: 268 }, { x: 148, y: 272 }, { x: 205, y: 268 }, { x: 235, y: 262 }
                ];

                const baublesSvg = state.treeBaubles.map((b, i) => {
                    const pt = coords[i % coords.length];
                    return `<text x="${pt.x}" y="${pt.y}" font-size="32" text-anchor="middle">${b}</text>`;
                }).join('');

                stage.innerHTML = `
                    <div class="stage-grid-2">
                        <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;" onclick="decorateTree('🌟', 'Star!')">
                            <svg viewBox="0 0 320 330" style="width:100%; max-width:340px; height:auto; filter:drop-shadow(0 10px 16px rgba(0,0,0,0.12));">
                                <!-- Trunk -->
                                <rect x="138" y="280" width="44" height="44" rx="6" fill="#78350F"/>
                                <!-- Pine Branches -->
                                <polygon points="160,22 235,125 85,125" fill="#15803D" stroke="#14532D" stroke-width="4" stroke-linejoin="round"/>
                                <polygon points="160,78 265,205 55,205" fill="#16A34A" stroke="#14532D" stroke-width="4" stroke-linejoin="round"/>
                                <polygon points="160,142 290,285 30,285" fill="#22C55E" stroke="#14532D" stroke-width="4" stroke-linejoin="round"/>
                                <!-- Giant Top Star -->
                                <polygon points="160,2 168,20 188,22 173,35 177,54 160,44 143,54 147,35 132,22 152,20" fill="#FACC15" stroke="#CA8A04" stroke-width="3"/>
                                <!-- Twinkling Lights -->
                                <circle cx="145" cy="95" r="8" fill="${cols[0]}"/>
                                <circle cx="180" cy="102" r="8" fill="${cols[1]}"/>
                                <circle cx="115" cy="155" r="9" fill="${cols[2]}"/>
                                <circle cx="162" cy="150" r="9" fill="${cols[0]}"/>
                                <circle cx="205" cy="158" r="9" fill="${cols[1]}"/>
                                <circle cx="85" cy="238" r="9" fill="${cols[1]}"/>
                                <circle cx="135" cy="245" r="9" fill="${cols[2]}"/>
                                <circle cx="185" cy="240" r="9" fill="${cols[0]}"/>
                                <circle cx="235" cy="235" r="9" fill="${cols[2]}"/>
                                ${baublesSvg}
                            </svg>
                        </div>

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; width:100%;">
                            <button class="big-pic-card lit" onclick="switchTreeLights()">
                                <span class="giant-emoji">💡</span>
                                <span class="card-word">Lights</span>
                            </button>
                            <button class="big-pic-card" onclick="decorateTree('🔴', 'Bauble!')">
                                <span class="giant-emoji">🔴</span>
                                <span class="card-word">Bauble</span>
                            </button>
                            <button class="big-pic-card" onclick="decorateTree('🔔', 'Bell!')">
                                <span class="giant-emoji">🔔</span>
                                <span class="card-word">Bell</span>
                            </button>
                            <button class="big-pic-card" style="background:#FEF3C7; border-color:#F59E0B;" onclick="state.christmasMode='pie'; renderScene();">
                                <span class="giant-emoji">🥧</span>
                                <span class="card-word">Bake Pie</span>
                            </button>
                        </div>
                    </div>
                `;
            } else {
                const pieStages = [
                    { emoji: '🥣', word: '1. Mix Bowl' },
                    { emoji: '🍇', word: '2. Add Fruit' },
                    { emoji: '🥧✨', word: '3. Yummy Pie!' }
                ];
                stage.innerHTML = `
                    <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; width:100%; flex:1; align-items:center;">
                        ${pieStages.map((p, idx) => `
                            <button class="big-pic-card ${idx <= state.pieStep ? 'lit' : ''}" style="min-height:280px;" onclick="tapPieStep(${idx})">
                                <span class="giant-emoji" style="font-size:6.5rem;">${p.emoji}</span>
                                <span class="card-word">${p.word}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div class="bottom-bar">
                        <button class="big-action-pill" style="background:#16A34A; border-color:#14532D;" onclick="state.christmasMode='tree'; renderScene();">
                            <span>🎄 Back to Tree</span>
                        </button>
                    </div>
                `;
            }
        }

        function switchTreeLights() {
            state.treeLightColorIdx = (state.treeLightColorIdx + 1) % 3;
            playSound('sparkle');
            sayWord('Lights!');
            renderScene();
        }

        function decorateTree(ornament, spoken) {
            if (state.treeBaubles.length >= 10) state.treeBaubles = [];
            state.treeBaubles.push(ornament);
            playSound('pop', 500 + state.treeBaubles.length * 35);
            sayWord(spoken);
            if (state.treeBaubles.length % 5 === 0 && typeof confetti === 'function') {
                confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
            }
            renderScene();
        }

        function tapPieStep(idx) {
            state.pieStep = idx;
            if (idx === 2) {
                playSound('sparkle');
                sayWord('Yummy Pie!');
                if (typeof confetti === 'function') confetti({ particleCount: 140, spread: 80, origin: { y: 0.6 } });
            } else {
                playSound('pop', 420 + idx * 90);
                sayWord(idx === 0 ? 'Mix!' : 'Fruit!');
            }
            renderScene();
        }

        // ============================================================================
        // SCENE 4: ROOTS & RHYTHMS (3 GIANT DRUMS THAT BOUNCE & PLAY MUSIC)
        // ============================================================================
        function renderRoots(stage) {
            stage.innerHTML = `
                <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:22px; width:100%; flex:1; align-items:center;">
                    <button id="drum-1" class="big-pic-card" style="min-height:320px; background:#FEE2E2; border-color:#E11D48; box-shadow:0 10px 0 #BE123C;"
                            onclick="hitDrum('drum-1', 'drum', 115, 'Big Drum!')">
                        <span class="giant-emoji" style="font-size:7rem;">🥁</span>
                        <span class="card-word" style="color:#881337;">Big Drum</span>
                    </button>

                    <button id="drum-2" class="big-pic-card" style="min-height:320px; background:#FEF9C3; border-color:#EAB308; box-shadow:0 10px 0 #CA8A04;"
                            onclick="hitDrum('drum-2', 'drum', 230, 'Talking Drum!')">
                        <span class="giant-emoji" style="font-size:7rem;">🪘</span>
                        <span class="card-word" style="color:#713F12;">Talking Drum</span>
                    </button>

                    <button id="drum-3" class="big-pic-card" style="min-height:320px; background:#DCFCE7; border-color:#16A34A; box-shadow:0 10px 0 #15803D;"
                            onclick="hitDrum('drum-3', 'reggae', 330, 'Music!')">
                        <span class="giant-emoji" style="font-size:7rem;">🎶</span>
                        <span class="card-word" style="color:#14532D;">Reggae Music</span>
                    </button>
                </div>
            `;
        }

        function hitDrum(btnId, soundType, freq, word) {
            const el = document.getElementById(btnId);
            if (el) {
                el.classList.remove('drum-hit');
                void el.offsetWidth;
                el.classList.add('drum-hit');
            }
            playSound(soundType, freq);
            sayWord(word);
        }

        // --- Single-Switch / Spacebar Instant Action Support ---
        window.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                if (state.scene === 'harvest') {
                    hitGong();
                } else if (state.scene === 'diwali') {
                    if (state.diwaliMode === 'lamps') {
                        const nextUnlit = state.lamps.indexOf(false);
                        if (nextUnlit !== -1) tapDiya(nextUnlit);
                        else { state.lamps = [false, false, false, false, false]; tapDiya(0); }
                    } else {
                        paintNextFlowerRing();
                    }
                } else if (state.scene === 'christmas') {
                    decorateTree('🌟', 'Star!');
                } else if (state.scene === 'roots') {
                    const pick = Math.floor(Math.random() * 3) + 1;
                    if (pick === 1) hitDrum('drum-1', 'drum', 115, 'Big Drum!');
                    else if (pick === 2) hitDrum('drum-2', 'drum', 230, 'Talking Drum!');
                    else hitDrum('drum-3', 'reggae', 330, 'Music!');
                }
            }
        });

        // Boot straight into Harvest Visual Scene
        renderScene();
    </script>
</body>
</html>
