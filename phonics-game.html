<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Blendy Bot Phonics | Able & Beyond</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&family=Fredoka:wght@600;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-top: #EDE9FE;
      --bg-bottom: #E0F2FE;
      --primary: #7C3AED;
      --primary-dark: #5B21B6;
      --accent: #F59E0B;
      --green: #16A34A;
      --text: #0F172A;
      /* Single-story 'a' and 'g' font stack for early phonics */
      --phonics-font: 'Comic Neue', 'Comic Sans MS', 'Fredoka', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      color: var(--text);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 4px solid #C4B5FD;
      z-index: 20;
      flex-shrink: 0;
      gap: 10px;
      flex-wrap: wrap;
    }

    .back-btn {
      text-decoration: none;
      background: #FFFFFF;
      color: #5B21B6;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      padding: 8px 16px;
      border-radius: 50px;
      border: 3px solid #C4B5FD;
      box-shadow: 0 4px 0 #C4B5FD;
      transition: transform 0.1s;
    }
    .back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #C4B5FD; }

    .game-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.3rem, 2.5vw, 1.9rem);
      color: #5B21B6;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .ctrl-btn {
      background: #FFFFFF;
      border: 3px solid #CBD5E1;
      border-radius: 50px;
      padding: 7px 14px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 4px 0 #CBD5E1;
      transition: all 0.15s;
    }
    .ctrl-btn.active {
      background: #DCFCE7;
      border-color: #22C55E;
      color: #166534;
      box-shadow: 0 4px 0 #22C55E;
    }
    .ctrl-btn:active { transform: translateY(3px); }

    .star-box {
      background: #FEF9C3;
      border: 3px solid #FACC15;
      border-radius: 50px;
      padding: 7px 15px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      color: #854D0E;
      box-shadow: 0 4px 0 #FACC15;
    }

    /* MODE BAR */
    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.65);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .mode-tab {
      background: #FFFFFF;
      border: 4px solid #CBD5E1;
      border-radius: 50px;
      padding: 8px 22px;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1rem, 2vw, 1.25rem);
      color: #475569;
      cursor: pointer;
      box-shadow: 0 5px 0 #CBD5E1;
      transition: all 0.15s;
    }
    .mode-tab.active {
      background: #7C3AED;
      border-color: #5B21B6;
      color: #FFFFFF;
      box-shadow: 0 5px 0 #5B21B6;
      transform: translateY(-2px);
    }

    /* MAIN STAGE */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 20px;
      overflow-y: auto;
    }

    /* MODE 1: BLEND WORD */
    .blend-card {
      background: #FFFFFF;
      border: 6px solid #8B5CF6;
      border-radius: 36px;
      padding: 16px 32px;
      box-shadow: 0 12px 28px rgba(124, 58, 237, 0.18);
      display: flex;
      align-items: center;
      gap: 24px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .blend-card:hover { transform: scale(1.03); }
    .blend-picture {
      font-size: clamp(4.5rem, 10vw, 7rem);
      line-height: 1;
    }
    .blend-word-info {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }
    .blend-whole-word {
      font-family: var(--phonics-font);
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 700;
      color: #4C1D95;
      letter-spacing: 3px;
    }
    .blend-speak-pill {
      background: #F3E8FF;
      color: #6D28D9;
      border: 3px solid #C4B5FD;
      border-radius: 50px;
      padding: 5px 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
    }

    .sound-buttons-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(16px, 3.5vw, 34px);
      margin: 10px 0;
      flex-wrap: wrap;
    }

    .sound-btn-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .phoneme-tile {
      width: clamp(110px, 20vw, 155px);
      height: clamp(120px, 21vh, 165px);
      background: #FFFFFF;
      border: 6px solid #A78BFA;
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--phonics-font);
      font-size: clamp(3.6rem, 7vw, 5.2rem);
      font-weight: 700;
      color: #1E1B4B;
      cursor: pointer;
      box-shadow: 0 10px 0 #8B5CF6, 0 14px 25px rgba(0,0,0,0.1);
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .phoneme-tile.vowel {
      background: #FEF3C7;
      border-color: #F59E0B;
      box-shadow: 0 10px 0 #D97706;
    }
    .phoneme-tile.digraph {
      background: #E0F2FE;
      border-color: #0284C7;
      box-shadow: 0 10px 0 #0369A1;
    }
    .phoneme-tile.lit {
      background: #DCFCE7;
      border-color: #16A34A;
      color: #14532D;
      box-shadow: 0 10px 0 #15803D, 0 0 25px rgba(34, 197, 94, 0.5);
      transform: translateY(-8px) scale(1.07);
    }

    .sound-dot {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #F59E0B;
      border: 4px solid #B45309;
      cursor: pointer;
      box-shadow: 0 4px 0 #B45309;
      transition: all 0.15s;
    }
    .sound-dot.dash {
      width: 78px;
      border-radius: 20px;
      background: #0284C7;
      border-color: #0369A1;
      box-shadow: 0 4px 0 #0369A1;
    }
    .sound-dot.lit {
      background: #22C55E;
      border-color: #15803D;
      box-shadow: 0 4px 0 #15803D;
      transform: scale(1.18);
    }

    .blend-Controls-row {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .big-blend-btn {
      background: linear-gradient(180deg, #22C55E 0%, #16A34A 100%);
      color: #FFFFFF;
      border: 5px solid #15803D;
      border-radius: 50px;
      padding: 12px 32px;
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.3rem, 2.5vw, 1.75rem);
      cursor: pointer;
      box-shadow: 0 8px 0 #14532D;
      transition: transform 0.15s;
    }
    .big-blend-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #14532D; }

    .next-word-btn {
      background: #FFFFFF;
      color: #5B21B6;
      border: 4px solid #A78BFA;
      border-radius: 50px;
      padding: 12px 24px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 6px 0 #A78BFA;
    }

    /* MODE 2: FIRST SOUND MATCH */
    .choice-tray {
      display: flex;
      justify-content: center;
      gap: clamp(16px, 3vw, 30px);
      flex-wrap: wrap;
      width: 100%;
      max-width: 900px;
    }

    .letter-choice-card {
      width: clamp(145px, 24vw, 210px);
      height: clamp(150px, 24vh, 195px);
      background: #FFFFFF;
      border: 6px solid #CBD5E1;
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: 0 10px 0 #CBD5E1, 0 14px 25px rgba(0,0,0,0.08);
      transition: all 0.15s;
    }
    .letter-choice-card:hover {
      transform: translateY(-4px);
      border-color: #7C3AED;
      box-shadow: 0 12px 0 #7C3AED;
    }
    .letter-choice-card.correct {
      background: #DCFCE7;
      border-color: #16A34A;
      box-shadow: 0 10px 0 #15803D;
      animation: bounceWin 0.6s ease;
    }
    .letter-choice-card.wrong {
      opacity: 0.35;
      transform: scale(0.92);
    }
    .letter-glyph {
      font-family: var(--phonics-font);
      font-size: clamp(3.6rem, 7vw, 5rem);
      font-weight: 700;
      color: #1E1B4B;
      line-height: 1;
    }
    .letter-hint {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      color: #64748B;
    }

    /* MODE 3: SOUND BOARD */
    .set-subbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
    }
    .set-pill {
      background: #FFFFFF;
      border: 3px solid #C4B5FD;
      border-radius: 50px;
      padding: 6px 16px;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.05rem;
      color: #5B21B6;
      cursor: pointer;
    }
    .set-pill.active {
      background: #5B21B6;
      color: #FFFFFF;
      border-color: #4C1D95;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 14px;
      width: 100%;
      max-width: 920px;
      padding: 6px;
    }

    .board-card {
      background: #FFFFFF;
      border: 5px solid #C4B5FD;
      border-radius: 26px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 7px 0 #C4B5FD;
      transition: transform 0.15s;
    }
    .board-card:hover { transform: translateY(-4px); border-color: #7C3AED; }
    .board-card:active { transform: translateY(3px); box-shadow: 0 2px 0 #7C3AED; }

    .board-letter {
      font-family: var(--phonics-font);
      font-size: 2.8rem;
      font-weight: 700;
      color: #4C1D95;
      line-height: 1;
    }
    .board-emoji { font-size: 2.3rem; line-height: 1.1; }
    .board-word {
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      color: #475569;
      text-transform: uppercase;
    }

    @keyframes bounceWin {
      0%, 100% { transform: scale(1); }
      40% { transform: scale(1.15) rotate(-4deg); }
      70% { transform: scale(1.1) rotate(4deg); }
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <header class="top-bar">
    <a href="https://games.ableandbeyond.support/index.html" class="back-btn">⬅️ Hub</a>
    <div class="game-title">🤖 Blendy Bot Phonics</div>
    <div class="controls">
      <button class="ctrl-btn" id="cards-btn" onclick="toggleCardCount()">🃏 2 Cards</button>
      <button class="ctrl-btn active" id="voice-btn" onclick="toggleVoice()">🗣️ Voice: ON</button>
      <button class="ctrl-btn active" id="sound-btn" onclick="toggleSound()">🎵 Sound: ON</button>
      <div class="star-box">⭐ <span id="star-count">0</span></div>
    </div>
  </header>

  <nav class="mode-bar">
    <button class="mode-tab active" id="tab-blend" onclick="setMode('blend')">🤖 1. Blend Word</button>
    <button class="mode-tab" id="tab-first" onclick="setMode('first')">🎯 2. First Sound</button>
    <button class="mode-tab" id="tab-board" onclick="setMode('board')">🔤 3. Sound Board</button>
  </nav>

  <main class="stage" id="stage"></main>

  <script>
    let mode = 'blend';
    let cardCount = 2;
    let voiceOn = true;
    let soundOn = true;
    let stars = 0;
    let locked = false;
    let wordIdx = 0;
    let firstIdx = 0;
    let boardSetIdx = 0;
    let litIndices = new Set();

    // Pure phonetic utterance strings so Web Speech says the phoneme sound rather than letter names
    const PHONEME_SPEECH = {
      s: 'sss',
      a: 'ah',
      t: 'tuh',
      p: 'puh',
      i: 'ih',
      n: 'nnn',
      m: 'mmm',
      d: 'duh',
      g: 'guh',
      o: 'aw',
      c: 'kuh',
      k: 'kuh',
      e: 'eh',
      u: 'uh',
      r: 'rrr',
      h: 'huh',
      b: 'buh',
      f: 'fff',
      l: 'lll',
      sh: 'shhh',
      ch: 'chuh',
      th: 'thhh',
      ee: 'eee',
      oo: 'ooo'
    };

    const VOWELS = new Set(['a', 'e', 'i', 'o', 'u', 'ee', 'oo']);

    // Mode 1: CVC & Digraph Words with Giant Pictures
    const BLEND_WORDS = [
      { word: 'cat',  sounds: ['c', 'a', 't'],  emoji: '🐱', label: 'CAT' },
      { word: 'dog',  sounds: ['d', 'o', 'g'],  emoji: '🐶', label: 'DOG' },
      { word: 'sun',  sounds: ['s', 'u', 'n'],  emoji: '☀️', label: 'SUN' },
      { word: 'pig',  sounds: ['p', 'i', 'g'],  emoji: '🐷', label: 'PIG' },
      { word: 'bus',  sounds: ['b', 'u', 's'],  emoji: '🚌', label: 'BUS' },
      { word: 'hat',  sounds: ['h', 'a', 't'],  emoji: '🎩', label: 'HAT' },
      { word: 'bed',  sounds: ['b', 'e', 'd'],  emoji: '🛏️', label: 'BED' },
      { word: 'bug',  sounds: ['b', 'u', 'g'],  emoji: '🐛', label: 'BUG' },
      { word: 'cup',  sounds: ['c', 'u', 'p'],  emoji: '🥤', label: 'CUP' },
      { word: 'pen',  sounds: ['p', 'e', 'n'],  emoji: '🖊️', label: 'PEN' },
      { word: 'fish', sounds: ['f', 'i', 'sh'], emoji: '🐟', label: 'FISH' },
      { word: 'ship', sounds: ['sh', 'i', 'p'], emoji: '🚢', label: 'SHIP' }
    ];

    // Mode 3: Sound Board Sets (manageable 6-card groups with picture cues)
    const SOUND_SETS = [
      {
        title: 'Set 1: s a t p i n',
        items: [
          { letter: 's', emoji: '🐍', word: 'snake' },
          { letter: 'a', emoji: '🍎', word: 'apple' },
          { letter: 't', emoji: '🐯', word: 'tiger' },
          { letter: 'p', emoji: '🐷', word: 'pig' },
          { letter: 'i', emoji: '🍦', word: 'igloo' },
          { letter: 'n', emoji: '🪺', word: 'nest' }
        ]
      },
      {
        title: 'Set 2: m d g o c k',
        items: [
          { letter: 'm', emoji: '🌙', word: 'moon' },
          { letter: 'd', emoji: '🐶', word: 'dog' },
          { letter: 'g', emoji: '🐐', word: 'goat' },
          { letter: 'o', emoji: '🐙', word: 'octopus' },
          { letter: 'c', emoji: '🐱', word: 'cat' },
          { letter: 'k', emoji: '🪁', word: 'kite' }
        ]
      },
      {
        title: 'Set 3: e u r h b f l',
        items: [
          { letter: 'e', emoji: '🥚', word: 'egg' },
          { letter: 'u', emoji: '☂️', word: 'umbrella' },
          { letter: 'r', emoji: '🤖', word: 'robot' },
          { letter: 'h', emoji: '🎩', word: 'hat' },
          { letter: 'b', emoji: '🚌', word: 'bus' },
          { letter: 'f', emoji: '🐸', word: 'frog' },
          { letter: 'l', emoji: '🦁', word: 'lion' }
        ]
      },
      {
        title: 'Digraphs: sh ch th ee oo',
        items: [
          { letter: 'sh', emoji: '🚢', word: 'ship' },
          { letter: 'ch', emoji: '🧀', word: 'cheese' },
          { letter: 'th', emoji: '👍', word: 'thumb' },
          { letter: 'ee', emoji: '🐝', word: 'bee' },
          { letter: 'oo', emoji: '🌕', word: 'moon' }
        ]
      }
    ];

    const ALL_SOUNDS = SOUND_SETS.flatMap(s => s.items);

    // Web Audio
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playNote(stepIndex = 0) {
      if (!soundOn) return;
      try {
        const ctx = getAudio();
        const freqs = [440, 523.25, 659.25, 783.99];
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freqs[stepIndex % freqs.length], ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.23);
      } catch (e) {}
    }

    function playWinChime() {
      if (!soundOn) return;
      try {
        const ctx = getAudio();
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.18, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.26);
        });
      } catch (e) {}
    }

    function speak(text, rate = 0.88) {
      if (!voiceOn || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-GB';
      u.rate = rate;
      u.pitch = 1.1;
      window.speechSynthesis.speak(u);
    }

    function speakPhoneme(p) {
      const ph = PHONEME_SPEECH[p] || p;
      speak(ph, 0.82);
    }

    function toggleCardCount() {
      cardCount = cardCount === 2 ? 3 : 2;
      document.getElementById('cards-btn').textContent = `🃏 ${cardCount} Cards`;
      if (mode === 'first') renderStage();
    }

    function toggleVoice() {
      voiceOn = !voiceOn;
      const btn = document.getElementById('voice-btn');
      btn.textContent = `🗣️ Voice: ${voiceOn ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', voiceOn);
    }

    function toggleSound() {
      soundOn = !soundOn;
      const btn = document.getElementById('sound-btn');
      btn.textContent = `🎵 Sound: ${soundOn ? 'ON' : 'OFF'}`;
      btn.classList.toggle('active', soundOn);
    }

    function setMode(m) {
      mode = m;
      ['blend', 'first', 'board'].forEach(k => {
        document.getElementById(`tab-${k}`).classList.toggle('active', k === mode);
      });
      renderStage();
    }

    function renderStage() {
      locked = false;
      litIndices.clear();
      const stage = document.getElementById('stage');

      if (mode === 'blend') {
        const item = BLEND_WORDS[wordIdx % BLEND_WORDS.length];
        stage.innerHTML = `
          <div class="blend-card" onclick="speak('${item.word}')">
            <div class="blend-picture">${item.emoji}</div>
            <div class="blend-word-info">
              <div class="blend-whole-word">${item.word}</div>
              <div class="blend-speak-pill">🔊 Tap each sound below!</div>
            </div>
          </div>

          <div class="sound-buttons-row">
            ${item.sounds.map((s, idx) => {
              const isDigraph = s.length > 1;
              const isVowel = VOWELS.has(s);
              return `
                <div class="sound-btn-col">
                  <button class="phoneme-tile ${isDigraph ? 'digraph' : (isVowel ? 'vowel' : '')}"
                          id="tile-${idx}"
                          onclick="tapSoundButton(${idx}, '${s}')">
                    ${s}
                  </button>
                  <div class="sound-dot ${isDigraph ? 'dash' : ''}"
                       id="dot-${idx}"
                       onclick="tapSoundButton(${idx}, '${s}')"></div>
                </div>
              `;
            }).join('')}
          </div>

          <div class="blend-Controls-row">
            <button class="big-blend-btn" onclick="blendWholeWord()">🤖 BLEND WORD! 🔊</button>
            <button class="next-word-btn" onclick="nextBlendWord()">Next Word ➡️</button>
          </div>
        `;
        speak(`Let's blend ${item.word}! Tap each sound button!`);
      } else if (mode === 'first') {
        const target = ALL_SOUNDS[firstIdx % ALL_SOUNDS.length];
        const distractors = ALL_SOUNDS.filter(x => x.letter !== target.letter)
          .sort(() => Math.random() - 0.5)
          .slice(0, cardCount - 1);
        const choices = [target, ...distractors].sort(() => Math.random() - 0.5);

        stage.innerHTML = `
          <div class="blend-card" onclick="speak('${target.word} starts with ${PHONEME_SPEECH[target.letter]}')">
            <div class="blend-picture">${target.emoji}</div>
            <div class="blend-word-info">
              <div class="blend-whole-word">${target.word.toUpperCase()}</div>
              <div class="blend-speak-pill">🔊 What is the first sound?</div>
            </div>
          </div>

          <div class="choice-tray" id="choice-tray"></div>
          <div></div>
        `;

        const tray = document.getElementById('choice-tray');
        choices.forEach(ch => {
          const btn = document.createElement('button');
          btn.className = 'letter-choice-card';
          btn.innerHTML = `
            <div class="letter-glyph">${ch.letter}</div>
            <div class="letter-hint">${ch.emoji} ${ch.word}</div>
          `;
          btn.onclick = () => {
            if (locked) return;
            if (ch.letter === target.letter) {
              locked = true;
              btn.classList.add('correct');
              playWinChime();
              speak(`${PHONEME_SPEECH[target.letter]} for ${target.word}! Great job!`);
              stars++;
              document.getElementById('star-count').textContent = stars;
              fireConfetti();
              firstIdx++;
              setTimeout(renderStage, 1800);
            } else {
              btn.classList.add('wrong');
              speakPhoneme(ch.letter);
            }
          };
          tray.appendChild(btn);
        });

        speak(`Find the first sound for ${target.word}!`);
      } else if (mode === 'board') {
        const currentSet = SOUND_SETS[boardSetIdx % SOUND_SETS.length];
        stage.innerHTML = `
          <div class="set-subbar">
            ${SOUND_SETS.map((s, idx) => `
              <button class="set-pill ${idx === boardSetIdx ? 'active' : ''}" onclick="selectBoardSet(${idx})">
                ${s.title}
              </button>
            `).join('')}
          </div>

          <div class="board-grid">
            ${currentSet.items.map(item => `
              <button class="board-card" onclick="tapBoardCard('${item.letter}', '${item.word}')">
                <div class="board-letter">${item.letter}</div>
                <div class="board-emoji">${item.emoji}</div>
                <div class="board-word">${item.word}</div>
              </button>
            `).join('')}
          </div>
          <div></div>
        `;
      }
    }

    function tapSoundButton(idx, s) {
      if (locked) return;
      playNote(idx);
      speakPhoneme(s);

      const tile = document.getElementById(`tile-${idx}`);
      const dot = document.getElementById(`dot-${idx}`);
      if (tile) tile.classList.add('lit');
      if (dot) dot.classList.add('lit');

      litIndices.add(idx);
      const item = BLEND_WORDS[wordIdx % BLEND_WORDS.length];
      if (litIndices.size === item.sounds.length) {
        locked = true;
        setTimeout(() => blendWholeWord(true), 650);
      }
    }

    function blendWholeWord(autoAdvance = false) {
      const item = BLEND_WORDS[wordIdx % BLEND_WORDS.length];
      item.sounds.forEach((_, idx) => {
        const tile = document.getElementById(`tile-${idx}`);
        const dot = document.getElementById(`dot-${idx}`);
        if (tile) tile.classList.add('lit');
        if (dot) dot.classList.add('lit');
      });

      playWinChime();
      const spokenSounds = item.sounds.map(s => PHONEME_SPEECH[s] || s).join('... ');
      speak(`${spokenSounds}... ${item.word}!`, 0.9);
      stars++;
      document.getElementById('star-count').textContent = stars;
      fireConfetti();

      if (autoAdvance) {
        setTimeout(() => {
          wordIdx++;
          renderStage();
        }, 2300);
      }
    }

    function nextBlendWord() {
      wordIdx++;
      renderStage();
    }

    function selectBoardSet(idx) {
      boardSetIdx = idx;
      renderStage();
    }

    function tapBoardCard(letter, word) {
      playNote(1);
      speak(`${PHONEME_SPEECH[letter]}... ${word}`);
    }

    // Confetti
    const canvas = document.getElementById('confetti-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function fireConfetti() {
      const colors = ['#7C3AED', '#22C55E', '#F59E0B', '#EC4899', '#3B82F6'];
      for (let i = 0; i < 45; i++) {
        particles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 16,
          vy: (Math.random() - 0.8) * 16,
          size: Math.random() * 10 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: 65
        });
      }
      requestAnimationFrame(updateConfetti);
    }

    function updateConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35;
        p.life--;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      });
      if (particles.length > 0) requestAnimationFrame(updateConfetti);
    }

    window.addEventListener('DOMContentLoaded', renderStage);
  </script>
</body>
</html>
